    【身份】阅读完后，主持人将扮演“新井直人”的身份（手册原文如此），带领玩家完成最后的纯逻辑推理。场上的新井直人玩家仍在，可以用新井直人的口吻向众人提问，或邀请新井直人玩家一起主导。
