- id: p4_03
  title: 中村健案·前情梳理
  type: narration
  minutes: 2
  dm_script: |
    我们先梳理一下之前的事件经过。
    今天是11月1日，而我们是在昨天也就是10月31日登岛的。
    还记得吗？在海上航行的过程中，佐藤光一非要摘下手环，导致命丧当场，而他的尸体就放在船舱内的储物间中。
    下船之时，山口麻衣——也就是我，给船舱上了一把定时锁，会在11月3日中午12点解锁，在此之前，不可能有人能进入船舱，
    而今天早晨，中村健又死在了我们面前，这就是稍后我们要推理的内容。

    看完线索后，想必各位已经知道我们目前正处于哪座岛屿了吧？
  dm_notes: |
    【内容一】结合板书右半部分，梳理之前发生的事件。
    【内容二】最后一句是提问：等待玩家思考回答，答出"漂浮岛"后再进入下一阶段。
    如果玩家不清楚，可提示关注线索中的坐标（南纬8度、东经120度；小林纪子日记中偷看到的漂浮岛坐标正是8-120）。
- id: p4_04
  title: 中村健案·岛屿与设定
  type: narration
  minutes: 2
  dm_script: |
    没错，我们目前所处的坐标为南纬8度，东经120度，而在之前小林纪子的日记中提到过，她偷看的漂浮岛坐标正是8-120，我们已知漂浮岛位于东南半球且不再移动，因此我们现在就身处那座著名的岛屿——漂浮岛。

    那么现在，大家也应该知道我们当时为何会从正西侧上岛了吧。
    虽然上岛时我曾告诉过各位，岛屿的东南西北都有一把这样的铁质楼梯，但是因为岛面的入口在正西侧，南北方是没有入口的，而正东侧就是六角屋，所以我们从正西侧登岛，这里是岛屿唯一的入口。
    上岛后，我们来到四角屋开始推理六角馆案件，结束后继续向东走来到六角屋休息。
    以上就是岛屿的基本情况以及今天这两天的经过。

    接下来说明几个设定：
    （1）关于四角屋，它能旋转，且旋转角度可控，而它的东南西北门只是一个相对概念，门上没有具体的标注，我们只能通过主观认知判断方位。
    （2）至于木屋1与木屋2，门上同样什么都没写，且两座木屋结构一致。
    （3）另外，线索中提到了斩首时间为20分钟，那么从现在开始到今天整场游戏结束，只要存在斩首，我们都默认斩首需要20分钟即可，不存在其他斩首方式会缩短斩首时间。
    （4）最后关于下雨和脚印问题，只要下雨，不管下多久，都会冲刷掉所有脚印，且在雨中走路也不会留脚印。只有雨停的时候走路，才会留下脚印。
  dm_notes: |
    【板书】在板书的左上角写上：现在·六角屋·漂浮岛。
    【内容三】结合白板上的岛屿俯视图，梳理岛屿基本情况。
    【内容四】解读四角屋设定 + 斩首时间 + 下雨问题（四条都要讲清楚，后续推理全靠这些设定）。
