- id: mingzhi
  name: 明智邦彦
  public: 爱开玩笑、口无遮拦的年轻侦探，“时针岛事件”的亲历者之一。剧本第一页写着一句和“动机”有关的座右铭。
  secret_brief: 本作私人视角极少。第二幕里他曾穿着（披着）山本阳介的外套摆pose，他自己的外套也放在走廊尽头的立柜里——这是收束第5、6问的关键，收束之前不要主动提起它的用途。
