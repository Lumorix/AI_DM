    11 若山本死在拿完被子回去的路上，长谷川还能是凶手吗：长谷川具备完美的不在场证明
    12 杀死山本阳介的凶手：吉田和真
    13 长谷川为何认下凶手之位：完成爱人的心愿——一部优秀的推理小说，凶手只能有一个人！
