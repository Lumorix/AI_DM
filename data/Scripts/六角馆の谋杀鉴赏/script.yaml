- id: p4_11
  title: 山本阳介案·案件发布
  type: narration
  minutes: 1
  dm_script: |
    各位侦探，我们来梳理一下山本阳介案的谜面。
    因为山本阳介住的12号房是内开门，如果凶手要从房间里出来，至少需要将门朝内打开至够一个人通过的缝隙，然后出来再关门，可如果这样的话，房间里的弹珠就不会大部分都贴着门边了，凶手是如何做到的？
  dm_notes: |
