- id: p4_19
  title: ？？？案·问题三
  type: discuss
  minutes: 2
  dm_script: |
    我们先来回忆一下，去年六角馆事件发生时，馆内一共有几个人？
    那渔民一共看到几具尸体呢？
    那么问题来了，如果就像渔民所看到的那样，11个人全都死在了六角馆内，那么铃木美雪今天就不可能假扮成吉田和真与我们一同登岛。
    也就是说，在去年的六角馆内，铃木美雪一定用某种手法，在渔民眼前伪造了自己的死亡，她是如何做到的？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】
    【小问答案与确认话术】
    - 馆内人数：6名日记主人 + 3名死者 + 女佣、管家，共11人。
      确认："没错，6名推理社成员也就是日记主人，3名戏剧社成员，再加上女佣和管家，一共11个人。"
    - 渔民看到：5具全尸 + 6颗头，共计11名死者。
      确认："3具面部被损坏的尸体，也就是之前我们所推理的三名死者。年轻女性和老年男性尸体便是女佣和管家。走廊的六颗头便是6名日记的主人。加起来共11名死者，尸体数量是完全吻合的。"
    （dm_script 是一次显示的：先问馆内人数，等玩家答出后念上面的确认；再问渔民看到几具尸体，等玩家答出后念确认，然后再念"那么问题来了……"。）
    【核心答案：铃木美雪的假死手法】
    1. 渔民为何打不开门：铃木美雪当时没死，她在玄关内将大门反锁；等渔民尝试开门发现打不开去找工具后，她再从建筑出来把门关上（不锁）。渔民带着工具回来尝试破坏门锁，门就开了——他以为是他破坏了门锁，但DL-3合金他是砸不烂的，门能打开只能是因为那会根本就没锁。
    2. 如何假死：她提前在沙滩上挖好坑，把脸上涂满血，身体躲在坑里，把头从走廊地板上那个直径25cm的孔洞伸进来，用长发（调查档案提到她是长发）挡住孔洞边沿。亚洲成年女性头颅前后径约18~22cm，25cm的孔洞足够。走廊地板上有很多碎肉和血迹，渔民极度恐惧下不可能逐一检查每一颗头。等渔民离开去报案时，她再用DL-4炸弹炸毁六角馆，自己从现场逃之夭夭。
    【扶车提示（本处无需卡太久，5分钟左右即可）】
    (1) 别忘了，渔民是不知道六角馆的构造的，但铃木美雪很清楚。→ 六角馆走廊地板上有一个孔洞，渔民不知道。
    (2) 大家注意，六角馆最终是在哪里被发现的？→ 在澳大利亚的沙滩上，沙滩是比较特殊的地形，可以挖坑。
    (3) 铃木美雪一定是那11个人中的一个，没有多余的人了。而那5具全尸渔民确认一定已经死亡，如果要假死，就只剩下那六颗头了。→ 如何成为一颗头却还不死？头与身体一定是相连的，渔民只看到了头，说明身体被隐藏了，能藏身体的地方只有建筑下的沙坑里。
    【封堵】玩家可能猜"凶手带一具尸体进去""随机在澳大利亚杀一个倒霉蛋"等多一个人的说法：猜测多一个人或尸体一定需要有佐证，不能"凭空假设、虚空索敌"；澳大利亚或日本凭空消失一个人，一定需要有相关事件体现出来，得知道这个人是谁才行，否则就不构成推理了。
    （手册原注）5具全尸6颗头，渔民确认没有查重（没有重复计数）；且上午10点时升降旋转功能都没有。
- id: p4_20
  title: ？？？案·六角馆假死揭晓
  type: narration
  minutes: 1
  dm_script: |
    我们来复盘一下铃木美雪在六角馆的假死手法。
    1.关于渔民打不开门如何解释：
    已知铃木美雪当时没有死，她在玄关内将大门反锁，等渔民尝试开门发现打不开去找工具之后，再从建筑出来关上门即可，渔民带着工具来的时候直接尝试破坏门锁，然后将门打开了，他以为他破坏了门锁，但实际上DL-3合金他是砸不烂的，他能打开门只能是因为门那会根本就没锁。
    2.如何假死：
    铃木美雪提前在沙滩上挖好坑，将自己的脸上涂满血，然后身体躲在坑里，将头从地板上那个直径25cm的孔洞伸进来，调查档案中提到过她是长发，然后用头发挡住孔洞的边沿处即可，
    亚洲成年女性头颅前后径约18~22cm，所以25cm的孔洞是足够的。
    再加上建筑内走廊地板上有很多碎肉和血迹，渔民极度恐惧下不可能去逐一检查每一颗头，等渔民离开去报案的时候，铃木美雪再用DL-4炸弹炸毁六角馆，自己从现场逃之夭夭。
- id: p4_21
  title: ？？？案·问题四
  type: discuss
  minutes: 2
  dm_script: |
    原来是这样，铃木美雪在渔民面前伪造了自己的死亡，用一个魔术手法就骗过了他的眼睛，果然是愚民啊。
    诶……等等……各位侦探，之前我们得到的结论——今天的案件铃木美雪只能是自杀，只是我们无法解释她如何将自己斩首并分尸在不同的船舱内。
    那么现在，各位有想法了吗？能否告诉我她到底在船上做了什么？
    分布在三个船舱内的头、四肢和躯体是谁的？储物间的焦尸又是谁的？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】
    有了之前"假死手法"的铺垫，此处比较简单，让玩家还原铃木美雪如何在船上"自杀"并斩首、分尸。
    【答案】
    1. 船舱内的假死：人无法用刀将自己斩首（斩首要20分钟），所以众人透过船舱玻璃窗看到铃木美雪的头时，那颗头一定还连着身体。调查档案提到：客舱内的床，床面由一根根金属杆呈十字形焊接而成，床垫上铺有一张拖到地上的巨大床单。同样的"魔术手法"：她把床垫挖个洞，身体藏在床下，头从十字形金属杆中间探出来，用长发遮住床垫破洞边沿，床单拖到地上挡住床下的身体——此时她还没死。
    2. 头、四肢、躯体是谁的：人无法把自己分尸在不同船舱，所以四肢和躯体只能是一直在船上的佐藤光一的；而原本众人认为是佐藤光一的储物间焦尸，才是真正的铃木美雪。
    3. 全过程：铃木美雪提前将储物间内佐藤光一的尸体分尸，把躯体和四肢分别放在隔壁北山诚一与吉田和真的船舱内；然后在船上放火，带着佐藤光一的头来到佐藤光一的船舱，用上述手法伪造自己死亡让侦探们目击；火势凶猛众人无法进入，只能去找灭火设备，且浓烟遮挡视线，她从床下出来，把佐藤光一的头放在床上；随后来到储物间，斩下自己的左臂，静静等待着被大火吞噬。
    扶车方向：①联系刚才六角馆的"头连着身体"魔术手法；②客舱床的结构（十字形金属杆、拖地床单）；③船上一直有哪具尸体？储物间焦尸真的是佐藤光一吗？
- id: p4_22
  title: ？？？案·答案揭晓
  type: narration
  minutes: 1
  dm_script: |
    我们来复盘铃木美雪在船上的“自杀”。
    1.如何在船舱内假死：
    众所周知，人无法用刀将自己斩首，尤其是斩首需要20分钟，那么上船的众人透过船舱玻璃窗看到了铃木美雪的头，那一刻她的头一定连着身体。
    调查档案中提到过：客舱内的床，床面是由一根根金属杆呈十字形焊接而成的，比较简陋，床垫上铺有一张拖到地上的巨大床单。
    至此已经很明显了，同样的“魔术手法”，铃木美雪将床垫挖个洞，身体藏在床下，将自己的头从十字形金属杆中间探出来，用长发遮住床垫破洞的边沿，床单拖到地上，众人看不见床下的身体。
    而此时的铃木美雪一定还没死。
    2.如何斩首分尸成现场呈现的样子：
    既然人无法将自己分尸在不同船舱内，那么众人看到的四肢和躯体就只能是一直在船上的佐藤光一了。
    而原本众人认为储物间内是佐藤光一的那具焦尸才是真正的铃木美雪。
    铃木美雪提前将船舱储物间内的佐藤光一分尸，将躯体和四肢分别放在隔壁北山诚一与吉田和真的船舱内。
    然后在船上放火，带着佐藤光一的头来到佐藤光一的船舱内，按照上述假死手法伪造自己的死亡，让侦探们目击，但此时火势凶猛众人无法进入，只能去找灭火设备，且浓烟遮挡视线，铃木美雪从床下出来，将佐藤光一的头放在床上。
    随后铃木美雪来到储物间，斩下自己的左臂，静静等待着被大火吞噬。

    至此，今天船上发生的一切就都解释得通了。
  dm_notes: |
    【板书】在白板B"11月3日"的凶手处，写上"自杀"。
    本阶段结束后进入手册第五部分（推理大会结束，总结陈词）。
- id: p5_01
  title: 推理大会·总结陈词
  type: narration
  minutes: 2
  dm_script: |
    想必各位侦探很好奇，铃木美雪为什么要这么做。
    那么，就由我来告诉各位这一切的真相吧。

    首先要恭喜各位侦探，你们真的很优秀，抵达了最后的终点。
    没错，那个策划了一切的主办人告诉过我，她叫作铃木美雪。
    她曾说过，如果她死了，也就代表一切都结束了。

    铃木美雪小姐再三叮嘱我，只有当侦探们的推理走到这一步后，才可以将一切真相和盘托出，在此之前务必要保密。

    铃木美雪小姐是一个被仇恨蒙蔽了双眼的人，她想要的，不过是在复仇走到终点前和你们这些名侦探们再较量一次，而她所使用的诡计筹码——是她自己的生命。

    正如去年她在六角馆伪造自己的死亡时一样，今天，她再一次将自己的头颅置于你们眼前，不同的是，这一次，她彻底将自己终结在了地平线号上。

    她渴望赢你们一次，骗过你们一次，但她内心深处却在做着痛苦的挣扎，因为她清楚，诡计的精妙与伟大，是只有在被破解之后才能被人感受到的。

    但可惜愚蠢的日本警方并没有破解她的诡计，六角馆事件的热度也逐渐走低，淡出了人们的视野。

    她无法接受这一切，因为谜底若不被破解，那么诡计的存在也就毫无意义。
    因此她给你们提供了《六角馆无人生还事件》的所有资料，暗中引导着你们解开了她所有的谜题。

    那么现在，我终于可以宣布——推理大会，正式结束了！
  dm_notes: |
    【身份】这是主持人最后一次以“山口麻衣”（推理大会组织者）的身份发言。
    【人设说明】山口麻衣从始至终都没有撒过谎，一切都是按照“推理大会主办人”安排的流程在进行——说白了她就是一个打工人，只是在执行流程而已。
    她接下来陈述的这段“真相”，虽然并不是最终的事实，但这就是她所认为的真相，她也被主办人欺骗了而已。因此山口麻衣的人设从始至终都是一个“兢兢业业打工人”。这只是“铃木美雪是主办人、铃木美雪是凶手、铃木美雪在地平线号上自杀”的伪解答收尾；真正的幕后黑手是长谷川悠人，下一阶段起揭晓。
    念这段时语气真诚、平静，不要暗示后面还有反转。
    念完直接进入下一阶段（人物剧本终章）。
- id: p5_02
  title: 人物剧本·终章
  type: narration
  minutes: 4
  dm_script: 请各位拿出人物剧本，阅读最后一幕【终章】，将人物剧本全部阅读完毕。
  dm_notes: |
    【BGM】关闭所有BGM（阅读最后一幕，本幕无BGM）。
    【主持人】玩家阅读期间，主持人准备“变身”（换装/准备以长谷川悠人身份出场）。
    【本轮人物剧本信息点整合&解读】
    1. 本幕是剧情上的过渡，同时也是推理大会的落幕。
    2. 揭晓了长谷川悠人在一开始准备的那个“小盒子”（原本说要送给表现最优秀的侦探）里装的到底是什么——一把手枪：长谷川拿出盒子，对小岛浩一说话，从盒子中取出手枪，朝小岛浩一开枪（打中肩膀），随后关灯。
    3. 读完这一幕，玩家就知晓了：长谷川悠人才是那个幕后BOSS。
    4. 后续衔接主持人的【变身-出场】（下一阶段）。
    【关于“微演绎”（可选，不建议）】
    本幕原本没有设置主持人微演绎，流程上只需玩家读完全部剧本，然后衔接主持人【变身-出场】即可。
    有主持人想在此加演【长谷川悠人拿出盒子→对小岛浩一说话→从盒中取出手枪→朝小岛浩一开枪→关灯】这几个场景。手册意见：只有在对后续内容足够熟练、道具齐全、排练过、适合自身风格、能够驾驭的前提下才考虑；流程顺滑度更重要，正常情况下不建议加演绎，把精力留给后续推理。
    如确要加演：在玩家阅读本幕剧本时，告知仅需阅读下一页——即阅读至（人物剧本）第26页即可；演绎完再读完后续内容，然后衔接后续流程。
    AI主持时默认不做微演绎，等所有人读完即可进入下一阶段。
- id: p5_03
  title: 鉴赏大会·长谷川登场
  type: narration
  minutes: 2
  dm_script: |
    各位好啊！
    重新自我介绍一下，我的名字叫做——长谷川悠人。
    当然，你们也可以叫我另外一个名字，而这个名字，之前你们已经提到过很多次了——坂田仓介。
    是的，一年前内六角馆中的坂田仓介，就是我。

    至于我的身份嘛……一个凶手罢了。
    没错，一年前的六角馆无人生还事件，以及现在岛上发生的三起案件，这一切，全都出自我之手！

    而现在，我——长谷川悠人，将正式以凶手之名，向诸位名侦探发起最终的推理挑战！同时也邀请各位欣赏我精心准备的谋杀作品。

    推理大会已经结束了，但鉴赏大会，现在才刚刚开始！
    此刻，这里不再是推理的幕后，而是——鉴赏的舞台。
  dm_notes: |
    【身份切换·重要】从本阶段起直到剧本结束，主持人不再是山口麻衣，全程扮演——长谷川悠人（自称“我”），带领玩家完成后续推理（鉴赏大会）。
    【转场】玩家读完终章后：短暂关灯 → 切换BGM：Conflict of Interest → 开灯，长谷川出场（形式上的转场）。
    【板书】说到“坂田仓介”时，将板书翻回A面（六角馆部分）。
    【表演】说到“一个凶手罢了”时耸耸肩，停顿一下。
    【原文说明】“一年前内六角馆中的坂田仓介”是手册原文（“内”字疑为笔误），口播时可念作“一年前六角馆中的坂田仓介”。
    【长谷川悠人的呈现方式（重要）】
    - 主持人要充分了解长谷川的人设和动机（详见后续【我就是你的幽灵】【收束】部分）。
    - 记住每一位玩家扮演的侦探角色，推理过程中用角色身份与玩家充分互动。
    - 后续内容要尽量脱稿推进：每一幅作品的谜面构成与梳理、解答、扶车、封堵、逻辑衔接、话术衔接都要熟。
    - 状态在线、热情饱满、“帅就完了”：这是核心推理阶段，主持人的状态对玩家体感影响很大；每次抛出谜面时要“装”、要帅。
    - 角色代入：长谷川并不是侦探，他明面上只是新井直人的助手，认为新井直人是最优秀的侦探，是新井直人的头号粉丝；性格上此阶段的长谷川活泼开朗、有点话痨、有点中二，喜欢推理、喜欢诡计、向往侦探们的世界。互动性要高：扶车、封堵、甚至开玩笑。
    【严禁“压力”开法】展会上的“压力版”开法只是为了压缩时长，绝不是正常开本的方式。必须以玩家体感为第一优先级，不可以真的压力、凶玩家。只有玩家是熟客、且判断对方能接受时，才可以开一点有分寸的“压力玩笑”。
    【长谷川“语录”（仅用于调节气氛，不含任何信息，也不属于衔接话术；多数带压力属性，务必慎用，AI默认只用温和的几句）】
    - 对新井直人：“新井前辈，到此为止了吗？”（新井作为系列主角，前期自然会受到一些压力，他的高光时刻在最后的收束环节）
    - 对新井直人：“新井前辈，您在时针岛的风采真是让我向往，但我想问，时针岛请代练了？”
    - 对新井直人（“微笑哥”）：“新井前辈，不是您教我的吗，所谓侦探，就是要在逆境中露出微笑的人，但笑容如何破解谜题呢？”
    - 对北山诚一：“北山先生，我非常认可您说的‘不是所有的谜题都应该有答案’，当然，您也可以承认谜题无法破解。”（出自北山诚一剧本第一页，可理解为他的座右铭）
    - 对小岛浩一（带压力，慎用）：“小岛浩一前辈，很抱歉向您的肩膀开了一枪，但我想，推理可不需要用到手臂。”
    - 对明智邦彦：“明智先生，现在可没有询问您动机，那请你向我证明你破解诡计的能力吧！”（出自明智邦彦剧本第一页，他的座右铭）
    - 对岛田琉璃、相泽翡翠（带压力，慎用）：“两位女士，侦探推理可不是过家家。”
    - 对全体（带压力，慎用）：“各位名震日本的侦探，难道就这点实力？”（手册原文写作“名镇日本”）
    - 对全体（过于压力，极慎用）：“各位怎么都沉默了，天生不爱说话吗？”
    - 场外玩笑（压力，慎用）：“看来推理还是太枯燥了，我觉得情感本也不错。”
    念完直接进入第一幅作品。
- id: p5_04
  title: 第一幅作品·作品发布
  type: narration
  minutes: 3
  dm_script: |
    新井前辈，很抱歉我欺骗了你，辜负了你的信任！
    但是，我的第一幅作品，恰恰就是我们一起完成的呀！

    各位侦探，容我来帮你们回忆一下吧！
    还记得之前你们推理出的——六角馆无人生还事件的真相吗？

    远在澳大利亚的沙滩上，凶手铃木美雪利用魔术手法伪造了自己的死亡，紧接着她引爆了六角馆，从现场逃之夭夭。
    可是各位还记得，六角馆在沙滩上爆炸是哪一天吗？
    ……
    没错！去年11月1日的上午10点。
    新井前辈，我来到你的事务所成为助手的时间还记得吗？
    ……
    去年的10月中旬！那么在我来到事务所后的一个月内，我们每天都会做什么你还记得吗？
    ……
    是的，每天上午9:00——11:00我们都会在一起看推理剧。
    那可真是一段令人难忘的时光啊。

    也就是说，去年11月1日六角馆爆炸在澳大利亚沙滩上的瞬间，我正位于地球另一端和你看推理剧呢！

    这完美不在场证明的见证者，不恰恰就是你吗？新井侦探！
    ……
    我说过，我的作品可是百分之一百的完美，
    而新井先生，你就是我心目中满分的名侦探。

    那么请各位侦探告诉我，远在日本和新井直人看着推理剧的我，如何引爆远在澳大利亚沙滩上的六角馆？！

    请欣赏吧，我的第一部作品——《献给名凶犯的不在场证明》，不知各位会给多少分呢？

    来吧各位，请鉴赏我的谋杀作品！
    大家翻阅第一幅作品即可，不要翻过了。
  dm_notes: |
    【BGM】继续 Conflict of Interest。
    【互动等待点及答案】（“……”处停顿，等玩家回忆；都是回忆已知信息，不是谜底，玩家说不出来可直接提示出处）
    ① 六角馆在沙滩上爆炸是哪一天 → 【无人生还事件大卡】：去年11月1日 10:00。
    ② 长谷川来新井事务所当助手的时间 → 【人物剧本第一幕】（每个人本里都有）：去年10月中旬。
    ③ 来事务所后一个月每天做什么 → 【人物剧本第一幕】（每个人本里都有）：每天看推理剧（上午9:00—11:00）。
    【表演】说完“新井侦探！”后停顿一下。说出作品名《献给名凶犯的不在场证明》时，将第一幅作品的板书卡条重重拍在白板上！
    【物料】拍完之后，发放【我的谋杀作品】（每人一册），让玩家翻阅第一幅作品，别翻多了。可场外提示玩家：之后每贴一张作品名字，默认直接翻开下一页。
    【注意】玩家可能在拍出卡条后立刻说出“卫星遥控器”，不要慌，按下一阶段说明处理。
- id: p5_05
  title: 第一幅作品·推理
  type: discuss
  minutes: 2
  dm_script: |
    第一幅作品《献给名凶犯的不在场证明》——
    Q：去年11月1日上午10:00，长谷川悠人身处日本的新井侦探事务所，与新井直人看着推理剧的同时，如何引爆远在澳大利亚沙滩上的六角馆？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】
    【标准答案】用DL-4炸弹的“卫星遥控器”跨地区远程引爆。
    【逻辑】破冰案【DL-4炸弹失窃事件】中介绍过，DL-4炸弹的引爆方式有两种：手动定时和卫星遥控跨地区引爆。之前大家会认为铃木美雪是在现场手动定时引爆，但现在长谷川不行；长谷川只要拿到卫星遥控，就能远在日本操控六角馆内的炸弹爆炸（六角馆安装有微型摄像头，可以看到馆内和周围景象）。
    【扶车方向】提示玩家回忆破冰案【DL-4炸弹失窃事件】里关于炸弹引爆方式的介绍。
    【主持要点】
    - 第一幅作品是后续逻辑链的入口，谜底很简单，玩家可能在主持人解释完谜面、拍出卡条之后就直接说出“卫星遥控器”。此时不要慌张，一切尽在掌握，故作玄虚地反问：“卫星遥控器是吗？确定吗？这就是你给我的答案吗？”
    - 不管玩家多快答出，都要追问一句“确定吗？”——这是在为第二幅作品做铺垫（这个答案会直接引出第二幅作品的谜面）。
    - 等所有人都看完【我的谋杀作品】第一幅的谜面后，再进入下一阶段。
- id: p5_06
  title: 第一幅作品·答案揭晓
  type: narration
  minutes: 1
  dm_script: |
    卫星引爆遥控器是吗？能够炸毁六角馆的只有DL-4炸弹，换句话说我就是那个盗取炸弹的清洁工。
    而我只需要在盗取炸弹的当天，把卫星引爆器也一并偷走，就可以完成这一切，对吗？
    ……
    很好，这就是你们给我的答案！
    各位，逻辑的子弹一旦射出，就再也无法溯洄！
  dm_notes: |
    【BGM】本阶段一开始切换BGM：Star Walkin'（Instrumental）。
    【说明】这段既是对第一幅作品答案（卫星遥控器）的确认，也是第二幅作品的开场。“……”处等待玩家给出肯定回答（“对/是/确定”），之后再说“很好，这就是你们给我的答案！”。
    【复盘要点（玩家如有疑问可补充）】DL-4炸弹可手动定时，也可卫星遥控跨地区引爆；长谷川人在日本，只能用卫星遥控；六角馆装有微型摄像头，可以远程看到馆内和周围景象。
    念完直接进入第二幅作品的谜面。
- id: p5_07
  title: 第二幅作品·作品发布
  type: narration
  minutes: 3
  dm_script: |
    既然如此，我就再帮各位回忆一下好了，不知各位是否记得，存有远程引爆器的储物室，开启它的开关位于哪里？
    ……
    没错，它位于零号实验室主楼1号仓库前的走廊上！我需要来到1号仓库才能按到那个开关按钮。
    那么各位，根据之前的推理，盗窃炸弹的清洁工，最早来到1号仓库的时间是几点？
    ……
    我们之前推理过，清洁工需要搭桐生凉平的顺风车去到1号仓库对吧。
    桐生凉平13:00开始检查，13:01会议室，13:02无菌室，13:03检查1号仓库，而他在离开1号仓库时我便能顺势来到1号仓库。

    也就是说，我最早来到1号仓库的时间是13:03，那么我最早按下储物室开关的时间也就是13:03。
    那么按下这个按钮之后，存放卫星遥控器的储物室会过多久打开？
    ……
    是的，30分钟后会打开！
    如果我13:03按下按钮，那么最早取得卫星遥控器的时间就是13:33！

    各位别忘了，在炸弹失窃的当天，我还去参观了松岛超级工厂！
    根据资料信息，零号实验室和松岛超级工厂之间的路程需要多久？
    ……
    1个小时的路程，因此我在13:33取得卫星引爆器后，抵达超级工厂楼下的最早时间是14:33！
    而各位还记得从超级工厂1楼到达高木凛办公室最快需要多久吗？
    花70秒坐电梯到8楼，然后60秒爬两层楼梯，加起来130秒就按两分钟算。
    也就是说，我到达高木凛办公室的最早时间得是14:35对吧！

    但是！高木凛口供中说过，他在当天14:30就已经带着坂田仓介也就是我参观超级工厂了！

    各位，难道我有两副面孔？
    亦或者说，我能在时间轴上窃取这消失的5分钟呢？

    请欣赏吧，我的第二部作品——《两副面孔的人与五分钟的消失》
    来吧各位，翻阅第二幅谋杀作品！
  dm_notes: |
    【BGM】继续 Star Walkin'（Instrumental）。
    【互动等待点及答案】（“……”处停顿，等玩家回忆；都是回忆已知信息，不是谜底）
    ① 储物室开关在哪 → 【炸弹失窃案04页】：在1号仓库前的走廊。
    ② 清洁工最早到1号仓库的时间 → 主持人带领玩家得到结果即可：13:03末尾/13:04开头（搭桐生凉平顺风车：13:00开始检查、13:01会议室、13:02无菌室、13:03检查1号仓库，凉平离开1号仓库时清洁工顺势进入）。
    ③ 按下开关后储物室多久打开 → 【炸弹失窃案04页】：30分钟后开启。
    ④ 零号实验室到松岛超级工厂的路程 → 【坐标泄漏事件05页】：路程1小时。
    ⑤ 超级工厂1楼到10楼高木凛办公室最快多久 → 坐电梯到8楼70秒 + 爬两层楼梯60秒 = 130秒，按2分钟算。
    【表演】说出作品名《两副面孔的人与五分钟的消失》时，将第二幅作品的板书卡条重重拍在白板上！
    【物料】拍完之后，提示玩家翻阅【谋杀作品】的第二幅作品。
- id: p5_08
  title: 第二幅作品·推理
  type: discuss
  minutes: 4
  dm_script: |
    第二幅作品《两副面孔的人与五分钟的消失》——
    坂田仓介就是盗取炸弹和卫星遥控器的那个清洁工，但他最早在13:33才能拿到遥控器，14:33到达超级工厂，14:35来到10楼高木凛办公室。
    但是高木凛在口供中说14:30就已经见到坂田仓介了，并且资料中说过高木凛是一个时间观念很强的人，不会看错记错时间。
    坂田仓介也无法在参观完了之后回实验室偷遥控器，因为实验室的门卫说过当天14:00之后无人进出过实验室，且放置卫星遥控器的储物室大门开启5分钟就会自动关闭。
    Q：那么，坂田仓介如何让高木凛14:35见到自己？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】
    【题意】最后一问是手册原文，意思是：坂田最早14:35才能到，他是怎样让高木凛以为14:30就见到了自己的？消失的5分钟去了哪里？
    【封堵：时间无处可省】本案在盗取炸弹和遥控器上的时间一定都是卡死了的，因为炸弹失窃案的解答是唯一的，没有更省时的方法；路程1小时也是固定的，绝没有“省时间”的方式；实验室门卫说过当天14:00之后无人进出过实验室，且放置卫星遥控器的储物室大门开启5分钟就会自动关闭，所以坂田也不能参观完再回去偷遥控器。
    【标准答案】高木凛与坂田仓介是“单线联系”：高木凛对接的6名参观学生来自同一社团，该社团的“活动策划”就是坂田仓介；高木凛单独加了坂田的联系方式，6名学生的身份信息都是坂田提供的。高木凛根本不认识这些学生，学生们也不认识高木凛，所以坂田只需把学生的手机号调换，高木凛指定的参观人员顺序就会被改变。
    例：坂田把清水伊织和宫本诚的手机号调换，在高木凛视角中他给清水发了14点准时参观的消息，而实际上收到14点消息的人是宫本诚，那么14点去的人就是宫本诚。高木凛不认识学生，且时间紧迫、近期这种参观活动很多，大家到达办公室后也没有寒暄，直接就去参观了，所以高木凛没有发现。
    【真实参观顺序】（每人10分钟，14:00起）坂田一定在14:35之后才能到，所以只能是第五位（14:40）或第六位（14:50）。正解：坂田第五（14:40—14:50），小林纪子第六（14:50—15:00），前四位顺序不重要。（这一步在下一阶段“答案揭晓”的话术中带出。）
    【易错点·性别陷阱】玩家很容易直接说坂田是第六，理由是“第五位参观者小林纪子是女性，与坂田性别不符，高木凛会发现”。这是不对的：在高木凛的视角里根本不知道这些学生的性别，不能仅凭“小林纪子”这个名字确认对方是女性——叫“××子”的不一定是女性，只是女性居多（例如日本平安时代的贵族“藤原赖子”就是男性）。
    正确依据：小林纪子9月1日的日记里写到，在偷看漂浮岛坐标的那一天，她在去的路上遇到了正要回来的坂田仓介——所以坂田一定在小林之前参观：坂田第五，小林最后。
    【扶车方向】
    1. 玩家可能先想怎么“省出5分钟”，不用急于否定，给几分钟思考，他们会发现无处可省。
    2. 还没有头绪时，提示玩家仔细看高木凛的口供（坂田的身份是“活动策划”、是谁提供的学生信息）。
    3. 当玩家提出“坂田仓介是活动策划，他给高木凛错误名单/假名单/顺序不对的联系方式”时，即可进入下一阶段（答案揭晓）。
    【说明】这幅作品的谜底并不难，主要看玩家的细致程度。
- id: p5_09
  title: 第二幅作品·答案揭晓
  type: narration
  minutes: 2
  dm_script: |
    没错！坂田仓介是活动策划，他与高木凛单线联系，那么他只需要给高木凛一份调换过顺序的联系方式，就可以骗过高木凛。

    那么请问各位，我到底是第几个见到高木凛的人？这对后续的推理很重要。
    ……
    已知我14:35之后才能见到高木凛，那么我只能是14:40的第五位或者14:50的第六位，而小林纪子的日记明确写了她去的时候我刚好离开，那么我就只能是第五位，而小林纪子是第六位。
    也就是说小林纪子的参观时间是14:50—15:00。
  dm_notes: |
    【等待答案】“……”处等待玩家回答。正确答案：第五个。
    【封堵】玩家可能会因为性别问题作答（认为名单上第五位“小林纪子”是女性、高木凛会发现，所以坂田是第六个）——主持人按复盘内容否定这个理由：高木凛视角并不知道学生性别，“××子”不一定是女性（如平安时代贵族“藤原赖子”是男性）。（手册此处原文写作“可能会因为性别问题回答坂田是第五个”，疑为笔误，按复盘逻辑理解。）
    随后提示拿到【小林纪子日记】的玩家，查看其9月1日日记开头的下划线部分（去的路上遇到正要回来的坂田仓介）→ 坂田在小林之前 → 坂田第五、小林第六。
    【消失的5分钟】至此解决：高木凛以为14:30见到的是“坂田仓介”，实际14:30来的是别的学生；坂田真正是14:40第五个到的。
    【复盘要点（玩家如有疑问可补充，用长谷川口吻讲）】坂田是社团活动策划，与高木凛单线联系、提供了6名学生的身份信息；高木凛和学生互不认识、见面没寒暄直接参观；坂田调换学生手机号即可改变实际参观顺序（例：调换清水伊织和宫本诚的手机号，高木以为通知的是清水，实际来的是宫本）。
    本阶段得出的“小林纪子14:50—15:00参观”是下一个问题（漂浮岛真实坐标）的前提，念完直接进入下一阶段。
- id: p5_10
  title: 漂浮岛真实坐标
  type: discuss
  minutes: 2
  dm_script: |
    可是如果这样的话，另一个问题也就随之而来了！
    各位还记不记得，高木凛在14:50的时候把那张写有漂浮岛坐标的便签上下翻转了过来！
    并且高木凛曾对警方说过，之后没人动过那张便签！

    而他翻转便签的这个行为小林纪子不可能知道，小林纪子在完全不知情且时间紧迫的情况下，看到的一定是被上下翻转过后的数字！

    Q：那么请各位侦探告诉我，漂浮岛的真实坐标究竟是多少？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】
    【标准答案】8-150，即南纬8度、东经150度。
    【逻辑】小林纪子的参观时间是14:50—15:00，而高木凛恰好在14:50把便签上下翻转了，之后没人动过 → 小林看到的是翻转后的数字。小林纪子日记中写她看到的坐标是8-120，如果是上下翻转过的，那么原本的坐标就是8-150（“5”上下翻转后看起来像“2”）。
    这里不存在经纬度混淆的情况：三位数的只可能是经度；且已知漂浮岛在东南半球、不再移动，所以便签上无需写S和E。
    【扶车方向】
    1. 提醒玩家回看【坐标泄漏事件】中高木凛14:50翻转便签的口供。
    2. 提醒玩家看小林纪子日记里记下的坐标数字，想想“上下翻转”后每个数字会变成什么。
    玩家答出8-150后进入下一阶段（揭晓+第三幅作品）。
- id: p5_11
  title: 第三幅作品·作品发布
  type: narration
  minutes: 3
  dm_script: |
    小林纪子日记中写过，她看到的坐标是8-120，但如果是上下翻转过的，那么原本的坐标就是8-150。
    这里不存在经纬度混淆的情况，三位数的只可能是经度，且已知漂浮岛在东南半球不再移动，那么便签上也就无需写S和E了。

    是的，漂浮岛的真正坐标是南纬8度，东经150度。
    那我们现在所在的岛屿坐标是多少呢？
    ……
    很遗憾地告诉各位，我们现在，并不在漂浮岛上。
    而那六份日记中都有这样一句话——雾岛和漂浮岛处在同一纬度，但雾岛在经度上比漂浮岛往西30度。

    也就是说，漂浮岛的坐标是8-150，那么雾岛的坐标就是8-120。
    因此，我们现在，就在雾岛之上。

    各位侦探，还请不要停止思考！
    有一个更加严峻的问题摆在你们面前。

    我才是一年前六角馆无人生还事件的凶手，铃木美雪去年就被我杀死在了六角馆内，而早在六角馆爆炸前我就需要将她的尸体带走，今天各位才能在船舱内看到她。

    因此，去年六角馆爆炸那一刻，里边根本就不可能有铃木美雪的尸体。
    而我当时正在日本跟新井直人看着推理剧，同样不在六角馆内。

    那么去年渔民在六角馆内发现尸体那一刻，里边既没有铃木美雪，也没有我坂田仓介，
    馆内一共11个人，少了2个，渔民凭什么还能看到11具尸体？！

    侦探们，请告诉我答案吧！

    当然，如果你们迟迟想不明白的话，就把我和铃木美雪当成幽灵吧，也许这样，一切就说得通了。
    这，就是我的第三部作品——《六角馆幽灵》！
    来吧各位，翻阅第三幅谋杀作品！
  dm_notes: |
    【说明】开头两句（8-120翻转回来是8-150、三位数只可能是经度）在手册里是玩家答出8-150后的讲解文字，从“是的，漂浮岛的真正坐标……”起是长谷川的台词。
    【等待答案】“……”处等待玩家回答“我们现在所在岛屿的坐标” → 8-120（出自【调查档案】第一案）。
    【板书】说到“我们现在，就在雾岛之上”后，将白板B的左上角“漂浮岛”擦掉，改为“雾岛”。
    【BGM】说完“有一个更加严峻的问题摆在你们面前”后，切换BGM：Zisa。
    【表演】说出作品名《六角馆幽灵》时，将第三幅作品的板书卡条重重拍在白板上！
    【物料】拍完之后，提示玩家翻阅【谋杀作品】的第三幅作品。
- id: p5_12
  title: 第三幅作品·推理
  type: discuss
  minutes: 11
  dm_script: |
    第三幅作品《六角馆幽灵》——
    去年11月1日六角馆爆炸前，坂田仓介就需要将铃木美雪的尸体（至少铃木美雪的头）带走，不能在六角馆内被一起炸毁，否则今天的船舱内不可能出现铃木美雪的头颅。
    而爆炸那一刻，坂田仓介人在日本新井侦探事务所。
    Q：已知六角馆事件发生时馆内一共11个人，那么没有坂田仓介和铃木美雪，为什么渔民还能在里边看到11具尸体？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】
    【标准答案】雾岛上有两座一模一样的六角馆（A馆、B馆），每座馆内各有一名管家和一名女佣。去年众人上岛后被随机分成两组，A组住A馆、B组住B馆（房间号不变）。所以去年雾岛上实际有13个人（9名推理社/戏剧社成员 + 2名管家 + 2名女佣）。除去坂田仓介（人在日本）和铃木美雪（尸体已被带走），剩下正好11人，就是渔民看到的11具尸体。
    【分组】（手册第102页白板A板书参考图）A组：小林纪子、池田孝太、清水伊织、加藤健一；B组：铃木美雪、坂田仓介、宫本诚、山田莉子、渡边翔太。名牌上下对应、跨组打电话的三对：小林纪子—铃木美雪、池田孝太—坂田仓介、清水伊织—宫本诚。
    【谜面拆解】本轮就不再是单纯地如何伪造死亡或者如何假死了：铃木美雪确认是死者，死者无法做任何主动行为，而坂田甚至人在日本。想要破解这一谜面，要确确实实找出两个人来。本轮可以多给玩家一点时间——需要作出假设并求证，还需要视角的比对验证。
    【扶车流程】
    1. 大胆猜想：玩家一开始会提出双胞胎、连体人、两人同名、双头人、不止一次上岛等。无需否定猜想过程，只需告知：“不管何种猜想，都需要找到佐证，否则论证就不成立。”（若玩家此时已做出正确假设，同样让他找佐证。）
    2. 猜想不成立时，提示回看：“关于去年六角馆内发生的一切，都记录在【六角馆档案册】和【6份日记】中了，可以再仔细看看。”
    3. 找到线头：玩家回看日记后会注意到“分组”信息（如果一直没找到，提示看看除了下划线部分的内容，尤其是9月1日）——众人进馆前随机分成了两组，各自跟随着女佣和管家的步伐进馆。
       玩家可能据“各自跟随”假设“有两个管家和两个女佣”。主持人修正：“两个管家两个女佣吗？但是每个人的日记中都有这样一句话：‘馆内除了推理社和戏剧社成员外，只有一名管家和女佣’，并且‘各自跟随’也有可能是一组跟随管家，一组跟随女佣，所以通过这点无法得到有两个管家和两个女佣。不过你们提到的分组确实很奇怪，可以想想当时这些人上岛之后为什么要分组呢？”
       此时主持人把分组情况（名牌贴）贴在白板A上：A组一行、B组一行，打过电话的人上下对应（小林纪子↔铃木美雪、池田孝太↔坂田仓介、清水伊织↔宫本诚），便于看出谁和谁打了电话。白板A标题参考：“一年前·六角馆·雾岛（漂浮岛往西30度）”。
    4. 明确方向：玩家意识到“分组”有问题，多的那两个人大概率要在“管家和女佣”里出，但日记又说“馆内只有一名管家和女佣”——不难作出最终假设：有两座六角馆。玩家提出“双馆”后，让玩家找佐证。部分佐证较软，只找出一两条是不够的，其余玩家可能不认可，让大家继续找。
    5. 最终证明：玩家自行找出3~5条后，其余由主持人QA补全。佐证如下：
       (1) 日记中提及的“众人进行了随机分组，并且各自跟随女佣和管家……”——分组、各自跟随是因为要去不同的馆。最容易找到，但很软，远远不够。
       (2) A组与B组的人之间，在三天的日记中从没见过面，每次都是打电话；见面只有A组组内、B组组内。如果都在同一个馆内，为什么不见面只能打电话？宫本诚的日记明确写道：“我现在很想见清水伊织，但只能听听她的声音”。（小林纪子—铃木美雪、池田孝太—坂田仓介、清水伊织—宫本诚打电话）
       (3) 两组人视野中“做饭/送饭”的人不同：A组是管家，B组是女佣——不同的馆内，女佣和管家的职责不同。
       (4) 女佣对两组人的称呼习惯不同：A组的女佣称呼A组的人都是姓氏（“小林小姐”“清水小姐”“池田先生”）；B组的女佣称呼B组的人都是名字（“仓介先生”“美雪小姐”）。如果是同一个女佣，怎么可能有两种不同的行为习惯？
       (5) 9月1日日记，众人在岛屿集合时来了一位管家，A组的日记中明确提到这位管家“声音低沉”；而B组的人跟随管家来到六角馆门口时，管家的声音明确描述是“清亮”的。同一时间段内，一位管家怎么可能有两种截然相反的声线？
       (6) 两组人关于死者的信息不对等：9月2日加藤健一死了，只有A组的人收到了消息且被管家召集，B组的人在那一刻完全不知情；9月3日渡边翔太死了，只有B组的人知道，而且也只有B组的人凌晨04:50跟随管家去搜寻整个馆，A组的人在那一刻完全不知情。这一切，难道刚好是巧合吗？
    【注意】以上佐证的原文在实体日记里，AI看不到原文。复述时只讲要点、不要编造日记原句；如玩家质疑具体措辞，请玩家翻日记确认或请主持人核对（手册要求主持人提前在日记中逐条查阅确认）。
    所有佐证点出、大家认可“双馆”后，进入下一阶段（答案揭晓）。
- id: p5_13
  title: 第三幅作品·答案揭晓
  type: narration
  minutes: 2
  dm_script: |
    如果一个佐证不够，那么当所有的佐证都指向同一个结论时，那就是真相。

    至此我们可以知晓，雾岛上有两座六角馆，每座馆内都有一名管家和女佣。
    去年的雾岛上，实际有13个人，这也才能解释，为何在没有坂田仓介和铃木美雪的情况下，渔民依然看到了11具尸体。

    那么接下来，我将为各位揭晓，六角馆最后的秘密！
    基于这个秘密，我们将展开最终的对决！
  dm_notes: |
    【说明】所有佐证点出后，即可证双馆，从而破解第三幅作品。六条佐证见上一阶段主持提示；如果有佐证是主持人补充的，可以先简短复述要点（不要编造日记原句），并点名肯定玩家已经找出的佐证。
    【模型·双馆】第三幅作品破解、得到双馆结论后，即可把模型调整为第三阶段：将大馆取下，把装好磁铁的两个小馆放置于铁架（凳子架）上。此阶段用于演示双馆的相对运动/联动，后续需要双馆相对运动完成的手法都可以用模型演示。
    【提醒】如果玩家拍照，请告知不要把双馆拍照发出去，会严重剧透。
    念完直接发放【六角馆的秘密】大卡（下一阶段）。
- id: p5_14
  title: 双馆·六角馆的秘密
  type: narration
  minutes: 4
  dm_script: |
    请各位阅读【六角馆的秘密】大卡，正反两面都要仔细阅读。
    读完之后，关于两座六角馆，各位还有什么问题吗？
  dm_notes: |
    【物料】发放【六角馆的秘密】大卡（05号卡），提示玩家两面都阅读。
    【模型】此时模型应已调为第三阶段（两个小馆放在铁架上），答疑时用两个小馆演示。
    【双馆常见问题答疑】
    Q1：两座馆有什么区别吗？A馆的钥匙能开B馆的门吗？
    A：建筑本身没有区别，结构、尺寸等都一样。但是钥匙是不互通的。
    Q2：如果有两座馆，那么档案册中的管家和女佣口供如何区分是谁的？
    A：有案件发生了才会录下口供，也就是说档案册中3天的口供，哪个馆里当天死人了，那么口供就是死者所在馆的女佣和管家录下的。
    Q3：两座馆互通吗？之前日记里提到门口的炸弹，两座馆都有吗？
    A：日记里明确写过，推理社的六人都确认了馆的大门口有炸弹，也就代表着两座六角馆门口都被安置了炸弹，因此不能通过大门互通。至于是否有其他互通的方式，需要自行思考（不要提示）。
    Q4：大卡中第4条是什么意思？
    A：用两个小馆模型演示：当两个馆处于同一垂直轨道上，且上下贴合时，如果此刻上方馆的大厅下降，那么就会抵住下方的馆，此时上方馆的大厅会把下方的馆整个往下推，不会只推动下方馆的大厅。换言之，下方馆的大厅如果不使用小六APP操控，是无法被外力推到下降的，只会连同房间一起被整个往下推。
    Q5：众人住的房间还是原来的房间吗？
    A：房间号都没变，这是日记里直接写的，只是分成了两个不同的馆，A组的人住A馆，B组的人住B馆。
    （手册原文后三问都编号为Q3，这里按顺序改为Q3~Q5。）
    【提醒】不要让玩家把双馆模型拍照外传。
    读完双馆大卡后询问玩家是否有问题：有就答疑，没有就进入第四幅作品（下一部分，BGM将切换为 KD_Searching）。
- id: p6_01
  title: 第四幅作品·作品发布
  type: narration
  minutes: 2
  dm_script: |
    各位侦探，让我们将时间倒回到一年前，将目光重新聚焦在六角馆内。
    去年馆内发生的三起案件，全都出自我之手！
    此刻，只有我会撒谎，那么白板右边所有的监视关系，全部成立！

    9月1日晚上11点，我给推理社社长池田孝太打去视频电话，我告诉他：
    “社长，我现在正在杀人，你相信吗？”
    池田社长告诉我，别开玩笑了，打着视频电话怎么去杀人？

    既然他不信，那我就证明给他看！
    死者山田莉子死亡时间9月1日23:00—23:30！
    而我，坂田仓介，23:00—23:40全程在自己的房间内和池田孝太打着视频电话！

    打着视频电话，如何杀害山田莉子并布置一个绝对的密室？！

    第四部作品——《谋杀要在通话中》
    献给诸位！
    各位，请翻阅第四幅谋杀作品！
  dm_notes: |
    【身份】本部分主持人全程扮演「长谷川悠人」（=一年前六角馆中的「坂田仓介」，真凶），可按自己的风格演绎，语气张扬、带挑衅感。
    【BGM】切换BGM：《KD_Searching（核动力哈哈机 remix）》。
    【模型】将六角馆模型调整为第三阶段——双馆演示阶段（取下大馆，把装好磁铁的两个小馆放在铁架上）。
    【板书】念完“……那么白板右边所有的监视关系，全部成立！”后，将白板A上三起案件的凶手位置，都换成【坂田仓介】名牌贴。
    【动作】说到作品名字《谋杀要在通话中》时，将第四幅作品的板书卡条重重拍在白板上！拍完之后，提示玩家翻阅实体物料【谋杀作品】中的第四幅作品。
    【背景】“只有我会撒谎”= 现在凶手换成坂田仓介，其他人的口供/日记都可信，白板右侧记录的所有监视关系全部成立（如9月1日23:00—24:00铃木美雪在B馆走廊、00:00—01:00清水伊织在A馆开着房门等）。
    【谜面要点】坂田23:00—23:40在自己房间（B馆9号房）与池田孝太视频通话，【谋杀作品】中写明通话期间只断线过5秒。
- id: p6_02
  title: 第四幅作品·推理
  type: discuss
  minutes: 13
  dm_script: |
    第四幅作品——《谋杀要在通话中》
    Q1：坂田仓介在自己房间内视频通话的过程中，只断线过5秒，这五秒如何完成杀人？
    Q2：山田莉子房间密室如何形成？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】

    ■ 谜面解析（手册原意）
    本案核心需要破解的是：坂田仓介在自己房间内视频通话的过程中，只断线过5秒，这五秒如何完成杀人？
    至于密室，因为现在存在双馆，监视关系自然也就被拆分了，密室手法实际上可以沿用之前两重推理的方法。
    本案还有一些小的推理细节点（见下方“追问”），玩家盘出核心手法之后，剩下的细节点主持人可以QA出来，也可以让玩家自行梳理完整时间线和动线。
    本案需要一些空间想象能力，可以多给玩家一些时间，可随时用双馆模型帮助玩家理解。

    ■ Q1 标准答案：装置杀人（核心推理点）——用A馆的2号下翻门插进B馆山田莉子房间的裂缝顶住铁链
    22:00—23:00（此时没有任何监视位）坂田做好以下布置：
    1. 将A馆的六角大厅顺时针旋转120度，此时A馆的2号下翻门对着渡边翔太房间（4号房）的方向，即西南方（以白板上六角馆磁吸贴为坐标系）。
    2. 将A馆六角大厅下降，打开2号下翻门（需手动开门，见追问1）。
    3. 将B馆整座馆移动到垂直轨道上，整座馆下降一段距离；此时B馆山田莉子房间的裂缝朝东北方。
    4. 将A馆通过岛面环形轨道移动到B馆的顺时针相邻位置，调整B馆高度，使A馆2号下翻门正好插进山田莉子房间的裂缝（B馆裂缝朝东北，A馆门板朝西南，角度刚好对上）。
    5. 坂田来到山田莉子房间打晕她，用铁链将她吊起、对准墙上刀的位置；插进来的2号下翻门门板把铁链顶起，松开山田莉子她也不会荡下去被刀刺死。然后出门关门（密室布置见Q2），回到自己房间。
    - 尺寸：裂缝厚4cm，下翻门厚度与大厅墙壁相同为3cm，完全插得进。
    6. 23:00准时给池田孝太打视频电话，中途断线的5秒只需要在小六APP上操控A馆挪走——铁链失去门板支撑荡下来，山田莉子被刺死在短刀上（死亡时间23:00—23:30）。
    7. 23:40通话结束后，23:40—00:00用APP把A馆大厅上升回去，这样A馆清水伊织00:00开门看着六角大厅墙壁时，不会发现下方卡着一扇门。（但2号门本身还没关上，见追问3）

    ■ Q2 标准答案：山田莉子房间的密室——之前的密室手法并没有被推翻
    - 做法一：坂田23点前挂好人、插好门板后，在房间外把门锁上，再用之前第二重推理中“搭箱子”（手册原文写作“塔箱子”，即用储物柜搭到裂缝高度）的方式把钥匙从裂缝送回房间。只是此时裂缝处卡着一块门板（裂缝宽10m，门板宽5m），调整一下箱子位置即可。
    - 做法二：布置好一切后把钥匙直接放在房间地上，出门关门（门不锁）；等00:00管家进入大厅后，此时B馆没有任何监视（清水伊织在A馆），坂田即可旋转六角大厅误导管家去空房间，即第一重密室手法。

    ■ 追问（玩家盘出Q1核心手法后，再依次抛出，不要提前问，否则会泄露手法）
    追问1：手法中有一步要打开A馆的2号下翻门。旋转和升降大厅都可以用手机直接操控，但下翻门必须手动打开，也就是凶手坂田必须亲手碰到A馆2号下翻门的门把手，如何做到？
    - 答案（方法不唯一，合理即可，让玩家思考得出即可，这是后续作品必需的条件）：
      a. 两馆移至同一垂直轨道，A馆在上、B馆在下，高度相差约10m。坂田下降B馆大厅、站上天花板，再上升B馆大厅，人就来到了B馆的天花板（顶上）；再下降A馆的大厅，此时就能直接碰到A馆的1号、2号大厅门，手动打开即可，并且可以进入A馆大厅。
      b. 或者两馆移至环形轨道的相邻位置，同样来到天花板上，就可以在两个馆的天花板上闪转腾挪：从B馆天花板来到A馆天花板后，下降A馆大厅，就可以进入A馆的房间，然后再上升A馆大厅，就可以进入A馆的大厅。
    - 注意：玩家经常提出“馆叠加”跨馆（两馆上下叠在一起，两馆大厅都降到底，从上方馆大厅开门进入下方馆走廊）——这是不可行的！升降大卡提到过：大厅下降后3号、4号大厅门打不开（门上沿会被走廊地板卡住）；1号、2号下翻门本来可以打开，但两馆叠在一起后，上方馆的大厅进到了下方馆内部，下翻门反而被下方馆的房间墙壁挡住，无法打开。所以馆叠加无法跨馆。
    追问2：由此得到的跨馆方法与条件？
    - 答案：开门的方法get后，自然也就得到了跨馆方法——无论是“开下翻门进入大厅”，还是“来到另一个馆天花板、下降大厅后进入房间”，都能从一个馆到另一个馆。基础结论：【跨馆的前提条件是必须使用大厅升降功能，没有升降功能，无法跨馆】（后面第六、第七幅作品要用到）。
    追问3：插在裂缝里的A馆2号下翻门，坂田最早什么时候能去复原？
    - 答案：只有01:00—02:00。A馆大厅虽在23:40—00:00升回去了，但2号下翻门还卡在建筑下方；下翻门需要给它一个向上的拉力、自动合上后再往回扣一下才算关上。若让它卡一整天，只要有人来A馆走廊就会发现大厅少了一扇门，所以必须复原。
      · 23:00—00:00铃木美雪监视着B馆大厅，B馆无法使用升降，没有升降坂田出不了B馆，碰不到A馆的下翻门；
      · 00:00铃木美雪的监视消失，但A馆清水伊织00:00—01:00的监视又形成了，此时坂田虽能出B馆，却无法下降A馆大厅，大厅不下降下翻门也关不上；
      · 只有01:00—02:00两馆监视都消失、升降功能仍在开启时间内，才能去把A馆复原。

    ■ 扶车方向（据复盘整理，由浅入深）
    1. 5秒内唯一能做的事就是在小六APP上点一下——APP能操控什么？（大厅旋转/升降、整座馆在轨道上移动……）
    2. 现在有两座六角馆，一座馆的部件能不能“伸进”另一座馆？
    3. 山田莉子房间锁门后，与外界相通的唯一通道是哪里？（外墙上8m高的裂缝，厚4cm）——馆里有什么东西的厚度小于4cm？（大厅门/墙厚3cm）
    4. 山田莉子是被铁链吊着、被墙上的刀刺死的：如果有东西把铁链顶住，再把这个东西撤走，会发生什么？
    5. 方位提示：可用磁吸贴/双馆模型摆出两馆在环形轨道上相邻、一高一低的位置关系。

    ■ 玩家常见疑问答疑
    Q：能不能通过浸水的方式让死者漂浮，做到延时杀人？
    A：不能。首先23:00—24:00铃木美雪就在B馆走廊，不可能通过把六角馆沉入海中让小洞（孔洞）进水。那如果关闭小洞，把六角馆沉入海中，从山田莉子房间的裂缝灌水呢？——可以这么灌，但水排不掉，房间全封闭没有排水孔。水排不掉，一方面无法做到延时；另一方面山田莉子的房门是内开门，房间里几百立方米的水重达几百吨，这扇门永远打不开了。
    Q：能不能在5秒内把山田莉子荡起来，落在刀上刺死？（假设她原本只是被吊着靠在墙上而不是刀上，坂田在断线5秒内用APP操控整栋建筑快速移动把她荡起来）
    A：先不说5秒内成功率多少，如果建筑移动速度快到能把一个人荡起来，那馆内所有人都会被荡起来。
    Q：能不能把铁链拉出房间去做一些延时装置？
    A：不能。由档案册图例可知，铁链长约8米，固定在房间外侧墙壁约9米高的位置。假设把尸体挂在铁链上、抱至离地1米的位置，此时想把铁链拉出房间，就是构建两条直角边分别为8米和4.3米的直角三角形，斜边约9米，铁链只有8米，长度不够。而且这还是不考虑门位置的最短斜边，实际上山田莉子的房门不在墙壁正中央，需要的铁链更长。所以无需考虑把铁链拉出房间。
    Q：岛是圆的，角度上能保证A馆下翻门插进B馆房间吗？
    A：虽然没给出岛屿具体直径，但岛屿半径是一段跑步需要20分钟的路，即便慢跑20分钟也有2～3km，整座岛屿很大。两座馆在相邻位置时，两馆连接轨道的露天平台之间水平距离仅约68米（整个馆的宽度），相对直径4～6km的岛屿，角度差仅约1.56度（按直径5km计算），不到2度；相较于10m宽的裂缝和5m宽的下翻门几乎可以忽略不计，完全插得进去。
    Q：坂田仓介一定是在自己的房间中吗？
    A：坂田确实可能把自己房间的物品搬到另一个房间，伪造成自己的房间，但至少要保证两点：（1）房间布局一致，例如卫生间、餐厅之类的房间都有自己独特的布局；（2）房间形状一致。坂田住的9号房是长方形房间，他不可能换到一个梯形房间去。
- id: p6_03
  title: 第四幅作品·答案揭晓
  type: narration
  minutes: 4
  dm_script: |
    第四幅作品复盘
    1.装置杀人的手法
    将A馆的六角大厅顺时针旋转120度，此刻A馆的2号下翻门就会对着渡边翔太的房间，也就是对着西南方（以白板上的六角馆磁吸贴为坐标系）。
    将A馆的六角大厅下降，然后打开2号下翻门。
    将B馆整座馆移动到垂直轨道上，然后整座馆下降一段距离。
    此时B馆的山田莉子房间的裂缝是朝东北方的（以白板上的六角馆磁吸贴为坐标系）。

    将A馆通过岛面环形轨道移动到B馆的顺时针相邻位置。
    调整B馆的高度，使得A馆的2号下翻门能够插进山田莉子房间的裂缝。
    （B馆裂缝朝东北方，A馆2号门板朝西南，角度刚好对）
    上述一切行为都是坂田在22:00—23:00之间做的，此时没有监视位。
    在这段时间内，坂田来到山田莉子房间打晕她，用铁链将她吊起，然后用手机操控A馆移动，将A馆的2号下翻门从裂缝插进B馆山田莉子的房间内。
    此时2号下翻门的门板会将铁链顶起来，此时松开山田莉子，她也不会荡下去被墙上的刀刺死，因为铁链被顶住了。
    裂缝厚度4cm，而下翻门的厚度与大厅墙壁厚度相同都为3cm，所以尺寸上是完全足够的。

    环形轨道实际上是有弧度的，但因为岛屿很大，所以相对六角馆来说，环形滑轨看起来就像是直的。

    23点之前，坂田仓介将山田莉子打晕挂好，对准刀的位置，并用A馆的2号门插进裂缝将铁链顶起，然后出门关门，回到自己的房间。

    23:00准时给池田孝太打去电话，然后过程中中断了5秒，那五秒只需要在小六APP上操控A馆挪走，铁链失去了门板的支撑，自然会荡下来，山田莉子就被刺死在了短刀上。

    坂田23:40与池田孝太打完视频之后，可以在23:40—00:00之间将A馆的大厅再上升回去，这样当A馆的清水伊织00:00开门看着六角大厅的墙壁时，也不会发现下方卡着一扇门。

    2.如何开A馆的2号下翻门？
    手法中存在一个步骤，就是要打开A馆的2号下翻门，旋转和升降大厅都可以用手机直接操控，但是2号下翻门需要手动去开，也就是说需要凶手坂田仓介亲自触碰到A馆的2号下翻门门把手才行，如何做到？

    方法不唯一。
    例如将两馆移动至同一垂直轨道上，A馆在上，B馆在下，高度相差10m左右。
    然后下降B馆大厅，站上天花板，上升B馆大厅，此时人就来到了B馆的天花板，然后再下降A馆的大厅，此时就可以直接触碰到A馆的1号2号大厅门了，直接手动打开即可，并且可以进入A馆的大厅。

    或者将两馆移动至环形轨道的相邻位置，然后同样来到天花板上，就可以实现在两个馆的天花板上闪转腾挪：
    当从B馆的天花板来到A馆的天花板之后，下降A馆的大厅，就可以进入A馆的房间，然后再上升A馆大厅，就可以进入A馆的大厅。

    通过上述的方法（方法还有，合理即可），即可实现开另一个馆的大厅门，当然，同时也就实现了如何从一个馆到另一个馆。

    但是，此处玩家经常会提出一种“馆叠加”的方式来实现跨馆，就是将两个馆上下叠在一起，然后将两个馆的大厅都降到底，就可以从上方馆的大厅开门进入下方馆的走廊，这是不可行的！！！
    最开始的升降大卡里就提到过，当六角大厅下降之后，3号和4号大厅门就无法打开了，因为门的上边沿会被走廊地板卡住，而大厅下降后原本1号和2号下翻门是可以打开的，但是由于将两个馆叠在一起了，上方馆的大厅来到了下方馆内部，那1号和2号下翻门反而被下方馆的房间墙壁挡住了，导致无法打开。
    因此，馆叠加的方式是无法实现跨馆的。

    3.得到跨馆的方法和条件
    上述开门的方法玩家get后，自然也就得到了跨馆的方法。
    不管是第一种“通过开下翻门进入大厅”，还是第二种“来到另一个馆天花板下降大厅后进入房间”，都可以实现从一个馆到另一个馆。

    但是，此处也将得到一个基础信息：跨馆的前提条件是——需要使用大厅的升降功能，没有升降功能，无法跨馆。

    4.何时复原A馆
    在23:00之前，坂田仓介就可以挂好死者，将A馆大门插进B馆山田莉子房间，并且在23:40—00:00之间操控小六APP将A馆的大厅上升回去。

    但是，A馆大厅虽然上升了，2号下翻门还卡在建筑下方呢，之前就说过下翻门需要给予它一个向上的拉力，自动合上之后再往回扣一下，才算关上。
    而如果让2号下翻门在A馆下边卡一整天，那么肯定会被A馆的人发现，只要有人来走廊，就会发现大厅少了一扇门，因此一定要复原。

    可是23:00—00:00铃木美雪都监视着B馆的大厅，此时无法使用升降，而没有升降功能，坂田仓介无法出B馆，也就碰不到A馆的下翻门。

    另外，00:00虽然B馆铃木美雪的监控消失了，但是A馆清水伊织00:00—01:00的监控又形成了，此时坂田虽然能出B馆，但是无法下降A馆大厅，大厅不下降，下翻门也无法关上，因此还得等。
    只有在01:00—02:00之间，两馆的监控都消失了，且升降功能还在开启时间，才能去将A馆复原。

    5.山田莉子房间密室如何形成？
    密室手法实际上并没有被推翻。
    首先，坂田可以在23点前挂好尸体并通过裂缝插入门板，然后就在房间外将房门上锁，然后用之前“搭箱子”的方式将钥匙送回山田莉子的房间。只是此时有一块门板在裂缝那卡着，裂缝宽10m，门板宽5m，调整一下箱子位置即可。
    另外，同样可以在布置好一切之后，就将钥匙放在房间地上，然后出门关门。
    等00:00管家进入大厅之后，此时B馆是没有任何监视的（清水伊织在A馆），坂田就可以旋转六角大厅误导管家去空房间，也就是第一重密室手法。
  dm_notes: |
    【演示】主持人可用两个小馆模型演示两馆的相对位置：A馆与死者所在的B馆在环形轨道上相邻，A馆2号下翻门朝西南插入B馆山田莉子房间朝东北的裂缝。
    【手册俯视图说明】（手册第108页的图）：俯视图中，左为“死者所在的B馆”、右为“A馆”，两馆都在环形轨道上相邻；B馆标出坂田仓介的房间及“山田莉子房间裂缝”，A馆标出小林纪子的房间及“2号下翻门”，下翻门插入裂缝。环形轨道实际有弧度，但相对六角馆看起来像直的。
    【方位】方位均以白板上六角馆磁吸贴为坐标系。
    【节奏】若推理阶段玩家已完整盘出，以上复盘可只挑玩家没讲到的细节（如何时复原A馆、跨馆前提）做补充，不必全文照念；若玩家仍有疑问，参照上一阶段的“玩家常见疑问答疑”。
    【必须讲清的结论】跨馆必须使用大厅升降功能（升降功能开启时间22:00—02:00），后面第六、第七幅作品都要用到。
    【读完】询问玩家是否还有问题，有就答疑，没有就进入第五幅作品。
- id: p6_04
  title: 第五幅作品·作品发布
  type: narration
  minutes: 2
  dm_script: |
    各位侦探，现在让我们来到第二起案件——加藤健一案！

    女佣00:30在餐厅内透过落地玻璃看到了15号房的钥匙就在房内的书架上，随后女佣来到15号房门口尝试开门，却发现门打不开。

    这说明了什么？
    ……
    说明——我有一双独特的手。
    一双可以穿透墙壁，跨越虚空的手。

    如果你们无法破解眼前的绝对密室
    那我想，你们只能承认
    就是它……——在悄无声息中穿透墙壁，进入上锁的房间杀死了加藤健一。

    而它，是一双看不见的手。
    第五部作品——《看不见的手》，请各位鉴赏！
    来吧，第五幅谋杀作品——看不见的手。
  dm_notes: |
    【互动】问完“这说明了什么？”后停顿，等待玩家回答。回答什么都不重要，这里纯粹是“装一下”，听完玩家的回答后直接接“说明——我有一双独特的手”。
    【动作】念到“就是它”时，在玩家面前晃一晃手，停顿一下，再接“在悄无声息中穿透墙壁……”。
    【动作】说到作品名字《看不见的手》时，将第五幅作品的板书卡条重重拍在白板上！拍完之后，提示玩家翻阅实体物料【谋杀作品】中的第五幅作品。
    【BGM】本段手册未要求切换，沿用上一首。
    【背景】加藤健一死于A馆15号房（15号房和玄关门是外开门，其余房间为内开门）；坂田仓介住在B馆。
- id: p6_05
  title: 第五幅作品·推理
  type: discuss
  minutes: 6
  dm_script: |
    第五幅作品——《看不见的手》
    Q1：之前的密室手法还是否可行？为什么不行？
    Q2：15号房的密室如何形成？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】

    ■ 谜面解析
    本案核心破解的就是15号房密室如何形成。坂田在B馆，死者加藤健一在A馆，跨馆方式上一幅作品已推理过，此处无需再提。
    本案需要先询问玩家：之前的密室手法还是否可行？为什么不行？（即Q1）

    ■ Q1 标准答案：两种旧手法都不可行
    1. 第一重——小林纪子“拼钥匙”：小林纪子用一面印有X的钥匙+5号房钥匙（两面都印有V）拼成假“15号钥匙”骗过女佣，把真钥匙带出房间锁门。但现在凶手是坂田仓介，他住9号房，没有单独一面印有X的钥匙可用，拼不了钥匙，手法不可行。
       - 玩家若问：“不是有两座六角馆吗，用另一个馆的15号房钥匙不行吗？”——回答：不行。两个馆的管家都说过，除了你们住的房间和1号、5号房外，其他房间的钥匙早就遗失了。B馆的15号房没人住，钥匙早就丢了，不存在第二把15号房钥匙。（另：两馆钥匙本身也不互通）
    2. 第二重——铃木美雪“卡住大厅使之无法复位”：下降大厅、打开2号下翻门，再上升大厅，让2号门卡在建筑底下，天花板无法完全复位（差5cm），从而卡住15号外开门，事后再在走廊把门复原。但第二重被破解时明确过一个基点：此手法成立的前提是02:10管家开门前能复原大厅门，否则管家也打不开门。而复原大厅有两个前置条件：（1）需要退出两次视频会议；（2）需要在走廊进行视频通话。这两个条件坂田都不满足，所以他无法使用此手法。
    至此，需要推理新的密室手法。

    ■ Q2 标准答案：馆叠加，让15号门被A馆自身大厅的天花板卡住
    - 将两个馆移动至同一垂直轨道，上下叠在一起：B馆在上，死者所在的A馆在下，将两个馆的大厅都下降到底。
    - A馆大厅降到最底下，覆盖了走廊，而天花板本身有1cm的厚度（手册第117页原文），会卡住15号外开门的底部，使之无法打开。
    - 女佣看到的15号房内的15号钥匙就是真钥匙；门打不开是被它自身所在馆的大厅天花板卡住了。
    - 之所以还要把B馆叠在A馆之上：A馆大厅降到底后，女佣出门会发现大厅没了，自己来到了一个大平层；把B馆的大厅降进A馆里，是为了伪造出A馆的大厅，保证女佣的视角不出问题。
    - 坂田在00:20—00:40退出过一次视频会议，这次退出就是把两个馆的大厅都上升复位；否则00:50铃木美雪出门来走廊时会发现她所在的B馆大厅没了，成了一个大平层。
    - 细节补充：坂田在视频会议之前就已经去A馆杀死了加藤健一；随后他是在A馆的9号房进行视频会议的——A馆9号房没人住，钥匙早就遗失，门不会上锁。这一点本案不重要，但它是下一幅作品谜面的构成条件之一。

    ■ 注意事项（重要）
    玩家可能很快就说出“馆叠加就打不开了吧”。此时主持人需要追问：馆叠在一起，为什么15号房门就打不开了？卡住房门的是什么？
    - 经常有玩家认为是另一个馆的大厅墙壁卡住了15号房门——这是错的。大厅墙壁不会触碰到房门；能卡住外开房门的，永远只有【房门所在馆本身大厅的天花板】。即使是B馆的天花板，也不会卡住A馆的15号门，因为B馆的天花板不可能进到A馆来。
    - 玩家也许只是随口说的，要帮玩家明确两点：（1）打不开门的原因是什么？（A馆自身大厅降到底，其天花板卡住15号外开门）（2）B馆大厅降进A馆的意义是什么？（伪造A馆的大厅，骗过女佣的视角）

    ■ 扶车方向（由浅入深）
    1. 15号门打不开只有两种可能：上锁 / 被抵住。钥匙是真的，所以门没锁，只能是被抵住了——馆里能抵住外开门的只有什么？
    2. 不能“卡一半”（不满足复原条件），那如果大厅直接降到底呢？女佣出门会看到什么？（大厅消失，变成大平层）
    3. 怎样让女佣出门时依旧看到一个“大厅”？——现在有两座馆，且两馆可以在同一垂直轨道上下叠放。
    4. 坂田00:20—00:40退出过一次视频会议，他用这段时间做了什么？
- id: p6_06
  title: 第五幅作品·答案揭晓
  type: narration
  minutes: 3
  dm_script: |
    第五幅作品复盘
    1.第一重——小林纪子拼钥匙
    第一重手法中，小林纪子通过“拼钥匙”的方式骗过女佣，将真钥匙带出房间锁门。
    但是现在，凶手为坂田仓介，他住9号房间，没有单独一面印有X的钥匙给他使用，因此他拼不了钥匙，这个手法也就不可行。

    2.第二重——卡住大厅使之无法复位
    第二重手法，铃木美雪将大厅下降，打开2号下翻门，然后再上升大厅，将2号下翻门卡在建筑底下，这样天花板就无法完全复位，从而卡住15号外开门，事后再在走廊将门复原。

    但是当时第二重手法被破解时我们就明确过一个基点，这个手法成立的前提是02:10管家开门前能复原大厅门，否则管家也会打不开门。

    而复原大厅的前置条件有两个：（1）需要退出两次视频会议（2）需要在走廊进行视频通话。
    上述两个条件，坂田仓介都不满足，因此他无法使用此手法。

    至此，需要推理新的密室手法。

    本案的手法其实不复杂，将两个馆移动至同一垂直轨道，上下叠在一起，B馆在上，死者所在的A馆在下，将两个馆的大厅都下降到底，就完成了。

    死者所在的A馆，因为大厅下降到了最底下，覆盖了走廊，而天花板本身有1cm的厚度，因此会卡住15号外开门的底部，使之无法打开。

    女佣看到的15号房内的15号钥匙就是真钥匙。
    15号房门打不开的原因是被它自身的大厅天花板卡住了，而之所以还要将B馆叠加在A馆之上，是因为当A馆的大厅降到底之后，女佣出门会发现馆的大厅没了，自己来到了一个大平层。

    而将B馆的大厅降到A馆里去，是为了伪造出A馆的大厅，保证女佣的视角不出现问题。

    而坂田仓介在00:20—00:40退出过一次视频会议，这次的退出就是将两个馆的大厅都上升复位，否则00:50铃木美雪出门来走廊的时候会发现，她所在的B馆大厅没了，成为了一个大平层。

    本案中，坂田仓介在视频会议之前，就已经去到A馆杀死了加藤健一。
    随后他也是在A馆的9号房进行了视频会议，因为A馆9号房没人住，房间钥匙早就遗失了，所以这扇门也不会上锁。
  dm_notes: |
    【演示】可用两个小馆模型演示：两馆在同一垂直轨道上叠放（B上A下），两馆大厅都降到底，A馆大厅天花板卡住15号外开门；B馆大厅降进A馆内部，伪装成A馆的大厅。
    【强调】卡住15号门的是A馆自身大厅的天花板，不是另一个馆的大厅墙壁，也不是B馆的天花板。
    【伏笔】“坂田在A馆9号房开视频会议、A馆9号门不会上锁”是第六、第七幅作品谜面的条件之一（坂田在A馆滞留）。
    【原文】“天花板本身有1cm的厚度”已对照手册第117页图片确认。
    【读完】询问玩家是否还有问题，有就答疑，没有就进入第六幅作品。
- id: p6_07
  title: 第六幅作品·先导谜面
  type: narration
  minutes: 1
  dm_script: |
    接下来便是最后一起案件！
    各位还记得管家02:10醒来时所在的仓库密室吗？

    根据日记内容，宫本诚22:00-02:20都待在六角大厅内，也就是说我无法使用旋转来拼凑一个梯形房间。

    而02:00铃木美雪打开了房间大门，我也无法使用升降抽走空气制造压强差的方式让管家打不开仓库门。

    那么这起仓库密室，你们又该如何破解呢？
    请各位先不要翻阅【谋杀作品】，先解决仓库密室。
  dm_notes: |
    【物料】提醒玩家此处【不要】翻阅【谋杀作品】，先解决仓库密室。（dm_script 末句是据此写的提示语）
    【背景】这是第三起案件（渡边翔太案，B馆，9月3日夜）的前置谜面。谜面回顾：管家02:10在仓库醒来，巡视确认无人，门打不开，在尸体身上找到1号房（仓库）钥匙——凶手不在仓库内的“反向密室”。之前两重推理中的仓库密室手法：第一重“伪造仓库”（旋转大厅180度，把3号、4号大厅门开至水平，在仓库门口的走廊围出一个与仓库镜像对称的假仓库）；第二重“抽真空制造气压差”（大厅降到底、关闭孔洞再上升大厅，把走廊抽成近似真空，让管家拉不开内开的仓库门）。现在这两种都被日记里的监视关系否定了（宫本诚22:00—02:20在大厅内；02:00—02:15铃木美雪开着房门）。
    【节奏】仓库密室只是先导谜面，解答很简单，给玩家三五分钟思考即可。
- id: p6_08
  title: 仓库密室·推理
  type: discuss
  minutes: 2
  dm_script: |
    仓库密室——
    Q：管家02:10在仓库醒来，巡视一圈后确认房内没有人，尝试开门却发现打不开，然后在尸体身上找到一把一号房也就是仓库钥匙。
    凶手不在仓库内，管家所在的反向密室是如何形成的？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】
    【出处】本阶段问题取自手册第30页（第一重·第三案）【本案谜面梳理】原文。
    ■ 标准答案：利用两座馆各有一把1号房（仓库）钥匙
    两位管家都对众人说过：除了你们住的房间，以及1号、5号房，其他房间的钥匙都丢了。换言之，两个馆的1号房（仓库）钥匙都还在。坂田仓介只需要把A馆的1号仓库钥匙带到B馆，放在仓库内让管家看到（管家是在尸体身上找到钥匙的），然后用B馆的1号钥匙在仓库外将仓库上锁就行。（两馆钥匙外观一样、但不互通，管家找到的其实是A馆的钥匙）
    ■ 扶车（给玩家三五分钟，没想出来再给提示）
    提示：回顾两位管家对众人说的话——除了你们住的房间，以及1号、5号房，其他房间的钥匙都丢了。现在有两座馆，那么1号房的钥匙一共有几把？
    ■ 收尾
    玩家答对后简单确认即可（可补一句完整做法）；玩家答出后切换BGM，进入下一阶段的后续谜面引导。若给了提示仍答不出，主持人直接说明上述答案后进入下一阶段。
- id: p6_09
  title: 第六幅作品·作品发布
  type: narration
  minutes: 4
  dm_script: |
    真不愧是名侦探！至此我们已经解决了六角馆内的三起案件。
    但是！各位好像忽略掉了一个微小但却足够致命的细节呢！

    我来帮各位回忆一下吧。
    还记得9月2日的档案中，女佣第二天早上是在哪里发现的加藤健一尸体？
    ……
    没错，女佣早上醒来在餐厅看到了加藤健一的尸体，那么各位侦探，请问谁会去偷偷挪动尸体呢？

    没错！只有凶手也就是我会去偷偷挪尸体。
    而各位还记得管家和众人第一次发现加藤健一尸体的时间吗？
    ……
    是的，9月3日的凌晨两点十分，众人第一次在加藤健一的房间发现尸体。
    也就是说，我要在02:10之后，才能将加藤健一的尸体从房间移动到餐厅。
    那么也就代表着，02:10之后我人留在了加藤健一所在的A馆内！

    可是各位，六角馆的升降功能凌晨2点就停止了！
    没有升降功能的我，还能从A馆回到B馆吗？！
    ……
    所以当天凌晨2点之后我依旧只能留在A馆。
    那么我最快回到B馆的时间是什么时候？
    ……
    没错，我最快回到B馆的时间是9月3日晚上10点升降功能再次开启之后。
    那各位还记得渡边翔太的死亡时间吗？
    ……
    渡边翔太死亡时间为9月3日20:00—03:30。
    可是刚刚我们已经得到结论，我在9月3日晚上10点才能回到B馆，已知死者房间4号房为案发现场，我得回到B馆才能杀死渡边翔太吧？

    那么他的死亡时间是不是可以缩减了？
    真正的死亡时间是什么时候？
    ……
    但是各位！别忘了女佣当天做过什么事！
    她曾于22:00在渡边翔太的房间门沿上涂了荧光粉！
    荧光粉的生效时间是多久？
    ……
    没错，那么也就证明，在22:00—次日02:30这四个半小时内，一定没有人打开过渡边翔太的房门！
    死亡时间是不是可以再次压缩了呢？
    ……
    可是！各位别忘了！
    宫本诚02:30—03:40一直站在自己的房间门口注视着铃木美雪门口的这条走廊！
    从他的视角看过去，恰恰就是渡边翔太的房间！

    那么也就代表着，我在02:30—03:30同样不能去打开渡边翔太的房门，否则一定会被宫本诚发现！

    至此，死者渡边翔太！
    不具备死亡时间！

    我晚上10点才能回到B馆，如果我22:00—02:30去杀人，4号房门沿上一定会留下痕迹！可如果我02:30—03:30去杀人，宫本诚一定会发现！

    感受到了吗各位？这，便是那名为——《二律背反的密室》！

    我的第六部作品！
    开始吧，第六幅谋杀作品——二律背反的密室。
  dm_notes: |
    【BGM】玩家破解仓库密室后，切换BGM：《成歩堂龍ノ介～異議あり！》（成步堂龙之介～异议！）。
    【互动】dm_script中每个“……”处都要停下来等玩家回答，玩家答对后再接下一句；答不上来可稍作提醒：
    1. 女佣第二天早上在哪里发现加藤健一尸体？——期待答案：餐厅（9月2日档案中女佣口供）。
    2. 管家和众人第一次发现加藤健一尸体的时间？——期待答案：凌晨02:10。
    3. 没有升降功能还能从A馆回到B馆吗？——等玩家反应一下，有问题顺便答疑（结论：不能，跨馆必须使用升降功能）。
    4. 最快回到B馆的时间？——期待答案：9月3日晚上10点升降功能再次开启的时候。
    5. 渡边翔太的死亡时间？——期待答案：9月3日20:00—03:30（玩家回忆档案）。
    6. 真正的死亡时间？——期待答案：22:00—03:30。
    7. 荧光粉的生效时间？——期待答案：未触发的话四个半小时。
    8. 死亡时间再次压缩？——期待答案：02:30—03:30。
    【板书】从“渡边翔太的死亡时间”开始的时间范围框定，主持人需要在白板上从上往下逐一写出来，帮玩家梳理，确保玩家清晰地获取谜面：
    - 先写“20:00—03:30”；
    - 玩家答出22:00—03:30后，将20:00—03:30划掉，在下方写上“22:00—03:30”（手册原文此处写作“将20:00—03:00划掉，在下方写上22:00—03:00”，按上下文应为03:30）；
    - 玩家答出02:30—03:30后，将22:00—03:30划掉，在下方写上“02:30—03:30”；
    - 念到“否则一定会被宫本诚发现”后，将白板上最后一个时间02:30—03:30也帅气地划掉！
    【动作】说到作品名字《二律背反的密室》时，将第六幅作品的板书卡条重重拍在白板上！拍完之后，提示玩家翻阅实体物料【谋杀作品】中的第六幅作品。
    【背景】宫本诚住B馆8号房，铃木美雪住6号房，渡边翔太住4号房；宫本诚站在8号房门口看向6号房门口这条走廊，视线尽头就是4号房。
- id: p6_10
  title: 第六幅作品·推理
  type: discuss
  minutes: 9
  dm_script: |
    第六幅作品——《二律背反的密室》
    死者渡边翔太死亡时间20:00—03:30，将其拆解为以下三段：
    （1）20:00—22:00这段时间被“坂田仓介在22:00升降功能开始后才能从A馆回到B馆”卡死。
    （2）22:00—02:30这段时间被女佣涂在4号房门上的荧光粉卡死。
    （3）02:30—03:30这段时间被宫本诚的监视卡死。
    Q：上述三段时间，玩家需要破解其中一段，找到渡边翔太真正的死亡时间。
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】

    ■ 谜面解析
    死者渡边翔太死亡时间20:00—03:30，拆成三段：
    （1）20:00—22:00：被“坂田仓介在22:00升降功能开启后才能从A馆回到B馆”卡死。
    （2）22:00—02:30：被女佣涂在4号房门上的荧光粉卡死。
    （3）02:30—03:30：被宫本诚的监视卡死。
    玩家需要破解其中一段。谜面本质不难，但玩家可能需要一些时间去排除两个不可被突破的时间段，可以多给一些时间。

    ■ Q1 标准答案：只有第三段（02:30—03:30）可以突破，渡边翔太死于02:30—03:30
    （1）第一段20:00—22:00不可能突破：尸体被挪动这一点100%确保坂田9月3日02:00之后必定在A馆内；升降功能22:00—02:00开启是固定条件，坂田回B馆只可能在9月3日22:00之后。没有任何可操作空间。
    （2）第二段22:00—02:30同样坚不可摧：荧光粉的特性是固定条件，只要涂了，这段时间内就一定不能开门。唯一可能的问题是女佣会不会涂错——但女佣没有被迷晕过，出门后从走廊去了渡边翔太的房间，中途没有任何被误导的机会；且晚上10点女佣就已经在门口涂荧光粉了，而升降和旋转功能晚上10点才开启，这之前更没有机会误导女佣。女佣不可能走错房间。
    （3）第三段02:30—03:30是唯一可突破的：前两段是“固定条件”带来的限制，这一段仅仅是“人物行为”带来的限制。

    ■ Q2 标准答案：用大厅4号门上的“IV”冒充4号房门上的“IV”
    - 宫本诚的视角：02:30—03:40全馆断电，门上的罗马数字灯亮起。他站在8号房门口注视着6号房门口的走廊，走廊一片漆黑，但他一定能看到渡边翔太房门上亮着的罗马数字“IV”——只要这个数字动了，就代表4号门被打开了，他一定会发现。所以需要让他视野中的“IV”不动，同时凶手还能开门进去杀人。
    - 关键：此刻馆内亮着的“IV”不止一个——大厅的4号门上也亮着一个与4号房门上一模一样的“IV”！
    - 手法：坂田在02:20宫本诚回房间之后，将六角大厅逆时针旋转120度，把4号大厅门转到渡边翔太房间门的这个位置，然后把4号大厅门打开，开的角度与渡边翔太的房门平行即可。以上在02:20—02:30之间完成。
    - 等宫本诚从房间出来后，他视野中的罗马数字灯“IV”实际上一直都是大厅的4号门，而非渡边翔太的4号门。打开的4号大厅门不会挡住其他任何一扇本应被宫本诚看到的门，只挡住渡边翔太的房门；而宫本诚的视野中除了罗马数字灯光，其余一片漆黑。凶手便可以在大厅门之后随意行动（开4号房门杀人）而不被宫本诚目击。

    ■ 扶车方向（由浅入深）
    1. 三段时间的限制，哪些来自“固定条件”（升降时间、荧光粉特性），哪些只是“人物行为”（宫本诚的监视）？——固定条件很难突破，人物行为可以被欺骗。
    2. 断电后一片漆黑，宫本诚实际上能“看到”的是什么？（只有门上亮着的罗马数字灯）
    3. 此刻馆内亮着“IV”的，只有4号房的门吗？
    4. 可用磁吸贴在白板上摆出宫本诚（8号房门口）的视线方向，再演示大厅旋转。

    ■ 玩家常见疑问答疑
    Q：能不能误导宫本诚的房间，或者让宫本诚去另一个馆？
    A：不可能。宫本诚02:20回房之前没有被迷晕、没有被打晕，不可能被莫名其妙换了房间或换了馆；他02:20回房时自己门上也亮着罗马数字（8号房“VIII”），不可能走错。还有，他02:20回房时把房门上锁了，如果此时他在另一个馆，他B馆的钥匙无法把A馆的8号房上锁（房门上锁时会有轻微“滴滴”声，所以宫本诚一定知道自己锁没锁成功）。
    Q：宫本诚原本能看到大厅3号门，旋转后看不到了，不会发现吗？
    A：不会。线索中写了，大厅3号门的罗马数字灯是坏的，本来就不亮，所以不管3号大厅门在不在他视野中，都是一片漆黑。
    Q：宫本诚不会意识到罗马数字“IV”变大了一点点吗？
    A：不会。手法完成后“IV”离宫本诚近了一点，客观上确实会变大一点点，但宫本诚是人不是机器：那一段走廊有30米左右长，近了一两米、两三米肉眼不可能看出来，并且周围一片漆黑。此外，这是宫本诚进馆三天以来第一次在01:00—04:00出门看走廊的景象，他的认知中本来就没有“IV”该多大的概念，监控期间他从始至终看到的“IV”都是大厅4号门上的，根本没有对比过。
- id: p6_11
  title: 第六幅作品·答案揭晓
  type: narration
  minutes: 3
  dm_script: |
    第六幅作品复盘
    三个时间段，只有一个能突破。
    （1）第一个时段：20:00—22:00。
    通过尸体被挪动这一点能够100%确保坂田9月3日02:00之后必定在A馆内，而升降功能22:00—02:00开启是固定条件，那么坂田回B馆的时间只可能是9月3日22:00之后。那么第一个时段是不可能被突破的，没有任何可操作空间。

    （2）第二个时段：22:00—02:30
    荧光粉的特性同样是一个固定条件，那么只要涂了，这段时间内就一定不能开门。唯一可能存在问题的地方是女佣会不会涂错。
    但女佣没有被迷晕过，出门后从走廊去了渡边翔太的房间，中途没有任何可以被误导的机会，并且，晚上10点女佣就已经在门口涂荧光粉了，而升降和旋转功能晚上10点都才开启，这之前更没有任何机会可以误导女佣。
    那么女佣不可能走错房间，因此这一时段同样坚不可摧。

    （3）第三时段：02:30—03:30
    这是唯一可以被突破的时段，相较于前两个时段的限制条件，这一次仅仅是“人物行为”所带来的限制，而之前两个时段都是“固定条件”所带来的限制。

    分析宫本诚的视角，02:30—03:40，全馆断电，门上的罗马数字灯亮起。他站在8号房门口，注视着6号房门口的走廊，在他的视野中，虽然走廊一片漆黑，但是他一定能看到渡边翔太房间门上亮着的罗马数字“IV”，只要这个数字动了，代表着4号门被打开了，他一定会发现。

    换言之，需要让宫本诚视野中的罗马数字“IV”不动，并且凶手还能开门进去杀人。
    观察整个六角馆，实际上此刻馆内亮着的罗马数字“IV”不止一个。
    大厅的4号门上亮着一个与4号房间门上一模一样的“IV”！

    至此其实已经很明显了。
    凶手坂田仓介在02:20宫本诚回房间之后，将大厅逆时针旋转120度，将4号大厅门转到渡边翔太房间门的这个位置。
    然后将4号大厅门打开，开的角度与渡边翔太的房间门平行即可。

    上述行为在02:20—02:30之间完成。
    然后等宫本诚从房间出来之后，他视野中罗马数字灯“IV”实际上一直都是大厅的4号门，而非渡边翔太的4号门。

    上述的行为中，打开的4号大厅门并不会挡住其他任何一扇本应该被宫本诚看到的门，只会挡住渡边翔太的房间门，而在宫本诚的视野中，除了门上的罗马数字灯光，其余全是一片漆黑。

    如此一来，凶手便可以在大厅门之后随意行动而不被宫本诚目击了。
  dm_notes: |
    【演示】用磁吸贴在白板上演示：宫本诚（8号房门口）看向铃木美雪（6号房）门口的走廊，视线尽头是渡边翔太的4号房；将六角大厅逆时针旋转120度，4号大厅门转到4号房门的位置，打开至与4号房门平行。
    【注意】手册提醒：磁吸贴比例不是真实比例，建议玩家看线索册上的平面图。
    【手册示意图说明】（手册第125页的图）图中标有空房间、铃木美雪、宫本诚、坂田仓介、小林纪子、渡边翔太、清水伊织、池田孝太等人的房间名牌，以及“将六角大厅逆时针旋转120度”“将4号大厅门打开至与渡边翔太房间门平行”两处标注。
    【读完】询问玩家是否还有问题（可参照上一阶段的“玩家常见疑问答疑”），没有就进入第七幅作品。
- id: p6_12
  title: 第七幅作品·作品发布
  type: narration
  minutes: 3
  dm_script: |
    恭喜各位！解决了我的第六幅作品，也抵达了逻辑的终点。

    可是我想问问你们，通过刚才的结论，渡边翔太的死亡时间，到底是几点呢？
    ……
    渡边翔太，死于02:30—03:30，各位，确定吗？
    ……
    很好！我告诉过你们的，逻辑的子弹一旦射出，就再也无法溯洄。

    如果渡边翔太死于02:30—03:30，那么请回答我！
    管家凌晨02:10在仓库醒来的时候，凭什么看到他的尸体？
    ……
    加藤健一的尸体？那也就是说在9月3日晚上我从A馆回到B馆的时候，还需要将加藤健一的尸体一块带过来，对吗？——确定吗？
    ……
    很好，我确实可以将加藤健一的尸体带到B馆，然后放在仓库，让管家02:10在仓库醒来时看到。

    可是各位，你们难道又忘了吗？
    升降功能02:00就停止了！如果管家02:10醒来时看到的尸体是加藤健一，而此时升降功能已经停止，那么我无法再将他的尸体送出B馆。

    管家当天凌晨04:50召集B馆的所有人，搜查了整座六角馆，根本没有找到加藤健一的尸体！

    那么请回答我！如果我将加藤健一的尸体带了过来，那么这栋建筑里本应该存在的这具尸体，究竟去了哪里？
    莫非……这具尸体可以像玻璃那样透明吗？

    我的第七部作品，该给它取一个什么名字呢？
    噢！
    既然如此，那就叫它——《玻璃之人》吧。
    来吧各位！第七幅作品～六角馆内的最终谜题！
  dm_notes: |
    【互动】dm_script中每个“……”处停下来等玩家回答：
    1. 渡边翔太的死亡时间？——期待答案：02:30—03:30（只有宫本诚的监视时间可以被突破）。
    2. “各位，确定吗？”——等玩家给出肯定回答，这里是“装一下”。
    3. 管家02:10在仓库凭什么看到他的尸体？——期待答案：管家在仓库看到的尸体不是渡边翔太，而是加藤健一。【必须由玩家自己答出“尸体是加藤健一”】，主持人不要替玩家说。
       - 逻辑：这里并没有推翻第六幅作品的解答，渡边翔太只能死于02:30—03:30，那么管家02:10醒来时看到的尸体就不可能是渡边翔太；而管家明确描述过他看到的是男尸，因此这具尸体只能是加藤健一的。
       - 若玩家卡住，可提示：第六幅的结论还成立吗？管家看到的是男尸还是女尸？此时还有哪具男尸下落不明？
    4. “确定吗？”——等玩家给出肯定答复，也是“装一下”。
    【动作】说到作品名字《玻璃之人》时，将第七幅作品的板书卡条重重拍在白板上！拍完之后，提示玩家翻阅实体物料【谋杀作品】中的第七幅作品。
    【BGM】本段手册未要求切换，沿用上一首。
- id: p6_13
  title: 第七幅作品·推理
  type: discuss
  minutes: 9
  dm_script: |
    第七幅作品——《玻璃之人》
    渡边翔太只能死于02:30—03:30，由此得出管家02:10看到的男尸只能是加藤健一，而此刻升降功能停止，大门口又安置了炸弹，整座六角馆成了全封闭空间，尸体无所遁形。
    Q：那么管家召集众人地毯式搜索，为何没有找到加藤健一的尸体？
    并且此处的搜索不存在搜的粗心大意，例如床下没搜或者柜子里没搜。

    此外，搜索的过程中，凶手坂田仓介与众人一起行动，从没有独自离开过，那么他如何做到让尸体消失？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】

    ■ 谜面解析
    渡边翔太只能死于02:30—03:30，所以管家02:10看到的男尸只能是加藤健一；而此刻升降功能已停止、大门口又安置了炸弹，整座六角馆是全封闭空间，尸体无所遁形。那么管家召集众人地毯式搜索，为何没找到加藤健一的尸体？
    - 此处的搜索不存在粗心大意（例如床下、柜子里没搜）。
    - 搜索过程中，凶手坂田仓介与众人一起行动，从没有独自离开过。

    ■ 标准答案：究极“秦王绕柱”——借助大厅旋转让尸体与搜查人员相对移动
    - 尸体出不去建筑，唯一能做的是让众人找不到它。坂田全程跟众人一起搜索，无法带着尸体跑，只能依托建筑本身。04:50馆内只有旋转功能，就用旋转实现尸体与搜查人员的相对移动。
    1. 管家04:50召集众人说要搜查尸体时，坂田先把尸体挂在（六角大厅外墙的）挂钩上（例如挂住尸体的衣领、项链、腰带等）。
    2. 众人在玄关内集合，坂田可以最后一个到（因为去挂尸体了），随手关上玄关门，然后将大厅旋转180度，尸体就从原本的西侧来到了东侧。
    3. 众人出门时，玄关门是外开门，打开的玄关门会挡住右侧走廊的视线，看不到尸体。
    4. 随后众人顺时针一个个房间搜查，每进入一个房间，为防止潜在的凶手逃走，众人都会把门关上。
    5. 搜查到坂田仓介自己的房间时，他再把大厅转回去，尸体又回到了西侧——而这边众人已经搜查过了。
    6. 检查完所有房间后，众人又进入大厅内搜查，依然什么都没找到。解散后坂田百米冲刺回去把尸体带走即可。
    - 追问：为什么要旋转两次180度，而不是检查一部分房间就转一次？
      答：不能转很多次。04:50馆内供电已恢复，大厅门上的罗马数字灯虽然不亮，但大厅门的门把手是在的，众人知道大厅门把手应该在什么位置。如果大厅转的角度不是180度，门把手位置会变，众人从一个房间到另一个房间的过程中有可能发现。所以转两次180度才是最稳妥的。

    ■ 扶车方向（由浅入深）
    1. 坂田全程和大家在一起，他没法带着尸体走——那么什么东西可以“替他”移动尸体？
    2. 04:50这个时间，六角馆还剩下哪一项功能可以使用？（只有旋转）
    3. 大厅外墙上有什么东西可以挂住一具尸体？
    4. 众人在哪里集合、从哪扇门出来？玄关门是往哪个方向开的？
    5. 搜查是按顺序一间间进行、进房间就关门的——尸体只要永远待在“还没搜/已经搜过”的那一侧就行。

    ■ 玩家常见疑问答疑
    Q（重要）：能不能将尸体分解，从孔洞扔出去？
    A：不能。孔洞的可操控时间是22:00—02:30，管家口供说过04:50时看到孔洞是关闭的，说明最晚02:30就需要关闭孔洞。而管家看到加藤健一尸体的时间是02:10，凶手只有02:10—02:30这20分钟能通过孔洞扔东西。但之前说过，斩首需要20分钟，这段时间顶多够斩首、把头扔下去，尸体还是无法处理。那能不能把头伸出孔洞、操控孔洞关闭来实现快速斩首？——也不行，线索说过孔洞关闭时不能有东西阻挡，否则无法关闭。
    Q：能不能把尸体分了藏在柜子里或者床下？
    A：不可以。柜子和床下肯定也会搜，是地毯式搜索！
    Q：能不能把尸体分了，从山田莉子房间的裂缝丢出去？
    A：首先，裂缝厚4cm，那得把尸体剁成泥？头怎么办？骨头怎么办？其次，裂缝在8m高的地方，如何在房间里爬到8m高？仓库的储物柜不可攀爬。
- id: p6_14
  title: 第七幅作品·答案揭晓
  type: narration
  minutes: 3
  dm_script: |
    第七幅作品复盘
    手法总结：究极秦王绕柱。
    加藤健一尸体一定是出不去建筑了，唯一能做的，是让众人找不到他。
    但坂田全程跟众人一起搜索，无法带着尸体跑，那么只能依托于建筑本身了。
    此刻04:50，馆内只有旋转功能，也就是说需要借助旋转功能实现尸体与搜查人员的相对移动。

    当管家04:50召集众人说要搜查尸体的时候，坂田先将尸体挂在挂钩上（例如挂住尸体的衣领、项链、腰带等等）。
    然后跟随众人在玄关内集合，大家陆续进入玄关后，坂田可以最后一个到（因为去挂尸体了），随手关上玄关门，然后将大厅旋转180度，尸体就从原本的西侧来到了东侧。

    并且当众人出门之时，玄关门是外开的，打开的玄关门会挡住右侧走廊的视线，看不到尸体。

    随后众人顺时针开始一个个房间搜查，并且每进入一个房间，为了防止潜在的凶手逃走，众人都会将门关上。
    当众人搜查到坂田仓介自己的房间时，他再将大厅转回去，尸体又回到了西侧，而此时众人已经搜查过了这边。

    检查完所有房间后，众人又进入了大厅内搜查，依然什么都没找到。
    解散后坂田百米冲刺回去把尸体带走即可。

    为什么要旋转两次180度，而不是检查一部分房间转一次呢？
    不能转很多次，因为04:50那会馆内供电恢复了，大厅门上的罗马数字灯虽然没亮，但是大厅门的门把手是在的，众人是知晓大厅门把手应该在什么位置的。如果大厅转的角度不是180度，那么大厅门把手的位置是会变的，众人从一个房间到另一个房间的过程中，有可能会发现。
    所以，转两次180度才是最稳妥的。

    至此，一年前六角馆内的所有谜题都已解决！
  dm_notes: |
    【演示】可用模型或磁吸贴演示：坂田去集合之前将尸体挂在大厅外墙的挂钩上（西侧）→ 在玄关处集合完毕后，坂田将大厅旋转180度（尸体到东侧）→ 打开外开的玄关门，玄关门挡住走廊一侧的视野 → 众人顺时针搜查到坂田房间时，大厅转回180度（尸体回到已搜过的西侧）。
    【手册示意图说明】（手册第130页的图）图中标注“将尸体挂在挂钩上”“尸体来到这里”，并标出坂田仓介、小林纪子等房间。
    【读完】若玩家还有疑问，参照上一阶段的“玩家常见疑问答疑”（尤其“分尸从孔洞扔出去”这一问很重要）。至此一年前六角馆内的谜题全部结束，下一步进入第八幅作品（下一部分负责）。
- id: p7_01
  title: 第八幅作品·先导谜面
  type: narration
  minutes: 2
  dm_script: |
    真不愧是首屈一指的名侦探！
    至此，六角馆内的所有诡计均已鉴赏完毕！
    但是，我们的鉴赏大会并未结束！
    各位还记得我们现在所处的岛屿是什么岛吗？
    ……
    没错，此刻我们所处的，正是一年前发生六角馆无人生还事件，那座名为雾岛的岛屿！
    ……
    很好！也就是说真实的下雨时间会更早，那么真正的第一场雨下雨时间就是07:20—07:50！
    那么请问各位，在真正的下雨时间之下，之前所推理出的长谷川动线还成立吗？
    ……
    回顾一下刚才各位所推理出的作案动线。
    在你们的推理中，我需要在07:45离开四角屋后，直接去到北侧木屋1，然后等08:00雨停，再走回四角屋，单独留下一串回来的脚印，没问题吧？
    那当我们知道真正的下雨时间是07:20——07:50后，也就代表着，于7:45才离开四角屋的我，在还没有去到北侧木屋1的时候，雨就已经停了！
    如果我还是那么行动的话，07:50我走到北侧小路中间时雨就停了，一定会留下半段去往木屋1的脚印，这半段脚印我无论如何都无法处理掉！
    如此一来，刚才各位的推理也就被推翻了！
    那么各位侦探，请告诉我吧，我到底是如何斩下中村健的头，并留下山口麻衣所看到的脚印的？
    此处请先不要翻阅【我的谋杀作品】，这只是先导谜面。
  dm_notes: |
    【BGM】切换：The Forevers
    【停顿点】（手册里的“等待玩家……”，dm_script 中用“……”表示，不要念出来）
    - “……是什么岛吗？”之后：等待玩家回答：雾岛。
    - “……名为雾岛的岛屿！”之后：等待玩家回忆：记录的天气变化时间比真实时间晚10分钟。（手册没有给这里的提问话术；玩家想不起来时，主持人可适当提示）
    - “……长谷川动线还成立吗？”之后：等待玩家回答：不成立（回答什么不重要，带玩家简单梳理一下）。主持人一定要提前梳理，彻底理解为何不成立。
    【板书】说完“真正的第一场雨下雨时间就是07:20—07:50！”后，把白板B上的下雨时间整体往前调10分钟：
      记录 07:30—08:00 → 真实 07:20—07:50
      记录 10:00—10:01 → 真实 09:50—09:51
      记录 10:35—10:40 → 真实 10:25—10:30
      记录 10:45—10:50 → 真实 10:35—10:40
    【提醒】此处不要翻阅【我的谋杀作品】，这只是先导谜面。
    【主持人必须提前彻底理解旧动线为何不成立】
    “旧动线”指调查档案第一案（中村健案）第一重解答：长谷川07:45出门前把四角屋转180度→实际去北侧木屋1，07:55杀中村健，等08:00雨停→留下北侧回来的脚印；四角屋转45度开辟新路径→木屋2南侧来回脚印；09:00北侧去→09:10—09:30斩首→头放门口、躲在木屋1内→09:45后返回、给自己一板砖；10:00—10:01的雨冲掉全部脚印。
    真实雨时07:20—07:50意味着：07:45出发后07:50雨就停了，他在北侧小路中途就会留下“半段去往木屋1的脚印”，无法消除（脚印不存在倒走、覆盖、不连贯等）→旧动线被推翻。
    本阶段只负责抛出谜面，玩家的推理在下一阶段进行。
- id: p7_02
  title: 先导推理·中村健案真正动线
  type: discuss
  minutes: 6
  dm_script: |
    请各位重新梳理一下动线。
    真实下雨时间：07:20—07:50 / 09:50—09:51 / 10:25—10:30 / 10:35—10:40。
    Q：我到底是如何斩下中村健的头，并留下山口麻衣所看到的脚印的？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】
    【核心答案】长谷川使用了“第二颗人头”（佐藤光一的头，事先装在从不离身的双肩包里带到现场）。山口麻衣恐血，09:35在木屋1门口看到的满脸是血的头并不是中村健的，真正的斩首发生在麻衣被吓跑之后。
    【手册要求】当玩家提出使用第二颗头之后，依然需要给出长谷川完整的动线。

    【真正动线】（时间｜长谷川动线｜脚印｜山口麻衣动线）
    07:45—07:50｜在四角屋南门等待（真实的雨还在下）｜无｜在四角屋内
    07:50—08:00｜四角屋→南侧木屋2｜南侧·去｜在四角屋内
    08:00—08:10｜木屋2→四角屋｜南侧·回｜在四角屋内
    08:10—08:35｜在四角屋南门等待｜无｜在四角屋内
    08:35—09:00｜在四角屋内｜无｜在四角屋内
    09:00—09:10｜四角屋→北侧木屋1，杀死中村健，把备好的头放在门口｜北侧·去｜四角屋→木屋2，看到长谷川南侧来回脚印
    09:10—09:20｜木屋1→四角屋（必须回来，不能留在木屋1里斩首，否则就缺了一条麻衣看到的北侧“回来”的脚印）｜北侧·回｜在木屋2上5分钟厕所，之后返回四角屋
    09:20—09:25｜躲在四角屋西侧｜无｜到达四角屋
    09:25—09:35｜躲在四角屋西侧｜无｜四角屋→木屋1，看到长谷川北侧来回脚印，到达后看到人头
    09:35—09:45｜躲在四角屋西侧｜无｜木屋1→四角屋
    09:45—09:55｜四角屋→木屋1斩首（真实第二场雨09:50—09:51）｜无｜四角屋→六角屋
    09:55—10:05｜斩首 ing｜无｜到达六角屋召集众人
    10:05—10:15｜斩首 end｜无｜众人从六角屋去往四角屋
    10:15—10:25｜木屋1→四角屋，路上给自己的头来一板砖｜北侧·回｜众人抵达四角屋
    10:25与众人会合，时间刚刚好。

    【为什么现在成立】第一重推理时，“第二颗头”被否定的原因是：10:15—10:25长谷川从木屋1返回的脚印会留下，而众人10:30去木屋1时没看到任何脚印。
    但现在记录的第三场雨10:35—10:40，真实时间是10:25—10:30。众人10:25到达四角屋后，在屋内给长谷川包扎了五分钟，没有感知到这场雨，而它把所有脚印都冲刷掉了。所以众人10:30出发去木屋1时，看不到任何脚印。

    【下雨时间的认知错位】（众人以为自己在漂浮岛，把记录的雨时当成真实雨时，与亲身经历错误匹配）
    第一场：记录07:30—08:00，真实07:20—07:50。没被发现，是因为雨停时麻衣在四角屋内，其他人在六角屋房间里，都不知道雨几点停；只有长谷川知道，但他不会说。
    第二场：记录10:00—10:01，真实09:50—09:51。只下了一分钟，09:45—10:05麻衣一直在东侧路上跑，记录时间和真实时间都落在这段里，她没看钟，事后查记录就以为那一分钟雨是10点下的；其他人在六角屋房间内，甚至不知道下过雨。
    第三场：记录10:35—10:40，真实10:25—10:30。众人在四角屋内给长谷川包扎，根本没有感知到。
    第四场：记录10:45—10:50，真实10:35—10:40。众人10:30从四角屋出发去北侧木屋1，10:35走到一半下雨了，这其实是第四场雨；但事后查记录看到“10:35—10:40”，就以为路上淋的是第三场。10:40进入木屋1讨论，又以为记录中“10:45—10:50”那场雨是在他们在木屋里时下的，所以没感觉到。

    【扶车方向】
    1. 先给玩家时间，在真实雨时下重新模拟动线（距离第一次推理已经很久，玩家可能忘了基本信息：单程10分钟、斩首20分钟、麻衣09:00看到南侧来回脚印、09:25看到北侧来回脚印、长谷川“09:30被打晕”的说法是凶手口供，可以撒谎）。
    2. 让玩家自己发现：在真实雨时下，长谷川根本无法同时完成斩首和脚印。
    3. 这时再引导他们想到变量：长谷川是所有案件的凶手，他手里可以有“别人的头颅”。可提示：“山口麻衣恐血，她在木屋1门口看到的那颗头，一定看清了吗？”
    4. 如果玩家第一重推理时就提过“第二颗头”，这里会快一些。
    5. 玩家提出第二颗头后，仍要求他们给出完整动线，重点核对：09:10必须先返回（留下北侧回来脚印）；10:15—10:25的回程脚印被真实第三场雨冲掉。
    6. 双肩包、头颅是谁的问题在后面两个阶段，本阶段不用提。
- id: p7_03
  title: 先导揭晓·第二颗人头
  type: narration
  minutes: 2
  dm_script: |
    没错，山口麻衣第一次看到的那颗头颅满脸是血，根本看不清面容！而她本身就很惧怕血，不可能近距离检查，所以我完全可以将其他尸体的头颅放置在木屋1的门口，以此来完成诡计。
    但是！我如果放置一颗人头在木屋1的门口，一定不能在中村健07:10去木屋1之前就放，否则中村健抵达木屋1之后发现门口有一颗人头，立马就会折返回来！
    而今天早晨我与中村健、山口麻衣是一块来到四角屋的，中途没有其他时间再去取人头，那会我就需要将人头带在身上，那请问，我如何在他们眼皮子底下带着人头却不被他们发现呢？
    ……
    是的！我有一个从不离身的双肩包，里边装着我最爱的推理小说，我只需要提前将头放在背包里带到现场即可，如此一来所有的问题就都解决了。
    可是各位，我带到现场的那颗头颅，到底是谁的呢？
  dm_notes: |
    【进入本阶段的时机】手册：等待玩家推理出长谷川使用第二颗头的正确动线之后，再继续后续流程（念本段）。手册此处没有长谷川口述完整动线的台词；如需向玩家核对动线，参考上一阶段 dm_notes 的动线表（手册第134页）。
    【停顿点】“……却不被他们发现呢？”之后：等待玩家回答：长谷川从不离身的双肩包。此处不涉及推理，就是一个小的伏线回收，可以提醒玩家回忆长谷川的穿搭和随身物品：双肩包。等玩家说出“双肩包”后再念后面的话。
    【措辞】“今天早晨”是手册原文，指的是11月1日中村健案那天的早晨。
    【板书】可在白板B上用磁吸贴按上一阶段的动线表演示一遍。
    最后一句“我带到现场的那颗头颅，到底是谁的呢？”之后，手册写：等待玩家回答：佐藤光一。接下一阶段。
- id: p7_04
  title: 先导推理·头颅之选
  type: discuss
  minutes: 2
  dm_script: |
    佐藤光一在我们来雾岛的航行过程中就死了，我确实可以下船时就带着他的头，然后用于11月1日的诡计。
    可是各位，我只有佐藤光一的头可以用吗？
    回忆一下我们登上地平线号的所有人，11月1日中村健案发生时，都有谁是确定死亡或者失踪的？
    ……
    11月1日，除了我们此刻在场的8位和中村健，就只剩下山本阳介、吉田和真与佐藤光一了，而山本阳介11月2日凌晨才死。
    至于吉田和真，各位，吉田和真，现在还是铃木美雪吗？
    ……
    没错，铃木美雪去年就被我杀死在六角馆内了，不可能再是今天的吉田和真。
    而吉田和真在11月1日一早就消失了，他的头同样有可能被我用来完成中村健案！
    那么各位，作为最优秀的侦探，除了需要绝对理性的推理外，有的时候还需要敏锐的直觉判断，请告诉我，我带到现场的头颅，到底是谁的呢？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】
    【真解答】佐藤光一的头（在船上就被斩下，装进背包带下船）。原因要到第九幅作品才揭晓：吉田和真的尸体必须完整地留到11月2日弹珠密室使用，所以中村健案只能用佐藤光一的头。本阶段是“二选一”的直觉选择，不要求玩家推出理由。

    【引导流程】
    1. 上一阶段末尾问“到底是谁的呢？”时，此处大部分人都会提出是佐藤光一的人头，很少有人能想起还有个吉田和真。如果此处就有人说吉田和真，那直接进行后续的2选1即可（直接念本段最后一句“那么各位，作为最优秀的侦探……”）。
    2. 可能会有人说是“铃木美雪”，主持人否定即可：铃木美雪是一颗女头，长发，肯定无法用来伪装成中村健的头。
    3. 当玩家一致认为只有佐藤光一的时候，主持人按本段 dm_script 带领玩家梳理，得出此处所有的可能性。
    【停顿点】
    - “……都有谁是确定死亡或者失踪的？”之后：等待玩家回答：吉田和真。此处稍加引导玩家就能意识到，吉田和真也能成为可用选项之一。
    - “……现在还是铃木美雪吗？”之后：等待玩家反应：吉田和真不可能再是铃木美雪。
    - 最后一句之后：等待玩家回答给出选择，随后决定先进哪幅作品。如果玩家询问“做选择有什么意义？”，主持人可以告知：做出的选择将决定后续作品的推理顺序。
    【原文漏字】手册写作“11月1一早”，此处补为“11月1日一早”。

    【分支说明】
    - 选“佐藤光一”（默认）：直接进入下一阶段“第八幅作品·发布”，之后按 第八幅→第九幅→第十幅 进行。
    - 选“吉田和真”：手册原流程是先进行第九幅作品（p7_08～p7_10）。衔接话术（手册第148页原文）：“吉田和真上岛后就消失了，我确实可以提前杀死他并将他的头颅用于中村健案。”然后直接念第九幅作品的谜面话术，但此时不要让玩家翻【我的谋杀作品】（防止先看到第八幅的谜面），第九幅谜面很简单，直接开始推理。第九幅解完后，玩家会意识到吉田和真的尸体要留给弹珠密室，“否则弹珠密室无解”，所以这里只能用佐藤光一，再回到第八幅作品（p7_05起）。第八幅解完后，正常进入第十幅。
    - 如果系统无法跳转阶段（以下为整理者建议，不是手册原文）：可以先说上面那句衔接话术，再补一句“不过这个选择是否成立，稍后自有分晓。我们先假设这颗头是佐藤光一的”，然后照常进入第八幅；到第九幅揭晓时再明确“中村健案只能用佐藤光一的头”。
- id: p7_05
  title: 第八幅作品·发布《斩首迅速》
  type: narration
  minutes: 2
  dm_script: |
    选择佐藤光一是吗？恭喜你们做了明智的选择！
    但同时也要遗憾地告诉诸位，你们的推理再次陷入了新的逻辑悖论中！
    我们下船之时，山口麻衣给船舱上了一把11月3日才会解锁的定时锁，我要将佐藤光一的头从船上带下来用于中村健案，唯一的机会是下船之前就将他斩首并把头放进我的背包吧？否则一旦下了船，这几天内我都无法再进入船舱了。
    那让我们来回忆一下吧新井侦探！航行的过程中，在佐藤光一死后，我们什么时候分开过呢？
    ……
    新井前辈，佐藤光一死后我们一起待在聊天室，然后在11:10一起回到你的房间，而你因为有些晕船所以睡了一会，我去替你泡茶，你在听到杯子破碎的声音后醒了过来，开门看了一眼时间——11:20，然后回了房间。
    紧接着过了一两分钟我就回来了，然后我们一起待在房间直到下船上岛。
    也就是说，佐藤光一死后，我和你直到下船仅仅分开过最多12分钟的时间。
    可是！各位侦探你们忘了吗！斩首需要多少分钟？
    ……
    所以！请你们告诉我，要想在这短短的十二分钟内完成斩首，我究竟是如何做到的？！
    这，便是我的第八部作品。我将它命名为——《斩首迅速》
    请翻阅第八幅谋杀作品！
  dm_notes: |
    【演出】说到作品名字的时候，将第八幅作品的板书卡条重重拍在白板上！拍完之后，提示玩家翻阅【我的谋杀作品】的第八幅作品。
    【停顿点1】“……我们什么时候分开过呢？”之后：等待新井直人回忆并分享佐藤光一死后那一段剧本内容（人物剧本第11页）。这是6份人物剧本中唯一一个作用于推理的私人视角。如果这位玩家不善于分享或找不到，主持人也可以直接帮助他总结出来（即下一段“新井前辈，……”）；最好还是让玩家分享，有一些细节的环境描述（例如走廊昏暗）。
    【停顿点2】“斩首需要多少分钟？”之后：等待玩家回答：20分钟。（手册此处的提示误重复成了“等待新井直人回忆并分享……”，按上下文应为等玩家回答斩首时间。）
    【斩首时间】斩首固定需要20分钟，不存在任何加快斩首的方法。
    【若之前选的是吉田和真】此时玩家刚解完第九幅作品。手册只要求“给玩家明确上一案不再能使用吉田和真，只能用佐藤光一，但是如果选佐藤光一，同样存在着一个悖论”，没有给原话；可以先这样说明一句，再从“我们下船之时……”念起（跳过开头两句）。
- id: p7_06
  title: 第八幅作品·推理
  type: discuss
  minutes: 6
  dm_script: |
    第八幅作品《斩首迅速》
    佐藤光一死后，直人与悠人只分开过最多12分钟，12分钟不可能完成斩首。
    并且我们之前也说过，不存在什么方法能够加快斩首时间。
    Q：要想在这短短的十二分钟内完成斩首，我究竟是如何做到的？！
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】
    【追问】玩家方向对了之后，要求他们说清：新井直人看到11:20那一刻的真实时间是几点（11:50），以及钟柜、门、镜子分别怎么摆。
    【核心答案】误导新井直人对时间的判断。11:20是假的，那一刻真实时间是11:50。长谷川把走廊尾部的钟柜搬进空房间、放在门对面的墙下，并把钟柜旋转180度，再把空房间的门打开到45度。新井直人从自己房门口看到的是“门后等身镜”里的反射：11:50 → 旋转180度变成05:11 → 镜面左右颠倒变成11:20。

    【推理步骤】
    0. 众人手机都被收走，船上靠船舱走廊尾部的时钟辨认时间（参考【调查档案—？？？案】图例）。时钟固定在柜子上，时间不可调，所以只能挪动或旋转柜子。
    1. 哪个时间有问题？佐藤光一死后新井直人看过两次时间：11:10和11:20。11:10是他与长谷川回房间的时间，之前众人还在一起收拾残局，没有机会操作钟柜；而且旋转钟柜后，不是特定时间的话立刻会被看出来（比如倒过来的“3”“7”），必须等众人都回房后才有机会。所以只能是11:20有问题。
    2. 真实时间范围：要满足斩首20分钟，看到11:20那一刻的真实时间一定在11:30之后；直人醒来后没再睡过，13:30众人一起下船时一定是真实时间。所以真实时间在11:30—13:30之间。
    3. 常见错误：只把柜子旋转180度，真实时间02:11看起来像11:20。不行：直人11:10睡下，没被迷晕，不可能一觉睡15个小时到第二天凌晨；其他人也会来找他；而且他会少算一天航行天数，不存在“双日诡计”。（柜子也不能整个翻面，背面没有数字。）
    4. 把11:30—13:30梳理出来后，让玩家自己用稿纸写写画画，不难得出真实时间是11:50。
    5. 理论层面：玩家可能直接说“11:50上下翻转就是11:20”。但钟柜不透明，整个翻过来直人只能看到柜子背面。长谷川能做的只有把柜子旋转180度：11:50 → 05:11；还需要一次镜面翻转（左右颠倒）：05:11 → 11:20。
    6. 镜子在哪：每人人物剧本第二幕都写了“船舱门上有一面与门一样大的等身镜”“每个船舱的大小和硬件设施都一样”。
    7. 摆放：钟柜搬进空房间，放在空房间门对面那堵墙下，时钟旋转180度，空房间的门打开到45度。直人的视线与镜子呈45度，镜子与钟柜也呈45度，入射角等于反射角。柜子高2米，正好挡住船舱的透明窗，不透光。

    【注意点】
    (1) 时间观测必须很精准，要在11:50那一分钟内让直人看到，所以直人是被长谷川故意摔杯子弄醒的，不是自然醒。
    (2) 从角度上看，聊天室、茶水间、储物间也都可以放，但这三个房间有桌椅等杂物，所以最好选空房间。
    (3) 直人的视角明确写了走廊很昏暗，他只能看到发光的时钟数字，看不到其他东西。

    【错误手法封堵】（具体怎么摆镜子，玩家会有很多想法）
    (1) 任何把钟柜摆在门后的方法（不管是直人的门，还是视线方向上的其他门）都不行：门不透明，直人的视线被挡住了。
    (2) 把柜子旋转180度后直接放在镜子正前方、钟面对着镜子：反射出来确实是11:20，但直人看不到钟，被挡住了。
    (3) 用两面、三面甚至更多镜子：两面镜子反射两次等于没有左右颠倒；三面本质上等价于一面。可以直接告诉玩家：一面镜子就够了。
    (4) 把钟柜摆在纵向走廊之类的奇怪位置：镜子只有船舱门后才有，而且取不下来，门的开合方向也是固定的（调查档案平面图上画了门把手）。入射角等于反射角，位置奇怪的话直人根本看不到钟，也找不到角度让他看到正着的数字。

    【玩家答疑】
    Q1：直人醒来时真实时间是11:50，他少了30分钟，不会发现吗？A：不会。直人剧本写了，长谷川回到房间后就开始和他聊最近看的推理小说，一直聊得很投入，直到13:30麻衣通知下船，期间直人没有再确认过时间。
    Q2：长谷川什么时候把钟柜复位的？A：直人看完11:20回了房间，过了一两分钟长谷川才来，他在这一两分钟里把钟柜搬回去即可。
    Q3：直人可以被换房间吗？A：不可以。直人从看到11:20直到下船都没再睡过，如果换了房间，睡醒不在自己房间，下船时一定会发现。
    Q4：这么操作后，数字的位置或间距变了，直人不会发现吗？A：最终直人看到的11:20，数字位置和间距都没变（用时间大卡一演示就明白）。
- id: p7_07
  title: 第八幅作品·答案揭晓
  type: narration
  minutes: 3
  dm_script: |
    那么只有一种可能性——误导新井直人对时间的判断。
    众人的手机都被收走了，在船上是通过船舱走廊尾部的时钟来辨认时间（参考【调查档案——？？？案】的图例），因此本案要考虑的就是如何通过时钟误导新井直人的时间。
    首先，时钟固定在柜子上，且时间不可调，只能考虑挪动或旋转柜子。
    佐藤光一死后，新井直人一共看过两次时间——11:10和11:20。因此想要误导直人对时间的认知，这两个时间中必定有一个不是真实时间。
    1.判断哪个时间会出问题？
    11:10是直人与长谷川回房间的时间，在此之前众人还在一起收拾佐藤光一死后的残局，这之前不可能去操作钟柜，因为如果旋转了钟柜，如果不是特定时间，立马会被之间看出时间有问题，例如倒着的“3”、“7”之类，因此需要等众人都回去之后，才有操作机会。
    因此只能是11:20这个时间有问题。并且如果要满足斩首时间20分钟，直人看到11:20的那一刻，真实时间一定在11:30后。
    并且直人醒来后就没再睡过，直到13:30众人一起下船，此刻的13:30一定是真实时间，因此将直人看到11:20那一刻的真实时间锁定在11:30—13:30。
    2.判断真实时间
    直人醒来后看到11:20这个时间，已知此刻的真实时间在11:30—13:30之间。
    首先玩家会凭直觉认为就是将柜子旋转了180度，真实时间实际上是02:11，旋转过后让直人以为是11:20。
    （不能直接将柜子翻个面，因为背面没有数字，只有正面显示屏上有数字）
    这肯定是不行的。
    首先，直人一定是11:10睡的觉，他也没有被长谷川迷晕之类的，怎么可能直接睡了15个小时左右，从11:10睡到02:11。
    其次，如果直人直接从今天的11:10睡到了第二天凌晨02:11，先不说其他人为什么不找他，众人在海上航行的天数会出现认知差，例如别人认知中在海上航行了7天，但是直人睡了一天，但是起来以为只过了10分钟，那么他的认知中就会认为只航行了6天，所以不可能存在“双日诡计”。
    不难得出真实时间实际上是——11:50。
    也就是说，玩家需要推理的是：如果让真实时间11:50，成为新井直人看到的11:20。
    3.长谷川手法破解
    首先是理论层级：
    11:50上下翻转一下不就是11:20了吗？
    但是！钟柜是不透明的，如果将整个钟柜翻转过来，那么直人连钟都看不到，只会看到一个柜子的背面。
    所以说，长谷川能做的也只有将柜子旋转180度，11:50旋转180度之后变成了05:11。
    此时还需要一个操作：镜面翻转——05:11左右颠倒之后就成为了11:20。
    理论成立，开始实践：
    至此我们已经知晓了真实时间是11:50，并且旋转柜子180度这个行为长谷川可以直接做到，但是，如何实现镜面翻转？——即镜子在哪里，如何摆放？钟柜如何摆放？
    首先是镜子，每个人人物剧本第二幕上船进入房间之后，都描写过“要离开房间时，发现门上有一个与门一样大的等身镜”“每个船舱的大小和硬件设施都一样”。
    那么剩下的问题就是门如何开，以及钟柜摆在哪里，手法复盘：
    长谷川将钟柜搬进空房间，放到空房间的门对面那堵墙下，然后将时钟旋转180度，然后再将空房间的门打开至45度。
    如此一来，从新井直人房间门口的视角看过去，看到的就是经过门后那面镜子反射过后的景象，直人的视角与镜子呈45度，镜子与钟柜也是45度，符合入射角等于反射角。
    真实时间11:50，经过180度旋转以及镜面反射之后，最终成为11:20。
    并且柜子高2m，可以挡住船舱的透明窗，不透进光。
    4.此手法有几个注意点：
    （1）此手法时间观测需要很精准，就要在11:50那一分钟内让直人看到，否则可能会有被识破的风险从而放弃计划，因此新井直人是被长谷川刻意弄醒的（摔杯子），不是自然醒的，就是为了让他那个时刻看时间。
    （2）放时钟的地方从角度上看。聊天室、茶水间和储物间都可以，操作方法也差不多，但是这三个房间有其他桌椅板凳等杂物，因此最好选择空房间。
    （3）直人的视角明确描述了走廊很昏暗，因此也只能看到有光的时钟上的数字，不会看到其他东西。
  dm_notes: |
    【来源】本段是手册“第八幅作品谜面解析”后半与“第八幅作品复盘·手法破解”1—4的原文（手册第141—144页），手册没有为这里写长谷川的口述台词。已去掉只给主持人看的话：“此处将11:30—13:30这个时段梳理出来之后，让玩家自行思考一下，用稿纸写写画画什么的”“此处玩家可能直接提出：”“主持人可用【时间大卡】给玩家演示”，以及图片里的文字（钟面图、走廊平面图）。“5.关于错误手法封堵”和“第八幅作品玩家答疑”放在上一阶段 dm_notes，供答疑用。
    【时间大卡演示】讲到“镜面翻转”时，用【时间大卡】（卡6：11:50与11:20正反卡片）给玩家演示：
      第一步：展示真实时间 11:50
      第二步：旋转180度，成为 05:11
      第三步：左右颠倒，即将大卡左右翻个面，成为 11:20
    【手册图示】第142页：11:20 旋转180度 → 02:11（“真实时间02:11／虚假时间11:20”，即错误解法）；第143页：真实时间11:50 → 旋转柜子180度后是05:11 → 镜面翻转（即左右颠倒）→ 左右颠倒后，最终成为直人看到的11:20；第144页平面图：直人在走廊一端的房门口，视线沿走廊射向另一端；空房间在走廊另一端、茶水间旁边，钟柜靠空房间门对面的墙，空房间的门开45度。
    【板书】可在白板上画示意图：空房间（钟柜靠门对面的墙）、空房间门开45度、走廊、直人房门、直人视线。
    【手册原文笔误】“立马会被之间看出时间有问题”中的“之间”原文如此（疑为“直接”）；“可以挡住船舱的透明窗”手册误作“透明船”，已改。
    讲解中如有玩家追问，参考上一阶段的“错误手法封堵”和“玩家答疑”（如：直人少了30分钟为什么没发现、钟柜何时复位）。
- id: p7_08
  title: 第九幅作品·发布《透明人死于密室》
  type: narration
  minutes: 1
  dm_script: |
    各位，接下来便是11月2日的山本阳介案。
    既然我们所处的岛屿不是漂浮岛而是雾岛，那么只有漂浮岛才拥有的“强大的动力装置”自然不存在了，因此我无法再让整座岛屿产生任何偏移。
    那么之前所推理的用岛屿偏移带动建筑倾斜，从而制造弹珠密室的手法自然被推翻了。
    这弹珠密室，各位又该如何破解呢？
    在推理正式开始之前，不妨给各位一个提示吧。
    《透明人死于密室》
    这就是我的提示，也是给各位准备的第九部作品！
    翻阅第九幅谋杀作品——透明人死于密室。
  dm_notes: |
    【BGM】本节手册未要求切换。
    【演出】说到作品名字的时候，将第九幅作品的板书卡条重重拍在白板上！拍完之后，提示玩家翻阅【我的谋杀作品】的第九幅作品。
    【若之前头颅环节玩家选择的是吉田和真】（即本作品被提前到第八幅之前）：先直接告知“吉田和真上岛后就消失了，我确实可以提前杀死他并将他的头颅用于中村健案。”总结完后，进上面的谜面话术即可，但不需要翻作品（担心玩家会先去看第八幅作品的谜面），也就不念最后一句“翻阅第九幅谋杀作品——透明人死于密室。”
- id: p7_09
  title: 第九幅作品·推理
  type: discuss
  minutes: 5
  dm_script: |
    第九幅作品《透明人死于密室》
    本案的谜面依然是如何完成弹珠密室。
    相对第一重推理，少了“漂浮岛”这一条件。
    Q：这弹珠密室，各位又该如何破解呢？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】
    【谜面】依然是如何完成弹珠密室，只是相比第一重推理，少了“漂浮岛”这个条件。本案手法上不复杂，只是需要玩家结合全局视角并回顾之前的信息。
    【追问】玩家解出弹珠密室后，再抛出手册复盘里“还存在的一个问题”：从长谷川悠人出现，到众人一起去拿钥匙，再到回六角屋，长谷川一直都跟大家待在一起，没有分开过，他是没有任何时间去挪动尸体的——那众人两次看到的尸体是怎么回事？（答案见核心答案第8条）

    【核心答案】
    1. 雾岛上此刻有一座六角屋（今年新建，无机关）和一座六角馆（去年的双子馆被炸毁一座，还剩一座）。
    2. 11月2日白天，除了长谷川、山本阳介、吉田和真，其余人一直在四角屋内推理，长谷川有一整天时间作案。他在众人推理时把四角屋旋转了180度。
    3. 22:00众人出来准备回六角屋，实际走上的是西侧小路，看到纸条后立刻朝认知中的六角屋跑去。
    4. 在此之前，长谷川已经把六角馆移动到岛屿正西侧，并把六角大厅降到底。大厅降到底后，六角馆从内部看就和六角屋一样（唯一区别可能是走廊地板上的孔洞，但众人没去那个位置查看）。众人以为到了六角屋，其实是六角馆。第一次发现弹珠密室的地方是六角馆。
    5. 六角馆里的弹珠密室：地上放好弹珠，操控六角馆来到岛屿北边，沿环形滑轨逆时针转动，先加速后减速，最终停在岛屿正西侧。停在正西侧时，12号房门朝正南，房间内弹珠的惯性也朝南，于是滚到门边。
    6. 众人打不开12号门，在隔壁透过玻璃发现了弹珠密室；此时长谷川出现，大家一起回四角屋找钥匙，找了五分钟。这五分钟里，长谷川花两分半把四角屋再旋转180度复原。众人拿完钥匙出门，走的是真正的东侧小路，到的是真正的六角屋（这次山口麻衣用六角屋的钥匙打开了12号门，所以一定是六角屋，六角屋的钥匙打不开六角馆的门）。
    7. 回到六角屋后，众人没有再去隔壁检查，直接给12号门解锁。第一个上前的是长谷川，上去就是一脚，门伴随着弹珠滚落的声音开了。实际上六角屋里不存在弹珠密室，门后确实有东西挡着，但没有完全贴着门，留了一个足够长谷川出去的空间。
    8. （Q2）众人第一次在六角馆看到的是一具有头的男尸（文本写了面朝下，所以一定有头），在六角屋看到的才是真正的山本阳介。所以本案需要第二具完整的尸体，只能是吉田和真：佐藤光一的尸体在船舱里，11月3日才进得去；中村健的尸体没有头，且被山口麻衣锁起来了。
    9. 由此推出：中村健案中长谷川只能用佐藤光一的头，吉田和真的尸体要留到11月2日的案件用。
    10. 作品名的意义：本案其实有两名死者，除了明面上的山本阳介，还有一个悄无声息死去、没被察觉的吉田和真——他就是“透明人”。

    【扶车方向】
    1. “别忘了，此刻的雾岛之上，除了六角屋，还有什么建筑？”（双子馆中幸存的那座六角馆）
    2. “11月2日白天，谁不在四角屋里？”
    3. “你们怎么确认22:00跑去的那栋建筑就是六角屋？两者从外面能分清吗？”（第三幕：建筑外分不清六角屋和六角馆；六角馆大厅降到底就和六角屋内部一样）
    4. “四角屋还能做什么？”（旋转180度误导方向，参考中村健案）
    5. 弹珠如何滚动：建筑沿环形滑轨先加速后减速产生的惯性。

    【玩家答疑】
    Q1：长谷川能不能就躲在六角屋12号房内，自己摆好弹珠，等众人进隔壁房间的瞬间从12号房出来与众人会合？A：不能。众人是陆续进入隔壁房间的，中间是透明玻璃，第一个人进去的瞬间就能看到12号房内的景象，而此时还有人没进隔壁，长谷川不能出来。所以他不可能躲在12号房内。
- id: p7_10
  title: 第九幅作品·答案揭晓
  type: narration
  minutes: 3
  dm_script: |
    11月2日，除了长谷川、山本阳介和吉田和真外，所有人都一直在四角屋内推理。因此长谷川有一整天的时间可以作案。
    此外，玩家可能已经忘记了，此刻的雾岛之上，还有一座六角馆的存在。
    六角馆原本是双子馆，去年被炸毁了一座，还剩下一座，并且今年新修建了一座六角屋，也就是说此刻的雾岛之上，有着一座六角屋和一座六角馆。
    以下是当天长谷川作案动线的解析：
    众人白天在四角屋内推理的时候，长谷川已经将四角屋旋转了180度。
    当众人22:00出来准备回六角屋的时候，实际上是来到了西侧小路，然后看到了纸条，立马朝他们认知中的六角屋跑去。
    而在此之前，长谷川已经操控六角馆移动至岛屿的正西侧，然后将六角大厅下降，当大厅下降到底之后，实际上六角馆就和六角屋长得一样了（唯一的区别可能就是那个洞，但众人并没有过去洞的位置查看）。
    众人以为来到了六角屋，实际上是来到了六角馆。
    也就是说，其实第一次发现弹珠密室的地方并不是六角屋，而是六角馆。
    而六角馆想要形成弹珠密室就简单得多了：
    在地上放好弹珠，操控六角馆来到岛屿的北边，然后沿着环形滑轨逆时针转动，先加速后减速，最终停在岛屿正西侧。
    当六角馆停在岛屿正西侧之时，12号房间的房门是朝正南的，而此刻房间内的弹珠惯性也朝南，因此会滚落到门边。
    众人打不开12号房门，然后在隔壁发现了弹珠密室的存在，此刻长谷川悠人出现了，随后众人一起回四角屋找钥匙，找了五分钟。
    这五分钟内，长谷川花两分半再次将四角屋旋转了180度，因此当众人拿完钥匙出门的时候，来到了真正的东侧小路，回到了真正的六角屋（因为这次山口麻衣用六角屋的钥匙打开了12号门，因此去的一定是六角屋，六角屋的钥匙无法打开六角馆的门）。
    再次回到六角屋之后，众人没有再去隔壁检查，而是直接将12号房门解锁，解锁之后，第一个上前的人是长谷川，他上去就是一脚，然后门伴随着弹珠滚落的声音就开了，实际上此时的六角屋不存在弹珠密室。
    门后确实有挡住，但没有完全贴着门，留了一个足够长谷川出去的空间。
    至此弹珠密室就解决了，但还存在一个问题：
    从长谷川悠人出现，到众人一起去拿钥匙，再到回六角屋，长谷川一直都跟大家待在一起，没有分开过，他是没有任何时间去挪动尸体的。
    但是众人第一次在六角馆看到了一具有头的男性尸体（文本写了面朝下，一定是有头的），在六角屋又看到了真正的山本阳介的尸体，因此可以得出，本案需要使用第二具完整的尸体，而这具尸体便只能是吉田和真。
    因为佐藤光一的尸体在船舱内，11月3日才进得去船舱。
    而中村健的尸体没有头且被山口麻衣锁了。
    至此就可以知晓，在中村健案，长谷川只能使用佐藤光一的头，吉田和真的尸体需要留到11月2日的案件来用。
    这幅作品为什么叫作《透明人死于密室》呢？
    以及为什么说这幅作品的名字本身，就是对本案的提示呢？
    因为在本案中其实涉及两名死者，除了明面上众人发现的山本阳介外，还有一个吉田和真悄无声息间死了而没被众人察觉，这位可怜人吉田和真就是那个——透明人。
  dm_notes: |
    【来源】本段是手册“第九幅作品复盘·手法破解”和“本案推理结束后给玩家解释作品名称的意义”的原文（手册第149—151页），手册没有为这里写长谷川的口述台词。
    【模型】可用双馆模型 + 白板上的岛屿俯视图演示：四角屋旋转180度→众人走西侧小路；六角馆停在正西侧且大厅降到底；六角馆沿环形滑轨从北侧逆时针先加速后减速停到西侧，弹珠因惯性朝南滚到12号门边；五分钟找钥匙期间四角屋复原。
    【分支】
    - 若头颅环节选的是“佐藤光一”：本作品结束后，继续第十幅作品（下一阶段）。
    - 若选的是“吉田和真”：本作品结束后要向玩家明确，上一案（中村健案）不能再用吉田和真，只能用佐藤光一；但选佐藤光一同样存在一个悖论，然后进入第八幅作品（p7_05）。第八幅解完后，再正常进入第十幅。
    手册原文写作“再次回到四角屋之后”，按上下文应为“再次回到六角屋之后”（手册笔误，原件图片上就是“四角屋”），已改正。
- id: p7_11
  title: 第十幅作品·发布《死者不会沉睡》
  type: narration
  minutes: 3
  dm_script: |
    真不错啊各位侦探，我们的鉴赏大会终于迎来了尾声。
    根据你们的推理，佐藤光一的头颅在上岛前就被我斩下放入背包，之后用作了11月1日中村健案的诡计，没错吧？
    ……
    如果是这样的话，说明佐藤光一在我们下船的那一刻就已经是一具无头尸了对吧？
    那请问各位侦探，11月3日船舱着火之后，你们在船舱的储物间发现的那具焦尸，他只少了一只手臂，这具焦尸还能是佐藤光一吗？
    ……
    是的，铃木美雪去年就死了，不可能再去将床垫挖个洞伪装自己的死亡然后去储物间自焚，你们所看到的铃木美雪头颅，真的就只是一颗头而已。
    而山本阳介和中村健的尸体都已经被山口麻衣锁起来了。
    所以，各位侦探，要想让你们的推理形成闭环，这具焦尸的真实身份，就只能是那个可怜的透明人——吉田和真！
    吉田和真跟随我们一起上岛，随后被我杀死，并将他的尸体存放于六角馆内，用来完成了11月2日的弹珠密室！
    另外，各位侦探是否还记得，船舱门上有什么？
    ……
    没错！在我们下船前山口麻衣曾给舱门加装了一把电子锁，而这把电子锁的解锁时间，是11月3日中午12点。
    是的各位，要想将吉田和真的尸体从六角馆内送回船舱内，我就只能在11月3日也就是今天中午12:00后行动，因为12点后我才能进入船舱。
    但是，各位侦探，我可是有着，绝对完美的不在场证明啊。
    今天中午12:00——12:40我在六角屋内，山口麻衣看守在大门口。
    12:40——13:00我与山口麻衣小姐一起来到四角屋，与你们汇合。
    这一切，山口麻衣小姐均可为我做证。
    而从13:00直到发现船内着火，我和你们所有人在一起。
    你们，可以给我做证。
    所以，
    感谢各位。感谢你们所有人和我共同完成了这最后一部作品，为我制造了这绝对完美的不在场证明。
    在诸位的共同见证下，我想，只有一种解释了。
    那就是——死者吉田和真，拖着已死之躯，自己，走进了船舱之内！
    随后，他用一把大火，将自己与地平线号，共同焚烧在这雾岛之下！
    请各位鉴赏我的最后一部作品——《死者不会沉睡》
    好好珍惜吧
    名侦探们。
    因为
    这，就是我的最后一章了啊。
    请翻阅，我最后的作品——《死者不会沉睡》
  dm_notes: |
    【BGM】切换：Reflection of Our Instant
    （手册此处标题写成“长谷川悠人进行第八幅作品的前置谜面引导”，实为第十幅，笔误。）
    【停顿点】（dm_script 中的“……”）
    - 第一处：等待玩家给予肯定。后续将会串联出构建本案谜面的一些信息。
    - 第二处：等待玩家思考：这具尸体只能是吉田和真。
    - 第三处：等待玩家思考：一把11月3日解锁的定时锁。
    【语气】说“我可是有着，绝对完美的不在场证明啊。”时，用非常非常不屑的语气，最后的死装时刻。
    【演出】说到作品名字的时候，将第十幅作品的板书卡条重重拍在白板上！拍完之后，提示玩家翻阅【我的谋杀作品】的第十幅作品。
- id: p7_12
  title: 第十幅作品·推理
  type: discuss
  minutes: 11
  dm_script: |
    第十幅作品《死者不会沉睡》
    11月2日，吉田和真的尸体一定在六角馆内，否则弹珠密室无法形成。
    11月3日，船舱储物间内只少了手臂的尸体不能是佐藤光一，否则中村健案无法完成。
    铃木美雪去年已经死亡，无法再像之前推理的那样自焚，山本阳介和中村健的尸体也已经被山口麻衣锁起来了。
    综上所述，船舱储物间内的尸体，只能是——吉田和真。
    船舱上的定时锁11月3日中午12点解锁，而从中午12点开始，长谷川悠人具备完美的不在场证明。
    12:00—13:00，山口麻衣可以为长谷川证明。
    13:00—地平线号起火，所有人可以为长谷川证明。
    Q：那么，长谷川如何将11月2日出现在六角馆内的吉田和真的尸体，在11月3日送进地平线号的船舱储物间内，并且给整艘船设置一个自动点火装置。
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】
    【来源】dm_script 是手册“第十幅作品谜面解析”原文（第155页）；“不在场证明”手册误作“不在场正面”，已改。
    【核心答案】长谷川把整艘地平线号“装进”了六角馆。11月3日凌晨，他让六角馆沉入海中、从水下环形滑轨转到正西侧船的正下方，再升起把船抬到屋顶，降下大厅让船藏进馆内；白天把装着船的六角馆伪装成六角屋，自己把自己“关”进去。12:00—12:40船舱解锁后，他在馆内亲手把吉田和真的尸体放进储物间并布置点火装置；之后与麻衣、众人会合，悄悄把六角馆降入海中，把船送回海面，静等起火。

    【谜面解析】
    - 11月2日吉田和真的尸体一定在六角馆内，否则弹珠密室无法形成。
    - 11月3日储物间里只少了一只手臂的尸体不能是佐藤光一，否则中村健案无法完成。铃木美雪去年已死，无法再像之前推理的那样自焚；山本阳介和中村健的尸体被山口麻衣锁着。所以只能是吉田和真。
    - 定时锁12:00才解锁，从12:00开始长谷川有完美不在场证明。

    【本案很难扶车，推理时长看玩家状态与想象力，请预留足够时间】

    【常见思路与封堵】玩家可能直接说“长谷川进的其实是六角馆，不是六角屋”。可以回答：可以进六角馆，但请记住，长谷川进哪个，山口麻衣就守哪个（众人一起押送他到大门口，亲眼看着他进去）。即使进的是六角馆：
    (1) 不能操控六角馆离开，因为麻衣就守在大门口，建筑直接滑走她一定会发现。建筑不能移动。
    (2) 中午12点，升降和旋转功能都不开启。
    (3) 如果凌晨升降功能开启时就把大厅降到了最底下（大厅天花板覆盖走廊地板），那么12点时六角馆几乎等价于六角屋，大厅上不来，进去就是一个大平层，无法离开。
    (4) 如果凌晨把大厅降到距离走廊地板40cm的位置，那么玄关门打不开了（玄关门朝走廊方向开，会被大厅天花板挡住），连大厅都进不去。
    (5) 如果12点时大厅在复原位置，那六角馆就是一个全封闭空间，唯一入口大门被山口麻衣看守，无法进出。
    (6) 千方百计爬出建筑，还得想办法回来；而且从这个高度跳海会死。
    以上6条足以封堵绝大部分猜想：即使12点进的是六角馆，此刻的六角馆（至少明面上）也等价于六角屋。
    另外，吉田和真的尸体不仅在船舱内，而且在储物间内：要打开船舱大门、进入船舱、再打开储物间大门把尸体送进去。这不是机关装置或高空抛物能做到的，只能亲手完成。

    【扶车方向】（按顺序逐条整合给玩家）
    1. 雾岛上有6条滑轨：4条垂直滑轨在岛屿东南西北4个面；2条环形滑轨，1条在岛面，1条在水下。
    2. 众人在雾岛正西侧停船下船，划了二十几米到达垂直楼梯——地平线号就停在雾岛西侧二十几米的海面上。
    3. 地平线号长32米，高8米。
    4. 六角大厅连带走廊是边长34米的正六边形，对边距离约59米，对角线68米（不需要玩家计算，一眼就能看出尺寸足够）；六角馆大门口的露天平台长8米。
    5. 12:00—12:40长谷川一定无法离开建筑。
    6. 吉田和真的尸体一定需要长谷川亲手放进船舱储物间。
    →“如果人出不去，尸体也出不去，那能不能让船‘进来’？”

    【完整手法】
    1. 11月3日凌晨02:00之前（升降功能开启时段），长谷川把整座六角馆移到岛屿北侧，通过北侧垂直滑轨沉入海中，再通过海下环形滑轨转到正西侧——此刻地平线号就在六角馆正上方的海面上。
    2. 通过正西侧垂直滑轨缓慢上升六角馆，把整艘地平线号抬起来，船停在六角馆屋顶。馆内（或山田莉子房间内）的水会从走廊地板上的孔洞排出（山田莉子房间不关门；即使她的房间进水也不重要，11月3日除了长谷川没人进过六角馆）。
    3. 把六角大厅降到底，地平线号就“进入”了六角馆。一定要把船藏进馆里，不能顶在头上，否则众人去的路上会看到建筑上有一艘船。11月的南半球是夏天，墙壁外的水渍很快就干了。
    4. 把六角馆连带地平线号升到岛屿顶部，再转到北侧藏起来。
    5. 早上09:00众人一起去四角屋推理，都怀疑长谷川，他顺势提出把自己关起来证明清白。实际上他已把四角屋旋转了180度，并把六角馆转到了岛屿正西侧。众人跟着他来到岛屿西侧，以为是六角屋，其实是六角馆。
    6. 长谷川走进六角馆，山口麻衣本想跟进去，被他拦住：“如果我是凶手，你就危险了。”他独自进入并锁门。麻衣守在大门口，众人回四角屋继续推理。此刻，长谷川、吉田和真的尸体、地平线号都在六角馆内。
    7. 12:00—12:40船舱已解锁，长谷川有足够时间在船舱内布置一切，包括设置点火装置。
    8. 12:40出门，与山口麻衣一起去四角屋，和众人待在一起制造不在场证明；期间悄悄把六角馆降入海中，把地平线号送回海面。
    9. 静等点火装置触发，众人发现现场时一切早已布置完成。

    【数据验证】（防杠用，玩家无需推理数据）
    (1) 船的位置能被六角馆顶起来：船停在岛屿正西侧二十多米（取中值25米演示，20—30米都满足）；露天平台8米 + 梯形房间斜边5米 = 13米，船几乎就在六角馆正中央，前后都有足够的容错距离。
    (2) 船小于六角大厅天花板：对边距离约59米，以六角馆中心画一个直径59米的圆，船长32米视为直径32米的小圆；59-32=27米，27/2=13.5米，小圆前后左右还有13.5米容错，船偏离一些中心也放得进去。
    (3) 六角大厅高10米，船高8米，船藏进大厅后外界看不到。

    【玩家答疑】
    Q1：船能一直漂在岛屿正西侧不动吗？A：可以。调查档案写过：“其在停泊后可以通过推进系统及传感器自动调整推力，从而抵消风浪的影响，保持位置固定。”即使有一点点偏移，以六角馆的尺寸也足够装下地平线号。
    Q2：铃木美雪不是吉田和真，那她的尸体是怎么带来的？佐藤光一呢？A：长谷川去年就把铃木美雪的尸体放在现存的这座六角馆内了，不需要带来。11月3日12:00—12:40，他可以直接在馆内取到经过防腐处理的铃木美雪的尸体。至于佐藤光一，把他的尸体从船上取出，放进六角馆的房间内即可。
- id: p7_13
  title: 第十幅作品·答案揭晓
  type: narration
  minutes: 3
  dm_script: |
    1.整合所需信息
    （1）雾岛上有6条滑轨，其中4条垂直滑轨位于岛屿东南西北4个面，2条环形滑轨，1条位于岛面，1条位于水下。
    （2）众人在雾岛正西侧停船下船，然后划了二十几米的距离到达垂直楼梯，也就是说地平线号停在雾岛西侧二十几米的海面上。
    （3）地平线号的尺寸是长32米，高8米。
    （4）六角大厅连带走廊是一个边长为34米的正六边形，对边之间的距离约等于59米，对角线长度为68米。六角馆大门口的露天平台长8米。
    （5）12:00——12:40，长谷川一定无法离开建筑。
    （6）吉田和真的尸体，一定需要长谷川亲手放进船舱储物间。
    2.破解手法
    有了上述信息后，谜底也就呼之欲出了。
    长谷川在11月3日凌晨02:00之前，将整座六角馆移动至岛屿北侧，通过北侧垂直滑轨沉入海中，然后将六角馆通过海下的环形滑轨转至正西侧，此刻，地平线号就在六角馆正上方的海面上！
    通过正西侧垂直滑轨缓慢上升六角馆，如此一来，六角馆就会将整艘地平线号抬起来，地平线号就停留在六角馆屋顶。
    此刻六角馆内或者山田莉子房间内的水都会从走廊地板上的孔洞排出（山田莉子房间不关门，并且即使她的房间进水了也不重要，11月3日除了长谷川没人进过六角馆）。
    随后将六角大厅下降到底，地平线号就“进入了”六角馆中。一定要把船藏进馆中，不能顶在头上，否则众人去的路上会发现建筑上有一艘船。
    11月的南半球是夏天，墙壁外的水渍会很快干掉。
    然后将六角馆连带着地平线号上升至岛屿顶部，再转到北侧藏起来。
    第二天早上09:00，众人一起前往四角屋推理，然后都怀疑长谷川是凶手，长谷川顺势提出将自己关起来，以此证明自己的清白，但实际上他此时已经将四角屋旋转了180度，并且将六角馆转至了岛屿正西侧。
    众人就一路跟随着他来到岛屿西侧，但众人以为来的是六角屋，实际是六角馆。
    然后长谷川就走进了六角馆，山口麻衣本想进去，被长谷川阻拦了，说了一句“如果我是凶手你就危险了”，然后就独自进入六角馆然后将门锁了起来。
    山口麻衣守在大门口，众人则回到四角屋继续推理。
    此刻，长谷川人在六角馆内，吉田和真的尸体在六角馆内，地平线号也在六角馆内！
    12:00——12:40这40分钟内，船舱已经解锁，长谷川有足够的时间在船舱内布置一切，包括设置点火装置。
    随后他12:40出门，与山口麻衣一起来到四角屋，与众人待在一起制造不在场证明，在这期间悄悄将六角馆下降到海中，将地平线号重新送回海面。
    然后就静等点火装置触发，众人发现现场，一切早已经布置完成了。
  dm_notes: |
    【来源】本段是手册“第十幅作品复盘”中“1.整合所需信息”“2.破解手法”的原文（手册第157—158页），手册没有为这里写长谷川的口述台词。已去掉只给主持人看的话（第（4）条后面的括注“这一项不需要玩家计算，其实就是一眼看得出来尺寸足够”）；前面“手法破解”里给主持人的说明（很难扶车、6条封堵、尸体必须亲手送进储物间）放在上一阶段 dm_notes；“3.数据验证（防杠用，玩家无需推理数据）”只在玩家质疑尺寸时用，见上一阶段 dm_notes 的【数据验证】。
    【原文漏字】手册“与众待在一起”，已补为“与众人待在一起”。
    【模型演示】可用小馆模型 + 凳子架演示：六角馆北侧沉海→水下环形滑轨转到西侧→升起抬船→大厅降到底藏船→升到岛顶转到北侧；11月3日早上转到西侧伪装成六角屋。
    【数据验证图】手册第159页俯视图：六角馆（各房间标着人名）对角线68米；六角馆靠岛一侧到“岛屿西侧”13米（露天平台8米+梯形房间斜边5米）；六角馆中心（船所在位置）到岛屿西侧25米。
    玩家若追问铃木美雪、佐藤光一的尸体去向，见上一阶段“玩家答疑Q2”。
    至此，所有谋杀作品鉴赏完毕。
