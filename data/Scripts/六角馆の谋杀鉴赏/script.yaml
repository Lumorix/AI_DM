- id: p1_05
  title: DL-4炸弹失窃·案件发布
  type: narration
  minutes: 4
  dm_script: |
    那么，第一起案件：DL-4炸弹失窃事件。
    现在给各位分发【DL-4炸弹失窃事件】案件册，请大家仔细通读。
  dm_notes: |
    【BGM】切换BGM：《kimidoll》。
    【物料】分发【DL-4炸弹失窃事件】（6册），提醒玩家通读。
    【板书】玩家阅读过程中，主持人在白板上画出“零号实验室”（主楼，圆形建筑，中央为可旋转的旋转区，外圈为6段走廊/房间）的简易版地图，方便后续用磁吸贴进行动线的演示复盘。
    案件册中写有谜面梳理，如若玩家不清晰，主持人可在下一阶段再梳理一下。
- id: p1_06
  title: DL-4炸弹失窃·推理
  type: discuss
  minutes: 11
  dm_script: |
    当天仅有清洁工一人进出过实验室主楼，因此凶手一定是他。
    清洁工12:20到达，13:20离开且身上没有携带炸弹，之后再没有回来过，那么他是如何在这一个小时内打开上锁的仓库，并且把炸弹偷走的呢？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】

    【标准答案（核心逻辑链）】
    - 旋转区顺时针每按一次转1/6，位置顺序（由复盘推得）：大厅 → 会议室 → 无菌室 → 1号仓库 → 2号仓库 → 展览室 → 大厅（从大厅按2次到无菌室，按5次到展览室）。
    - 12:20 清洁工到达、更衣后进入旋转门，旋转一次到会议室走廊；再站在走廊按一次按钮让旋转区空转（制造“在大厅连按两次=去了无菌室”的假象）；从会议室窗户翻出等待。
    - 桐生凉平午休时，清洁工进入大厅更衣室拿到仓库备用钥匙，从会议室窗户回到旋转区等待。
    - 13:00 凉平开始检查，借凉平按下的按钮，清洁工被送到无菌室，假装打扫，让凉平目击后离开。
    - 凉平检查1号仓库时，清洁工到无菌室外的旋转区等待；凉平再次按下按钮时，清洁工顺势到达1号仓库，用备用钥匙开门（开门需3分钟）盗走炸弹，此时凉平已回到大厅。
    - 13:20 清洁工把炸弹放在1号仓库前的旋转区，按一次按钮（炸弹到2号仓库位）；自己走进新转到1号仓库前的旋转区，连按三次（炸弹到会议室位，自己回到大厅）。
    - 清洁工在更衣室换衣服顺便还钥匙，空手离开主楼（监控拍到身上没有炸弹），再从会议室窗户进入拿到炸弹离开。必须在14:00前完成（14:00后整个厂区无人进出）。

    【可向玩家直接澄清的建筑规则（零号实验室-主楼建筑说明）】
    1. 旋转区仅能顺时针旋转（文本中提及了只有一个旋转按钮，且想去展览室得按5次按钮，因此只能顺时针旋转），且在旋转区不同区域的人无法互相看见。
    2. 站在旋转区内，旋转的过程中无法“下车”。
    3. 监控只能覆盖大厅前面那1/6走廊区域，其余走廊无法覆盖。
    4. 关于存放【DL-4炸弹卫星遥控器】的储物室：整个零号实验室是一片大厂区，其中有很多建筑，这栋圆形建筑是厂区里的主楼，而储物室不在主楼内。

    【扶车方向（手册原有扶车问题，按顺序提出）】
    - 扶车Q1：清洁工在大厅旋转区连续按下两次旋转按钮，一定去到无菌室吗？——解读：不一定，旋转区与走廊之间并无墙壁阻隔，人可以站在走廊，按下旋转按钮，让旋转区空转。
    - 扶车Q2：清洁工在主楼内的移动方式有什么？——解读：除了自己按旋转按钮以外，还可以借助凉平按下按钮时移动。
    - （根据复盘推导的进一步提示，仍卡住时再用）人不在旋转区里时，旋转区也能“运东西”——炸弹本身可以被放在旋转区里转走；会议室有窗户可以进出，而监控只拍大厅前的走廊。

    【玩家答疑（规则类，可直接回答）】
    - Q：清洁工能否借助凉平15:00检查时按下旋转按钮再把炸弹带走？
      A：不能，案件册中“监控”那一栏提到过，14:00无人再进出实验室，注意这里说的是整个实验室，也就是整个厂区。不只是放置炸弹的主楼，也就是14:00前清洁工必须离开且不能再进来。
    - Q：清洁工要偷【DL-4卫星遥控器】吗？
      A：目前我们无法得知他是否会偷遥控器，所以只需解决炸弹问题即可。
- id: p1_07
  title: DL-4炸弹失窃·答案揭晓
  type: narration
  minutes: 3
  dm_script: |
    下面复盘清洁工的行动。
    清洁工12:20来到实验室，更衣后进入旋转门，旋转一次后走出旋转区，来到会议室走廊，按下旋转按钮，让旋转区空转一次，然后从会议室窗户翻出等待，等桐生凉平午休后，进入大厅更衣室拿到仓库备用钥匙，然后从会议室窗户回到旋转区，在此等待。
    凉平13:00开始检查时，借助凉平按下的旋转按钮，清洁工被送到了无菌室，然后假装打扫，等待凉平来目击并离开。
    当凉平在检查1号仓库的时候，清洁工来到无菌室外的旋转区等待，等凉平再次按下按钮的时候，清洁工顺势来到1号仓库，然后开门盗窃炸弹，因为开1号仓库的门需要3分钟，当拿到炸弹时，凉平已经回到大厅了。
    13:20清洁工将炸弹放在1号仓库前的旋转区，按下旋转按钮，炸弹来到2号仓库旋转区，然后清洁工本人走进1号仓库旋转区，连续三次按下按钮，炸弹来到会议室旋转区，清洁工回到大厅，然后去更衣室换衣服顺便还钥匙，然后离开实验室，从会议室窗户进入拿到炸弹并离开。
  dm_notes: |
    【演示】在白板“零号实验室”简图上用磁吸贴（清洁工、凉平、炸弹）逐步演示动线：
    1. 清洁工 大厅→（按1次）会议室走廊，站在走廊再按1次空转 → 翻窗出去；
    2. 午休时取备用钥匙，翻窗回到会议室前旋转区；
    3. 凉平按钮 → 清洁工到无菌室，被凉平目击；
    4. 凉平再按 → 清洁工到1号仓库，开门3分钟取炸弹；
    5. 炸弹放旋转区按1次→2号仓库位；清洁工进1号仓库前旋转区连按3次→炸弹到会议室位、清洁工回大厅；
    6. 更衣还钥匙→空手离开（13:20）→从会议室窗户取炸弹离开（14:00前）。
    强调两个关键：①站在走廊按按钮可让旋转区空转（伪造“连按两次去无菌室”）；②可借凉平按按钮移动、可用旋转区运送炸弹。
- id: p1_08
  title: 漂浮岛坐标泄漏·案件发布
  type: narration
  minutes: 4
  dm_script: |
    各位不愧是名镇日本的侦探，仅仅用了xx分钟就识破了清洁工的诡计，但还请不要高兴得太早。在去年炸弹失窃的同一天，松岛集团还发生了另一件轰动一时的大事，这便是我们要解决的第二起案件：漂浮岛坐标泄漏事件。
    现在给各位分发【漂浮岛坐标泄漏事件】案件册，请大家仔细通读。
  dm_notes: |
    主持人扮演山口麻衣进行衔接。台词中的“xx分钟”替换为玩家破解第一案的实际用时。
    “名镇日本”为手册原文（疑为“名震日本”的笔误，读音相同）。
    【物料】分发【漂浮岛坐标泄漏事件】（6册），提醒玩家通读。
    【板书】玩家阅读过程中，主持人在白板上画出“松岛超级工厂”简易版地图（西区电梯1-17楼、东区电梯8-17楼、东区10楼办公室、楼梯），方便后续用磁吸贴进行动线的演示复盘。
    【BGM】手册未写切换，沿用《kimidoll》。
    案件册中写有谜面梳理，如若玩家不清晰，主持人可在下一阶段再梳理一下。
- id: p1_09
  title: 漂浮岛坐标泄漏·推理
  type: discuss
  minutes: 11
  dm_script: |
    因为每一位学生都自由活动过，因此无法确认是谁偷看的坐标。
    但是每一位学生自由活动的时间都不超过4分钟，所以需要解决的就是：学生的出发点是工厂1楼，如何在4分钟内去往东区10楼办公室偷看坐标，并且再次回到1楼（除了电梯与爬楼时间，其余时间均忽略不计）。
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】

    【可向玩家直接澄清的电梯规则（松岛超级工厂-电梯说明）】
    1. 西区电梯1-17楼均可通行，如若电梯停止且20秒内无人操作，那么电梯会自动回到1楼基站（此过程也遵循每层楼10秒）。
    2. 东区电梯8-17楼通行，停止且20秒无人操作，自动回到17楼基站。
    3. 两部电梯均遵守一个原则：自动回基站过程中，若在电梯还未到达的楼层按下电梯按钮，则电梯会在该楼层停靠；若电梯已经经过，则会先回到基站后再返回。（当日无需考虑除学生以外的人使用电梯）
       举例：西侧电梯从10楼自动返回1楼基站的过程中，此刻电梯已经到达7楼，人在5楼按下电梯按钮，电梯会在5层停靠；但若在8层按下，则电梯会先回到1楼再返回8楼。

    【标准答案】
    正常全程坐电梯：乘西电1→8楼70秒 + 等东电到8楼90秒（东电此时一定在17楼基站）+ 乘东电8→10楼20秒 + 乘东电10→8楼20秒 + 等西电到8楼70秒（西电已回1楼基站）+ 乘西电8→1楼70秒 = 340秒，超过4分钟，一定不够。
    真正路线（共240秒=4分钟）：
    第一步：乘西侧电梯到8楼（70秒），出电梯前按下西侧电梯的12层按钮。西电自行去12楼（40秒），停20秒后自动朝1楼基站走，再次到达8楼共需40+20+40=100秒。
    第二步：在8楼按东侧电梯按钮呼叫（17楼的东电开始往8楼走），但不等电梯，直接爬楼梯去10楼，到达10楼并看完坐标共60秒，此时东电已到11楼。
    第三步：在东侧10楼按电梯按钮，10秒后东电到达。
    第四步：乘东侧电梯到8楼（20秒）。
    第五步：按西侧电梯按钮，10秒后西电到达（正是从12楼返回途中经过8楼）。
    第六步：乘西侧电梯到1楼（70秒）。
    合计：70+60+10+20+10+70=240秒。
    注：本案只需证明手法可行，手册未指认具体是哪位学生。

    【扶车方向（手册未列扶车问题，以下按复盘推导，逐步给出）】
    1. 先让玩家按正常路线算一遍时间（340秒），确认浪费在哪里——两段“等电梯”时间（90秒+70秒）。
    2. 能不能让电梯在你需要的时候“刚好”回到8楼？——出西电梯前可以先按别的楼层。
    3. 呼叫东侧电梯后，一定要站在原地等吗？——8楼到10楼可以爬楼梯。
    4. 提醒规则3：电梯在回基站途中，在它还没经过的楼层按按钮就会停靠。

    【玩家答疑（规则类，可直接回答）】
    - Q：学生只能在参观的10分钟内偷看吗？能否去而复返？能否合谋？
      A：不能，毕竟是松岛超级工厂，进出是要登记的，不可能随便进出，并且都是上一个学生走了下一个才来。
    - Q：参观具体流程是什么？
      A：高木凛在东区10楼办公室等学生到达，然后直接带其去到1楼，到达后学生可以自由活动（可以去偷看坐标了），参观完后学生离开，高木凛回办公室，下一位学生到达办公室，继续带去1楼参观，如此循环。
    - Q：凶手需要频繁使用电梯，不会被其他人员干扰吗？
      A：案件中提到过，超级工厂的所有工作人员当天都在参与一项重要实验，期间不会有人在楼内行动，所以无需考虑被干扰的情况。
- id: p1_10
  title: 漂浮岛坐标泄漏·答案揭晓
  type: narration
  minutes: 3
  dm_script: |
    下面复盘坐标泄漏事件。
    先按照正常全程坐电梯的路线计算一次时间：
    乘西电1至8楼70秒；等东电到达8楼90秒；乘东电8至10楼20秒；乘东电10至8楼20秒；等西电到达8楼70秒；乘西电8至1楼70秒；合计340秒。
    上述时间中，因为学生的出发点是1楼，此刻东侧电梯一定已经回到了17楼基站，所以有90秒的等东侧电梯时间；
    同理，当等到东侧电梯并上楼查看坐标后，西侧电梯也已经回到了1楼基站，所以依然需要70秒的等待时间。
    综上，正常路径时间一定不够。
    凶手的真正行动复盘：
    第一步：乘坐西侧电梯到达8楼，并在出电梯前按下西侧电梯的12层按钮。西侧电梯此时会自己去往12楼（40秒），并在12楼停留20秒后自动朝1楼基站走，当电梯再次到达8楼需要花费40+20+40=100秒。
    第二步：在8楼东侧电梯外按下按钮呼叫电梯，此时17楼的东侧电梯会往8楼走，但凶手此刻直接爬楼梯去往10楼，到达10楼看完坐标花费60秒，此时东侧电梯已经到达11楼。
    第三步：在东侧十楼按下电梯按钮呼叫电梯，10秒后电梯就会到达。
    第四步：乘坐东侧电梯到达8楼。
    第五步：按下西侧按钮呼叫电梯，10秒后电梯就会到达。
    第六步：乘坐西侧电梯到达1楼。
    第一步70秒；第二步60秒；第三步10秒；第四步20秒；第五步10秒；第六步70秒；合计240秒。
  dm_notes: |
    【演示/板书】在白板“松岛超级工厂”简图上用磁吸贴（学生、西电、东电）逐步演示，并把两张时间表写在白板上：
    - 正常路线：70s / 90s / 20s / 20s / 70s / 70s，合计340s（不够）。
    - 真正路线：70s / 60s / 10s / 20s / 10s / 70s，合计240s。
    注：两张时间表已对照手册第17页原件核对，各格数字与上面一致（原件单位混用“s”和“秒”，dm_script里统一念作“秒”）。
    关键点：①出西电梯前按12楼，让西电“绕一圈”恰好在100秒后回到8楼；②呼叫东电后不等，爬楼梯去10楼，东电在途中被10楼的按钮截停。
- id: p1_11
  title: 转场·登船
  type: narration
  minutes: 1
  dm_script: |
    恭喜各位侦探完成了这初步考验！
    时候也不早了，我们也该出发前往举办推理大会的岛屿了！
    请各位侦探跟随我登船吧。
  dm_notes: 主持人扮演山口麻衣进行衔接。剧本第一部分（开场+破冰案）结束，接下来进入第二部分“六角馆案件第一重推理”（人物剧本第二幕）。
- id: p2_01
  title: 人物剧本·第二幕
  type: narration
  minutes: 6
  dm_script: |
    各位侦探，请翻开手中的人物剧本，阅读【第二幕】。
    本幕阅读完后无需分享，读完请示意我。
  dm_notes: |
    【BGM】切换为：cheburashka
    【流程】提示玩家阅读人物剧本第二幕（实体纸质剧本）。读完后无需分享，直接进入下一阶段，由山口麻衣（主持人）衔接。
    【本轮人物剧本「信息点」整合&解读】（仅供AI/主持人参考，不要主动向玩家透露这些信息点的用途）
    1. 所有人物剧本均写有：「每个船舱的大小和硬件设施都是一样的」「门上固定着一个和门一样大小的全身镜」；另有「新井直人剧本中在佐藤光一死后，直到下船的那一部分」。
       → 这三条信息将在后续【第八幅谋杀作品】中用到（手册原文写作“第八部谋杀作品”）。
    2. 「众人下船后，山口麻衣给船舱上了一把在11月3日中午12点才会解锁的定时锁」
       → 这是一条极其重要的限制信息，后续多个谜面都会用到。
    3. 「众人在岛屿正西侧停船，划了二十几米的皮筏艇来到岛屿边沿」
       → 表明船的位置及船与岛屿的距离，将在【第十幅谋杀作品】中用到。
    4. 「一把泛着金属光芒的垂直扶梯就贴在岛屿侧面」
       → 这把金属垂直扶梯，破解【第三幅谋杀作品】后即可知晓：它实际上就是岛屿上的垂直滑轨。
    5. 「11点至12点船只会经过镜湖半岛海域」「山口麻衣将众人的衣服陆续放进了走廊尽头的立柜中」「明智邦彦穿着山本阳介的外套摆pose」
       → 上述信息将在最终【收束】中用到。
- id: p2_02
  title: 推理大会开幕
  type: narration
  minutes: 1
  dm_script: |
    好的各位，我们的推理大会就正式开始了！
    而所要推理的内容，正是去年发生的——六角馆无人生还事件！
    因此，在推理之前各位需要先了解这座名为六角馆的建筑到底是什么样的。
  dm_notes: 主持人以山口麻衣（推理大会组织者）的身份进行衔接。第二幕阅读完后无需分享，直接说这段话，然后进入《六角馆线索册》环节。
- id: p2_03
  title: 六角馆线索册
  type: narration
  minutes: 9
  dm_script: |
    现在为各位分发《六角馆线索册》，请各位侦探仔细通读。
    关于六角馆建筑本身有任何疑问，都可以随时向我提问。
  dm_notes: |
    【BGM】切换为：土門刑事は見逃さない
    【物料】分发《六角馆线索册》（每人1册），提醒玩家通读。
    【板书】主持人将「六角馆磁吸贴」贴在白板A左上角，方便后续推理及复盘。
    白板A·阶段板书参考（手册第20页图）：左上角写标题「一年前·六角馆」，下面贴六角馆磁吸贴。磁吸贴上已印好各房间名称——上边：宫本诚、坂田仓介、小林纪子；右上边：山田莉子、管家、女佣；右下边：餐厅、加藤健一、玄关；下边：仓库；左下边：渡边翔太、清水伊织、池田孝太；左上边：空房间、铃木美雪、卫生间。中间为六角大厅，大厅门III在左上、IV在右上、I在左下、II在右下。
    【模型·第一阶段：大馆「旋转功能」演示】
    - 本部分（六角馆案件第一重推理）只使用「大馆」模型，放在圆形凳子架上展示。模型需开场前按【六角馆模型安装指南】组装好。
    - 此阶段一定要把大馆上两个插销（手册图中红圈处）插上，避免大厅自己落下——升降功能是第三部分才揭晓的后置线索，此时绝不能让玩家看到或知道大厅能升降。
    - 用模型给玩家展示建筑内部构造：六角大厅、环形走廊、四周6个梯形房间、大厅门（1、2号为下翻门，3、4号为普通大厅门）等；玩家拿到【旋转】大卡后，再演示大厅的旋转。
    - 模型不是按线索中的等比例制作，所有数据以线索册为准。
    - 两个「小馆」模型属于第六部分（双馆）的重大剧透，现在不要拿出来。
    【关于六角馆的常见问题答疑】（玩家问到时可直接回答）
    Q1：1、2号下翻门是什么门？能打开吗？有什么用？
    A：类似于古代那种放倒式的城墙门——城墙前有护城河，将城门放倒搭成一座桥就可以过去了。（主持人可用一本书立在桌上代表下翻门，然后将书放倒在桌面上，以此演示门的开合方式。）
    因为门的高度是9.5米，走廊宽度只有4.3米，所以下翻门是放不下来的，会靠在对面的房间墙壁上，开合角度很小，人无法通过；整场游戏中也不存在有人需要从这个狭小角度通过的情况。
    看上去是很违和的设计，至于这两扇门的用途，或许之后就知晓了。（不要透露用途）
    Q2：外开门和内开门如何界定？
    A：一切朝走廊开的门都是外开门，朝房间内部开的门则为内开门。
    Q3：同一条边上的房间由透明玻璃隔离，岂不是可以互相看到？
    A：每个房间里都有窗帘，卫生间也有；如果都没拉窗帘，可以看到。
    【注意】此处仅解答建筑的基本问题即可。对于较为特殊、极端、奇葩的问题，主持人也可直接告知：今天的游戏中不会存在此种情况。
    玩家对建筑本身没有疑问后，进入下一阶段发放【旋转】大卡。
- id: p2_04
  title: 旋转功能大卡
  type: narration
  minutes: 4
  dm_script: |
    看来各位对建筑本身已经没有疑问了。
    接下来为各位发放【旋转】大卡，请各位侦探通读，关于旋转功能有任何疑问都可以向我提问。
  dm_notes: |
    【物料】发放【旋转】大卡（01号卡），提醒玩家通读。
    【模型演示】用大馆模型（插销保持插上）演示六角大厅的旋转：大厅整体相对走廊和外圈房间转动，转动后从同一扇大厅门出来，面对的房间就变了。白板上的六角大厅磁吸贴也可以旋转演示。不要演示/提及升降。
    【关于旋转的常见问题答疑】（玩家问到时可直接回答）
    Q1：大厅旋转的时候，大厅天花板不会和房间天花板卡住吗？
    A：不会，大厅天花板的高度高于房间天花板。「大厅的天花板下边沿」与「房间天花板上边沿」齐平，因此旋转的时候刚好错开，所以不会卡住。
    Q2：大厅旋转的时候，大厅地板不会和走廊/建筑地板卡住吗？
    A：不会。线索提到，在建筑5cm的地板基础上，大厅还有一层自己的地板（厚度忽略不计），这层大厅地板就覆盖在建筑本身的地板上。旋转时，仅仅是大厅自己的地板（高于建筑地板）在旋转，因此不会卡住。
    Q3：旋转时如果大厅的门或者房间的门开着怎么办？
    A：门开着不影响大厅的旋转，只是有可能会产生一些碰撞；已知DL-3合金非常坚固，因此碰撞一下也没事。当然，如果有人想要旋转大厅，也不会故意把门开着去撞，都会关上门的。整场游戏中也不存在利用“碰撞的几何原理”去做任何事情。
    Q4：旋转时会被发现吗？在哪里能发现？
    A：人在大厅内，且大厅关着门，如果旋转速度较慢，大厅内的人察觉不到，因为没有参照物（例如地球每时每刻都在自转，但人感觉不到）。
    但如果人在走廊，此时大厅旋转了，就一定会发现，因为有参照物（不管旋转得多慢，只要在转，就一定会发现，可以告知玩家当成小设定来理解）。
    同理，如果人在房间内开着门、看着走廊，等价于人在走廊，也会发现旋转。
    需要注意的是：能发现的是旋转的“过程”而非“结果”。例如此时大厅已经旋转了180度并保持静止，一个人来到走廊，不一定能发现大厅曾经旋转过。（当然，如果此时是凌晨1-4点，大厅门上的罗马数字灯亮着，那就一定能发现。）
- id: p2_05
  title: 日记与档案册说明
  type: narration
  minutes: 2
  dm_script: |
    去年案件发生后，警方进入了六角馆调查，在里边发现了6本当事人所写下的日记，以及一本记录了案件经过的【档案册】。
    为了更符合推理大会的游戏流程，主办人对日记和档案册进行了一定的艺术加工，不过请各位放心，其中所记录的事件一定是真实发生的。
    另外，既然是推理大会，必然有着游戏的规则，有几点注意事项需要告知各位侦探，以便后续诸位做出合理的推断：
    1. 案件的凶手一定在这6名日记的主人中，无需考虑其余NPC。
    2. 凶手可以在行凶当天的日记中撒谎，而其余所有人的日记或口供均为主观真实的。并且除凶手外，其余人不会去无端操控建筑。
    3. 推理过程无需考虑动机，且六角馆事件已经发生，无需考虑当事人做出与事实不符的其他行为会有何影响。各位需要做的，是破解凶手诡计并锁定凶手。
    4. 最后，警方进入六角馆调查后发现，馆内被安置了很多个针孔摄像头，也就是说，可以默认凶手具有馆内的天眼视角，知道所有人的一举一动。
  dm_notes: |
    【非常重要】主持人拿出《六角馆档案册》和6本《日记》进行材料说明。以上内容非常重要，一定要每一点都介绍清楚！（后续玩家纠结时可随时重申这4条规则）
    【物料】
    - 分发6本《日记》（小林纪子、坂田仓介、池田孝太、清水伊织、宫本诚、铃木美雪各1本），与玩家角色无对应关系，随机分配即可。
    - 分发《六角馆档案册》。
- id: p2_06
  title: 第一重第一案·案件发布
  type: narration
  minutes: 9
  dm_script: |
    请各位阅读《日记》第一天，也就是9月1日的内容；同时阅读《档案册》第一案——山田莉子案。
    ……
    日记中存在部分的私人视角，所以需要各位分享一下。
    仅分享下划线部分的内容就可以。
  dm_notes: |
    【流程】第一句（请阅读……）是衔接提示语；玩家阅读完后，再说后两句（手册原话），引导玩家分享日记中下划线部分的内容。注意！一定要让玩家只分享下划线部分！
    【板书】分享过程中，主持人在白板A上补充分享出来的信息（后续所有名字可用名牌贴上去）。白板A·阶段板书参考：
