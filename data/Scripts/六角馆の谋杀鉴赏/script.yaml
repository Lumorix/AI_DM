- id: p4_12
  title: 山本阳介案·推理
  type: discuss
  minutes: 9
  dm_script: 本案问题：因为山本阳介住的12号房是内开门，如果凶手要从房间里出来，至少需要将门朝内打开至够一个人通过的缝隙，然后出来再关门，可如果这样的话，房间里的弹珠就不会大部分都贴着门边了，凶手是如何做到的？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】

    ■ 标准答案
    手法：合理利用漂浮岛的设定使房间倾斜。漂浮岛是"躺倒"在海面上的圆柱体，所谓开启动力装置后"朝航行方向轻微偏移"，其实是原地滚动。凶手（必然是漂浮岛的租客，能开启动力装置）半夜让岛屿朝正北方轻微滚动一两度，12号房房门朝正北，弹珠就自己滚到门边，之后再复位，弹珠也不会离开门边。
    凶手：山本阳介死于凌晨，所有人都没有不在场证明，死亡时间很宽泛，弹珠密室本身也不具备锁凶条件——本案凶手无需锁定（板书画问号）。

    ■ 推理引导流程（扶车）
    1. 突破口：房门没有任何缝隙，门一关上就与外界绝对隔绝，房间内也没有能提供动力的设施，只能从整个房间、建筑或岛屿上突破；六角屋没有任何机关，无法提供"动力"；只剩下岛屿本身——漂浮岛。
       玩家没有头绪时提醒：别忘了我们此刻所在的岛屿有什么特点。
    2. 玩家提及漂浮岛后，让玩家回顾【漂浮岛坐标泄露事件】中漂浮岛的设定，以下三条至关重要：
       (1) 漂浮岛整体呈标准的圆柱体。
       (2) 漂浮岛大部分在水下，仅有小部分在水上，且无法上浮或下沉，其水上和水下体积比例永远保持不变。
       (3) 漂浮岛航行功能已关闭（无法位移），即使开启动力装置，也仅会朝航行方向轻微偏移。
    3. 玩家很快会得出直觉解答"整座岛屿偏移了，导致房间倾斜，弹珠滚落到门边"。
       此时主持人在白板上画一个简易的立着的圆柱体和海面（西侧是楼梯，中间是四角屋与木屋，最东侧是六角屋），解释：岛屿是标准圆柱体且仅小部分在水面之上，倾斜时水上体积会减小、水下体积会增大，违反设定，因此无法这样倾斜。
       演示：画一条水面线，用白板笔或瓶子之类的圆柱体，捏住中轴，小部分在水面上、大部分在水面下，顺时针旋转——转一点点肉眼看不出，但比例其实在变；转多一些就能直观看出来。
       再解释：只有水面高度与岛屿中轴在同一高度时，倾斜才不改变比例（水上水下永远1:1）。海平面在中轴之上，所以立着的岛屿无法倾斜，也就不会带动建筑倾斜。
    4. 引导开脑洞的话术：
       "我们已知只有漂浮岛本身存在动力装置，只有岛屿带动建筑发生倾斜，弹珠密室才能成立，可是因为其设定的原因，漂浮岛又不能倾斜！那我们不妨来回顾一下，漂浮岛的设定中虽然明确表述了漂浮岛呈标准的圆柱体。但是！并没有提及漂浮岛到底是以什么角度在海中航行的吧？那么，漂浮岛到底如何呈现在海中，才能既保证岛屿本身可以轻微偏移，又能带动建筑发生倾斜？"
       → 玩家基本都能反应过来：漂浮岛是躺倒在海面上的。主持人擦掉之前的图，重新画一个躺倒的圆柱体，同样用白板笔演示：躺倒的圆柱体所谓"轻微偏移"就是原地滚动，不论怎么滚动体积比例都不变；滚动的同时岛面上的建筑就会倾斜。
    5. 再问方向："各位，别忘了我们的最终目的是要破解弹珠密室！如果漂浮岛是躺倒在海面上的圆柱体，那么它朝什么方向滚动，才能够形成弹珠密室呢？"
       → 需要玩家理解建筑的方位朝向：众人从正西侧上岛，朝东直走到四角屋，再朝东直走到六角屋，通过六角屋门口的悬空露天平台抵达大门——露天平台是东西朝向的。观察调查档案第二案中的六角屋平面图（可旋转着看），12号房的房门朝正北方。
       → 整座岛屿只要朝正北方轻微滚动一点点（1度、2度的样子），房门后的弹珠就会自己滚到门边。

    ■ 第二种解答（原地自转）——只有玩家自己提出时才承认
    玩家可能把设定理解为：漂浮岛立在海中，"轻微偏移"不是倾斜而是原地旋转，离心力让弹珠滚到门边。
    - 若玩家提出：不否定，肯定他的想法，此时本案就有两种解答。参考话术："没错！如果漂浮岛不倾斜，而是原地旋转的话，那么因为离心力的作用，弹珠就有可能滚落到门边，从而形成弹珠密室！当然，我们也不妨设想一下，漂浮岛的设定中确实提到它是呈标准的圆柱体。但是！并没有提及漂浮岛到底是以什么角度在海中航行的吧？那么，漂浮岛如何呈现在海中，同样能既保证岛屿本身可以轻微偏移，又能带动建筑发生倾斜呢？"然后衔接上面第4步之后的流程。
    - 若玩家没有提出：主持人一定不要说这一解答，直接引导得出"躺倒的圆柱体"即可。本案核心是让玩家推理出"躺倒圆柱体"。

    ■ 玩家答疑
    Q1：若漂浮岛是躺倒的圆柱体，岛面就是倾斜的，为何众人感觉不出来？
      A：漂浮岛非常巨大，岛面倾斜角度其实很小。并且能开启动力装置的凶手一定是漂浮岛的租客，设定中提到租客可以自己DIY岛上的建筑植被，只要对路面稍作"加工"就能让众人感觉不到。四角屋和六角屋就建在岛屿中线上，本身不倾斜。
    Q2：如果凶手原地滚动了岛屿，众人为何没感觉到？
      A：凶手一定是半夜大家睡了之后做的，山本阳介凌晨就死了。只需轻微滚动一两度，弹珠就会滚落，随后复位即可，弹珠也不会离开门边，睡着的众人感觉不到这么轻微的偏移。
    Q3：漂浮岛就是立着的，倾斜时轻微上浮不就能保持比例不变吗？
      A：纯靠自身浮力漂浮的物体（如普通木头）倾斜时确实会轻微上浮；但设定说"岛屿本身无法上浮或下沉"，所以它不是仅靠自身浮力静止在水面上的，一定有岛屿自身动力源参与，否则早就沉了。可以理解为"无法上浮或下沉"是一个概念设定，即使倾斜后浮力增加一点点，岛屿也不会上浮。
      退一万步，如果玩家实在纠结不接受，就安抚玩家：目前这一切仅仅是我们针对谜题的推论，漂浮岛实际如何或许只有凶手才知道，我们的目的是找到能解决弹珠密室的方法；至于它是立着还是躺倒的，待定即可。
- id: p4_13
  title: 山本阳介案·答案揭晓
  type: narration
  minutes: 3
  dm_script: |
    本案的手法总结：合理利用漂浮岛设定使得房间倾斜。
    首先房门没有任何缝隙，门一旦关上就与外界绝对地隔绝，并且房间内也没有什么能够提供动力的设施，那么便只能从整个房间、建筑或者岛屿上突破。
    已知六角屋没有任何机关，同样无法提供任何“动力”。
    那么便只剩下岛屿本身——漂浮岛。

    【漂浮岛坐标泄露事件】中有关于漂浮岛的设定，以下几条在本案至关重要：
    （1）漂浮岛整体呈标准的圆柱体。
    （2）漂浮岛大部分在水下，仅有小部分在水上，且无法上浮或下沉，其水上和水下体积比例永远保持不变。
    （3）漂浮岛航行功能已关闭（无法位移），即使开启动力装置，也仅会朝航行方向轻微偏移。

    因为岛屿是标准的圆柱体，且仅有小部分在水面之上，如果此时岛屿发生了倾斜，那么其水上和水下的体积比例一定会改变。
    因为水面在岛屿的上半部分，所以在倾斜过程中岛屿的水上体积会减小，水下体积会增大，这违反了漂浮岛的设定，因此无法如此倾斜。
    当水面高度与岛屿中轴在同一高度时，岛屿倾斜，体积比例才不会改变，因为不管怎么倾斜，水上水下体积永远都是1:1。
    综上所述，因为海平面高度在岛屿中轴之上，漂浮岛倾斜会改变水上水下体积比例，从而违反了漂浮岛自身设定，故岛屿无法倾斜，也就不会带动建筑倾斜。

    我们已知只有漂浮岛本身存在动力装置，只有岛屿带动建筑发生倾斜，弹珠密室才能成立，可是因为其设定的原因，漂浮岛又不能倾斜！
    那我们不妨来回顾一下，漂浮岛的设定中虽然明确表述了漂浮岛呈标准的圆柱体。
    但是！并没有提及漂浮岛到底是以什么角度在海中航行的吧？

    如果漂浮岛是躺倒在海面上的圆柱体，那么它所谓的轻微偏移实际上就是原地滚动。如此一来，不论如何滚动，它的体积比例都会永远保持不变。
    除此之外，漂浮岛在原地滚动的同时，岛面上的建筑就会发生倾斜。

    众人是从正西侧上岛的，然后朝东直走来到四角屋，然后再朝东直走来到六角屋，通过六角屋门口的悬空露天平台，然后抵达六角屋的大门。
    也就是说，六角屋门口的露天平台是东西朝向的。
    而山本阳介住在12号房，通过观察调查档案上的六角屋平面图就可以知道，12号房的房门是朝正北方的。
    也就是说，整座岛屿只要朝正北方轻微滚动一点点（1度2度的样子），山本阳介房门后的弹珠就会自己滚到门边，从而完成弹珠密室。

    山本阳介的死亡时间为凌晨，目前看来所有人都没有不在场证明，且死亡时间很宽泛，弹珠密室这个手法本身又不具备锁凶条件，因此，本案仅破解手法即可，凶手无需锁定。
  dm_notes: |
    【演示】讲解时配合白板：先画立着的圆柱体+水面线说明为何不能倾斜，再擦掉重画躺倒的圆柱体；用白板笔/瓶子模拟原地滚动。
    岛屿俯视图：西侧楼梯——（单程20分钟）——四角屋（北木屋1、南木屋2）——（单程20分钟）——六角屋（东）。
    12号房房门朝北（调查档案第二案的六角屋平面图旋转着看更好理解）。手册原文此句作"12房的房门是朝正北方的"，dm_script 补成"12号房"。
    dm_script 第二段（漂浮岛三条设定）、第三段（立着的圆柱体为何不能倾斜）、第四段（引导话术）分别取自手册推理引导流程中的原话，复盘时按顺序讲即可。
    如果玩家提出过"原地自转（离心力）"解答，复盘时也一并承认它是本案的另一种解答。
