- id: xinjing
  name: 新井直人
  public: 新井侦探事务所所长，【新井直人事件簿】系列主角（前作《时针岛》）。长谷川悠人是他事务所的助手，自称他的头号粉丝。建议由玩过《时针岛》的玩家扮演。
  secret_brief: 长谷川悠人去年10月中旬来事务所当助手，之后一个月每天早上9~11点都拉着他看推理剧——新井直人就是长谷川“不在场证明”的见证人（第一幅作品）。他的剧本里写有佐藤光一死后直到下船的那一段经历（第八幅作品会用到）。11月1日10:25他搀扶受伤的长谷川进入四角屋。他的人物剧本第11页（佐藤光一死后：11:10回房、晕船小睡、被杯子碎声惊醒、看到“11:20”、之后和长谷川聊推理小说到13:30下船）是全本唯一作用于推理的私人视角，第八幅作品时需要请他分享。
