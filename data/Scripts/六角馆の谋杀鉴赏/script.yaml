- id: p2_10
  title: 第一重第二案·推理
  type: discuss
  minutes: 13
  dm_script: |
    【本案谜面梳理】
    女佣00:30来到餐厅看到死亡留言，然后朝隔壁的加藤健一房间看去，透过玻璃看到加藤健一趴在床上，并在玻璃书柜上看到了15号房钥匙。
    随即女佣来到15号房门口尝试开门，发现打不开，门上的小窗也是从内部上锁的。
    管家02:10召集众人搜身后进入15号房，在里边发现了已经死亡的加藤健一以及15号房钥匙。
    密室如何形成的？
    凶手是谁？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】
    【标准答案】本案手法：拼钥匙＋还钥匙。
    谜面一（女佣看到15号房钥匙在房间内，为什么打不开门？）：凶手23点左右杀死加藤健一，刮花他的脸，在餐厅放好杀人留言；用一把一面印有X的钥匙（10号以上房间的钥匙）＋从玄关拿的5号房钥匙（两面都印V）贴合在一起，放在加藤房间的玻璃书柜上，伪装成15号房钥匙（一面X一面V）；然后出门，用真正的15号房钥匙锁门，回自己房间。
    谜面二（管家搜身后众人进入15号房，钥匙如何还回来？）：凶手去集合前先把真15号钥匙挂在（大厅外墙角上的）挂钩上，再接受搜身进入15号房。女佣不在场，只有凶手知道假钥匙放在哪，所以凶手第一个去回收假钥匙即可。大家都在找钥匙时，凶手打开门上的小窗，旋转六角大厅，把挂钩所在的那个角转到正对加藤房门的位置——此时挂钩距房门仅40cm，人在房间内把手从小窗伸出去就能拿到钥匙。
    Q2（凶手）：小林纪子。此手法除5号房钥匙外，还需要一把单面印有X的钥匙，6人中只有小林纪子有（她的钥匙两面都印有X）。
    【关键线索】罗马数字钥匙（5号两面V、15号一面X一面V、小林纪子的钥匙两面X）、玄关存放钥匙、门上的小窗（高1m）、挂钩、管家逐一搜身且进门后门没开过、00:20-02:10六人视频通话（小林全程在自己房间没退出）。
    【扶车方向（逐步）】
    0. 若玩家卡在谜面一：可提示“女佣隔着玻璃看到的，真的是15号房的钥匙吗？钥匙上印的是什么？”（AI可酌情）
    1. 问：凶手能在什么时候把钥匙送进去？
       → 如果是拼钥匙手法，那凶手只能是小林纪子，而她全程在自己房间内打视频，也没有退出过，因此视频期间她什么都做不了。而进入房间的时候管家搜了身，也无法带进去，因此唯一把钥匙送回来的时间，是众人都进去之后在找钥匙的时候。也就是说，小林纪子需要做到人在房间内、不开房门，将钥匙从外边拿进来。而不打开房门的情况下，还能通向外界的就只有门上那个小窗了。
    2. 问：凶手需要将钥匙放在哪里，才能人在房间里就将钥匙取进来？
       → 如果把钥匙放在地上，小窗高度1m，手伸出去是够不着的，而走廊上没有任何能放置钥匙的地方。因此，能让钥匙固定住、且能在搜钥匙的时候靠近小窗的，只有挂钩了。
    【注意】40cm这个数据不需要玩家计算，只是用来验证手法的可行性；玩家推理出“将钥匙挂在挂钩上，旋转大厅，从小窗拿钥匙”即可。玩家询问数据时主持人直接告知。
    【玩家答疑】（玩家问到时可直接回答）
    Q1：凶手能不能将钥匙含在嘴里带进去？能不能放地上悄悄踢进去？
    A：不能。管家说过他仔细搜身，确保身上没携带除了通信设备外的任何东西。那么就可以认为这不是一个“藏得好”还是“藏得差”的问题，不管在身上怎么藏，都会被发现。并且管家是第一个到达15号房门口的，也不存在在门上做什么机关藏钥匙，搜一个进去一个，所以就是明确无法在此时带进去。
    Q2：不计算数据的情况下能盘出这个手法吗？
    A：可以。首先已知大厅能够旋转，所以在旋转过程中大厅的墙壁一定不会撞在对面的房间墙壁上，否则大厅是不能旋转的。其次，数据是不需要玩家计算的，玩家询问的话主持人直接告知即可。
    管家/女佣行为逻辑类问题：统一回复“最后会有解释（长谷川的故事中会解释）”。
