- id: p2_07
  title: 第一重第一案·推理
  type: discuss
  minutes: 13
  dm_script: |
    【本案谜面梳理】
    管家00:50来到山田莉子房间门口敲门，无应答，尝试开门发现打不开。
    03:00管家和女佣一起用万能钥匙打开山田莉子的房门，发现死者死于墙上的短刀，且该房间的11号钥匙就在尸体脚下。
    且女佣可以确认00:30-03:00，11号房门没打开过。
    密室如何形成的？
    凶手是谁？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】
    【标准答案】
    Q1（手法）：误导管家对房间的认知。管家00:00进入六角大厅后，凶手将大厅逆时针旋转120度，并去玄关拿到5号空房间的钥匙，把空房间锁上。管家00:50看到杀人留言后从大厅4号门出来，去的其实是5号空房间（他以为是11号山田莉子的房间），敲门、开门打不开，又回到大厅。凶手随后将大厅旋转复位，把5号门解锁并将钥匙还回玄关。03:00管家与女佣用万能钥匙打开的是真正的11号门（此时根本没上锁），发现尸体和钥匙。
    Q2（凶手）：清水伊织。要让管家第一次去到错误的房间，只能在00:00-00:50旋转大厅（铃木美雪23:00-24:00在走廊，机关未触发，说明24点前没转）；清水伊织日记称“00:00-01:00开着门，机关未触发”——开着门等价于在走廊，旋转一定会被发现，所以她的日记撒谎；只有凶手会撒谎→凶手是清水伊织。
    作案细节：杀人预告信封可在23:00前放好；23:00凶手敲开山田莉子房门，打晕她，用铁链捆住吊在墙上的短刀前，将她的身体刺入短刀，并刮花她的脸。
    【关键线索】白板时间线（铃木美雪、清水伊织的“机关未触发”）、【旋转】大卡（走廊/开着门能发现旋转过程）、玄关存放各房间钥匙、5号是空房间、罗马数字钥匙（11号钥匙一面I一面X）。
    【扶车方向（逐步）】
    1. 先问玩家：管家3点用万能钥匙开门的时候，房门到底有没有上锁？
       → 一定没有。房门没有缝隙，房间内唯一通向外界的只有那道裂痕，但裂痕在建筑外墙且在8米高的位置，够不着塞钥匙。如果此时门是上锁的，那么凶手不可能再将钥匙还回去。
    2. 再问：在管家的认知中，一共去过几次山田莉子的房间？凶手能做什么？
       → 去过两次，一次发现密室，一次开门发现钥匙和尸体。也就是说，如果这两次去的不是同一个房间，所有问题就都解决了。
    3. （AI可酌情）提醒结合【旋转】大卡：大厅转动后，从同一扇大厅门出来面对的房间会变；再看谁的日记声称在关键时段“机关未触发”。
    【玩家答疑】（玩家问到时可直接回答，属于排除错误思路）
    Q1：管家被误导去的房间能不能是宫本诚或池田孝太的房间？
    A：不能。首先，00:50门上的罗马数字灯虽然还没亮，但宫本诚的房门在那面墙的左半部分，而山田莉子的房门在墙的右半部分，一堵10米的墙，门在左边还是右边管家一定能发现；其次，管家00:50去到房间门口还敲了门，如果去的是这两人的房间，他们有可能听到敲门声直接就把门打开了。
    Q2：凶手能否是坂田仓介，他用自己的9号房钥匙伪装成11号房钥匙？
    A：不能。坂田住9号房，他的房间钥匙两面印的都是IX，而山田莉子11号房的钥匙一面是I，另一面是X。
    Q3：凶手如何预判管家的行为？如果管家当时直接用万能钥匙开了5号门怎么办？
    A：因为针孔摄像头的缘故，凶手具有馆内的天眼视角，知晓任何人的一举一动。至于管家可能会做出的其他行为，还是回到一开始所说的：“六角馆事件”作为既定事实的结果，无须考虑NPC做出与事实不符的行为会怎么样；如果他做了，凶手自然有其他的应对措施，例如直接杀死管家等等，那么众人所看到的材料自然会有所变动，仅此而已。
    【注意】如果有玩家实在纠结管家/女佣的行为逻辑、过不去这个坎，也可以告知：在最后会有解释为什么管家和女佣会这么做（长谷川的故事中会解释）。后续案件中同类问题统一这样回复即可。
