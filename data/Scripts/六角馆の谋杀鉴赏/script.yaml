  title: 第一重第三案·推理
  type: discuss
  minutes: 15
  dm_script: |
    【本案谜面梳理】
    管家02:10在仓库醒来，巡视一圈后确认房内没有人，尝试开门却发现打不开，然后在尸体身上找到一把一号房也就是仓库钥匙。
    谜面就是：凶手不在仓库内，管家所在的反向密室是如何形成的？
    凶手是谁？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】
    【标准答案】本案手法：伪造仓库——管家醒来的地方根本不是真仓库。
    凶手22点前杀死渡边翔太，把尸体带回自己房间；01:00出门打晕管家，把管家和尸体都搬到仓库门口的走廊上；将六角大厅旋转180度，把3号和4号大厅门打开至水平（与仓库墙壁平行），仓库门口这段走廊就成了一个新的密闭空间——与真仓库镜像（轴）对称的“假仓库”（大厅门开至水平后刚好构成边长5m的等边三角形，严丝合缝挡住走廊；门和墙壁都是黑色）。再把仓库里的两个储物柜搬到走廊上，挡在3号、4号大厅门正前方（保证管家醒来能看到储物柜；挡住02:10已亮起的4号大厅门“IV”灯；3号大厅门灯虽坏，但为了柜子位置与原来一致、并挡住3号大厅门的门把手，也要挡一个）。然后在走廊上用仓库钥匙锁上仓库门，把钥匙放到尸体身上，自己推开3号或4号大厅门一点离开。02:10管家发现“密室”后（还没去开门），凶手立刻用迷药把他迷晕，再复原一切。
    Q2（凶手）：宫本诚。此手法要求管家02:10醒来时3号、4号大厅门是开着的，而宫本诚口供说22:00-02:20他在大厅内、大厅的门没有开过——撒谎→凶手是宫本诚。
    【关键线索】仓库是梯形房间、门（罗马数字I）在梯形短边；门全黑、贴合无缝、看不出门轴、门把手居中对称；3号大厅门的罗马数字灯是坏的；罗马数字灯02:10已亮；储物柜不可藏人、不可攀爬；大厅门宽5m、走廊宽4.3m、大厅门最多开到90度；宫本诚22:00-02:20在大厅内的口供。
    【扶车方向（逐步）】
    1. 问：凶手为何要在管家发现现场是密室之后立刻把他迷晕？
       → 如果凶手不希望管家发现现场，就不会这么布置。但凶手又在管家刚找到钥匙、还没去开门的时候就迷晕他，这是为什么？——因为凶手不能让管家拿着钥匙去开这扇门。
    2. 如果玩家想到“伪造仓库”，但不清楚具体如何伪造时，可以告知：
       → 如果想要伪造一个仓库，至少需要保证仓库本身的面积几乎不变，因为管家是最熟悉这里的人，并且他绕着仓库巡视了一圈；除此之外，写有罗马数字“I”的门是无法伪造出来的，一定是仓库的门，并且这扇门需要在梯形仓库的短边上。
    3. （AI可酌情）提示大厅门的尺寸（宽5m）与大厅可旋转：哪两扇大厅门打开后能把一段走廊围成封闭空间？
    【玩家答疑】（玩家问到时可直接回答）
    Q1：凶手能否如下图所示伪造仓库？（手册第32页原图：方法一、方法二都是用大厅门I、II在仓库门口走廊两端斜着挡出一个空间，红线为门的位置；方法一挡出的空间仓库门落在梯形长边上，方法二挡出的空间比仓库小很多）
    A：不能。方法一（新的仓库门落在梯形的长边上）：管家一定会意识到不对。方法二（围出的空间与仓库面积相差很大）：仓库面积变化太大了，并且门宽5m，走廊宽4.3m，大厅门是无法开超过90度的。
    Q2：凶手能否藏在储物柜后？储物柜顶？仓库门能否伪造？
    A：不能藏人。首先储物柜一定是贴墙放，且线索提及储物柜内不可藏人、不可攀爬。地上躺着的人，管家确认是脸部被划烂的尸体，凶手无法伪装。仓库门上亮着的罗马数字灯也无法伪造，不存在用“某种道具”遮挡住一部分伪造出一个“I”：一方面管家就在门的面前，会发现遮挡物；另一方面馆内也没有这样的“道具”。女佣所使用的荧光粉和门上的灯光不是一种东西。
    Q3：如果管家去推墙或者移动柜子怎么办？
    A：管家认为自己在仓库中，正常情况下就不会去这么做。即使他想这么去做，凶手是在监视着管家的，可以随时把他迷晕。
    Q4：仓库门的内侧和外侧，管家不会发现吗？
    A：不会。线索中说过，门全黑，贴合后无缝隙，看不出门轴在哪一侧，并且门把手也是在门的中央位置，且是对称式的门把手，因此在门内看还是门外看，这扇门都一模一样。
    管家/女佣行为逻辑类问题：统一回复“最后会有解释（长谷川的故事中会解释）”。
- id: p2_14
  title: 第一重第三案·答案揭晓
  type: narration
  minutes: 4
  dm_script: |
    下面复盘第三案——渡边翔太案。
    【作案手法破解】
    本案的手法总结：伪造仓库。
    首先，凶手在22点前杀死渡边翔太，并将他的尸体带回自己房间。
    01:00凶手出门打晕管家，并将管家和尸体都移动到仓库门口的走廊上。
    随后凶手先将六角大厅旋转180度，然后将3号与4号大厅门打开至水平状态（与仓库墙壁平行），如此一来仓库门口的那一段走廊会成为一个新的密闭空间——即与仓库镜像对称的“假仓库”。
    当将3号和4号大厅门开至水平后，门与走廊拐角处刚好构成一个边长为5m的等边三角形，因此刚好严丝合缝挡住走廊，门与墙壁都是黑色的，这么做后就让管家以为自己在真的仓库中醒来。
    除此之外，凶手还需将仓库中两个储物柜也搬到走廊上，挡在3号和4号大厅门正前方。一方面是为了保证管家醒来时仍能看到储物柜，另一方面02:10门上的罗马数字灯已经亮起，4号大厅门上有一个亮着的“IV”，需要把它挡住。线索中提及3号大厅门上的灯坏了不会亮，但为了保证储物柜位置与原位置相同，并且避免管家看到3号大厅门的门把手，因此同样要将另一个柜子挡在3号大厅门前。
    做完上述一切操作后，凶手用仓库钥匙在走廊上将仓库门上锁，然后将钥匙放到尸体身上，自己将3号或者4号大厅门推开一点，就从这个空间离开了。
    02:10管家发现密室现场后，再用迷药把管家迷晕，然后复原一切即可。
    【凶手锁定】
    此手法需要在管家02:10醒来时，开着3号和4号大厅门伪造仓库，而宫本诚口供中说22:00-02:20大厅的门没有开过，因此锁凶宫本诚。
  dm_notes: |
    【演示】手册第31页原图：大厅旋转180度后，仓库门口那段走廊左端是门IV（池田孝太一侧）、右端是门III（玄关一侧）；两扇门开至水平，门与走廊拐角处的红色三角形标注“边长为5m的等边三角形”，另标注“真仓库与假仓库轴对称”；仓库外侧标有罗马数字I，右下角是出入口。手册原文“上图中红色部分刚好构成一个等边三角形”在dm_script里改成了“门与走廊拐角处刚好构成一个边长为5m的等边三角形”（大屏上没有这张图）。主持人可在白板上画图，或用大馆模型演示：大厅旋转180度→打开3号、4号大厅门至水平（与仓库墙壁平行）→仓库门口走廊被围成与仓库对称的“假仓库”→两个储物柜挡在3号、4号大厅门前。
    【板书】在白板A第三案“凶手”处贴上宫本诚的名牌。至此第一重三案凶手：清水伊织／小林纪子／宫本诚。
    【复盘后答疑】其他伪造方式不行（门在梯形长边会被发现；面积变化太大且大厅门开不过90度）；凶手不能藏在柜子后/柜顶（储物柜贴墙、不可藏人不可攀爬）；“I”灯无法伪造；管家不会去推墙（且凶手监视着可随时迷晕）；门全黑无缝、门把手居中对称，内外看不出区别。
    【注意】只宣布为本轮（第一重）的解答，不要暗示后续还会有变化。本部分到此结束，下一阶段为第三部分的小剧场二（BGM：英国法廷組曲 尋問 ～モデラート）。
- id: p3_01
  title: 小剧场二
  type: reading
  minutes: 4
  dm_script: |
    请大家拿出手机，在“剧本”里共同演绎人物剧本下一页——【小剧场二】。
    各位按自己的角色念台词，主持人负责旁白和山口麻衣的台词。
  dm_notes: |
    【BGM】切换为：英国法廷組曲 尋問 ～モデラート
    【演绎分工】主持人（山口麻衣）念旁白和山口麻衣的台词；其余台词由对应角色的玩家念：相泽翡翠、明智邦彦、新井直人、岛田琉璃、小岛浩一、北山诚一（6人都有台词）。
    【道具】演绎到旁白“山口麻衣说完，便拿出了一张大卡摆在了众人面前”时，主持人拿出【升降】大卡（02号卡）摆到桌上；下一阶段正式发放、通读、答疑。
    【本段要点】
    - 山口麻衣宣布：第一重推理固然精彩，但不是最终真相——六角馆三起案件的凶手是同一人。
    - 六角馆除了旋转外，还有另一个功能：升降。提示来源：开场两起破冰案与后续推理有关联，“旋转”对应《炸弹失窃案》，“升降”对应《坐标泄漏案》的核心元素“电梯运动轨迹”。
    - 违和点：发现“门口安置了炸弹”的纸条后，大门就再也打不开，馆内又没有任何窗户，众人是怎么确认门外炸弹真实存在的？
    【只给主持人看的注】小剧场中提到的“六角馆的另一功能——升降”可以帮助馆内的人发现炸弹。方法：先将大厅下降到底，然后从房间内出门，站上大厅天花板，再上升大厅，人就可以来到屋顶，从上往下看就能看到门口的炸弹。
    这一点不需要告知玩家；玩家如果问了，让玩家自行思考即可。
