- id: p3_02
  title: 六角大厅·升降功能
  type: narration
  minutes: 4
  dm_script: 现在给各位发放【升降】大卡（02号卡），请大家通读。读完之后，关于升降功能有任何疑问，都可以向我提出。
  dm_notes: |
    【物料】发放【升降】大卡（02号卡），提醒玩家通读，并答疑。玩家对升降功能没有疑问后，再进入下一阶段（谜面梳理）。
    【模型·第二阶段「升降功能」演示】
    - 【升降】大卡发放后即可调整模型结构：把大馆模型上（安装指南图中红色圆圈处）固定大厅的两个插销取下，大厅即可升降（第一阶段插着插销，是为了防止大厅自己落下）。
    - 大厅下降后，大厅门可开启或关闭，用于后续案件手法的演示。
    - 建议边答疑边用模型演示：①按一次下降，大厅天花板降到距离走廊地板40cm处自动停止；②再按一次下降，大厅直接降到底（大厅天花板与走廊地板齐平，馆内成了一个大平层）；③按一次上升，大厅上升复原（大厅地板与走廊地板齐平）；④大厅一旦下降就不能再旋转，3号、4号大厅门也打不开。
    - 注意：模型不是按线索中的等比例制作，数据以线索册为准。
    【关于升降的常见问题答疑】（玩家问到再答）
    Q1：安全设施是什么东西？有什么用？
    A：因为大厅的天花板刚好完全覆盖走廊，升降的机械力又非常大，如果有人在走廊，此时大厅直接降到底，走廊上的人就会被压碎。所以在功能设计上，大厅天花板降到距离走廊地板40cm的位置会自动停止，此时如果走廊有人，趴在地上是不会被压死的。但如果再按一次下降按钮，大厅就会直接降到底。而只要点击一次上升按钮，大厅就会上升复原。
    Q2：升降时如果开着门会怎么样？
    A：如果3号或者4号大厅门开着（1号和2号是下翻门，所以不影响），那么就无法下降，因为门的下边抵住了走廊地板。同理，如果15号房间门和玄关门（这两扇门是外开门，即朝走廊开门）开着，同样会卡住导致无法下降。其余房间的内开门对大厅的升降没有影响。
    Q3：升降和旋转的关系是什么？最多能升降多少？
    A：一旦发生了下降，无论下降多少，大厅都不能再旋转，因为大厅是六边形，它的六个角会与走廊地板卡住，导致无法旋转。更重要的是，根据大卡中描述的旋转原理，六角大厅的旋转依靠的是六角馆地板与六角大厅底部连接的转轴；六角馆地板一旦与其他部分分离，没有了固定点，该部分六角馆地板就处在悬空状态，不可能带动六角大厅旋转。
    除此之外，大厅一旦旋转了且不是60度的整数倍，那么大厅就无法下降。
    还有很重要的一点：大厅下降后，无论下降多少，3号和4号大厅门都不能再打开，因为这两扇门的顶部会被走廊地板卡住。
    大厅能下降的最低位置：大厅天花板覆盖走廊地板的时候。
    大厅能上升的最高位置：大厅地板与走廊地板齐平的时候。
    Q4：升降时会被发现吗？在哪里能发现？
    A：人在大厅内，且大厅关着门，如果升降速度较慢，大厅内的人察觉不到，因为没有参照物。
    但如果人在走廊，此时大厅升降了，就一定会发现，因为有参照物。（不管升降得多慢，只要在升降就一定会发现，可以告知玩家当成小设定来理解）
    需要注意：能发现的是升降的过程而非结果。假设大厅下降了5cm然后保持静止（功能上不支持这样，仅用作举例），那么有人来到走廊是不会发现的。当然，如果下降得很低，例如距离走廊地板40cm，那一定会发现，因为这个状态下人出门都得跨一个40cm的台阶；如果直接降到底，人出门也会发现，因为大厅没了，六角馆内部成了一个大平层。
- id: p3_03
  title: 第二重·谜面梳理
  type: narration
  minutes: 2
  dm_script: |
    各位，现在我们已经知晓了六角馆内的所有功能，重新梳理一下我们所面临的问题。
    首先，有了升降功能不代表旋转不能使用了，依然可以，也就是说，凶手同样可以使用旋转功能来完成案件，代表着之前的凶手和手法并未完全推翻。
    而各位侦探需要做的，就是根据这两个功能，找出三起案件那唯一的凶手，并破解凶手的作案手法。
    这三起案件，各位想从哪一起开始推理均可，只要能得出唯一的凶手即可。
  dm_notes: |
    【时机】玩家对升降功能没有疑问后，主持人念上面的谜面梳理。
    【注意】这一重推理玩家自由度较高，整体难度比上一重有所提升，主持人需要对流程、案件细节足够熟练，并根据每车玩家实际情况调整：纯硬核玩家可直接闭麦放盘；如果不是，主持人应适当介入，引导玩家得出解答。
    【真相】本轮真实凶手：三起案件均为铃木美雪。（第一重解答：第一案清水伊织、第二案小林纪子、第三案宫本诚，名牌目前贴在白板A上。）
    【说明一：玩家的两个宏观方向】（玩家对谜面不够清晰时，主持人可帮忙梳理这两个方向，让玩家知道当下要做什么）
    - 方向一：凶手是第一轮推理中三个凶手之一。例如假定三案凶手都是清水伊织，那么需要推理清水伊织如何完成后两起案件。
    - 方向二：凶手不是上一轮的三个凶手，即需要在坂田仓介、池田孝太和铃木美雪三人中找出一个凶手，并破解TA三起案件的作案手法。
    【说明二：推理起点】本轮三起案件，玩家以任意一案为起点开始推理都可以，也可以分组推理。本轮推理完全能够支撑玩家放盘，一定能推出解答，只是需要时间。后续阶段按第一案→第二案→第三案排列，实际开本时玩家先推出哪一案就先复盘哪一案（可跳到对应的“答案揭晓”阶段）。
    【说明三：谜面和难度】三起案件本身的谜面都没有变，依然是——密室如何形成？玩家忘了谜面时，主持人可以再梳理一次三个案件的密室谜面（见各案“推理”阶段的谜面回顾）。本轮三案难度均高于第一轮，需要给玩家更多时间。
    【说明四：破解任意一案后的流程引导】因为本轮真凶是铃木美雪，玩家破解任意一案后会得到两个凶手位：铃木美雪 + 本案原凶手。
    此时另外两起案件的凶手和手法就都被推翻了：之前通过手法锁凶都是唯一的（只有这个凶手能使用这个手法），凶手一旦被推翻，作案手法也就被推翻。此时主持人把白板上另两起案件的凶手名牌揭下。
    接下来玩家要做的是：带着这两个凶手（铃木美雪 + 本案原凶手）去破解另外两起案件，看他们中的谁能够完成作案。
- id: p3_04
  title: 第二重·山田莉子案·推理
  type: discuss
  minutes: 13
  dm_script: |
    第一案·山田莉子案
    Q1：结合旋转与升降两个功能，山田莉子房间的密室是如何形成的？
    Q2：谁是唯一能够完成这一手法的凶手？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】
    【谜面回顾（玩家忘了可帮忙梳理）】管家00:50来到山田莉子房间门口敲门，无应答，尝试开门发现打不开。03:00管家和女佣一起用万能钥匙打开房门，发现死者死于墙上的短刀，该房间的11号钥匙就在尸体脚下。女佣可以确认00:30-03:00，11号房门没打开过。
    【第一重解答（伪解答）】凶手清水伊织，手法“误导管家对房间认知”（管家00:00进入大厅后旋转大厅120度，让管家00:50去了被锁上的5号空房间）。这个解答在第二重里依然成立，所以破解本案后凶手位是“铃木美雪 + 清水伊织”两个。
    【标准答案】
    Q1 手法：搭梯子+还钥匙。凶手23:00杀死山田莉子并带钥匙出门锁门（真密室）→ 把仓库两个储物柜推进大厅 → 大厅旋转180度，使1号下翻门正对山田莉子房间 → 大厅降到底，打开1号下翻门（门高9.5m，走廊和房间各宽4.3m，放倒后超出建筑0.9m）→ 把两个储物柜推到门板最边沿横向放好、锁上滑轮 → 上升大厅，柜子就立在建筑外侧的门板上 → 凶手回自己房间，再降大厅、出门站上大厅天花板，上升大厅来到屋顶 → 从山田莉子房顶跳到8m高的储物柜上，把钥匙从外墙8m高的裂缝扔进房间，再跳到4m高的柜子上、最后跳到门板上 → 解锁滑轮、柜子推回大厅、大厅复位、柜子还回仓库。
    Q2 凶手：铃木美雪。死亡时间23:00-23:30，凶手必须在死者死后才能拿到钥匙布置密室；00:00-00:50管家一直在大厅内，凶手无法推着柜子进出大厅，所以密室必须在00:00前完成 → 行动时间锁定在23:00-00:00。铃木美雪日记说这段时间她在走廊、大厅机关未触发（走廊上的人一定会发现升降），只有凶手能撒谎 → 锁凶铃木美雪。
    【关键线索】山田莉子房间外墙8m高处的裂缝（锁门后房间通向外界的唯一通道）；仓库里两个带滑轮锁扣的铁质储物柜（8×2×0.4m）；1号下翻门高9.5m；铃木美雪日记“23:00-24:00在走廊，机关未触发”；管家00:00-00:50在大厅内。
    【扶车方向】（按顺序逐步给）
    扶车Q1：如果不误导管家对房间的认知，那么还能是心理密室吗？
    A：如果不使用误导管家的手法，那么管家00:50去的就是山田莉子的房间，这个房间就是货真价实的真密室。如此便只能考虑：凶手如何在门外锁门后，把房间钥匙送回去。而山田莉子房间锁门后，通向外界的唯一通道就是墙上的那条裂缝。但裂缝在外墙上，且在8m高的位置，如何把钥匙从这里送进去？
    扶车Q2：如何将钥匙从墙壁外侧8m高的裂缝送进去？
    A：不管是从上往下的2m，还是从下往上的8m，都不是光靠人力就能完成的，一定需要某些道具，而馆内出现过的道具均可使用。
    【玩家答疑】（玩家质疑时再答）
    Q1：8m高的铁柜子，人力推得动吗？
    A：8×2×0.4m的铁质空心柜子，按5mm厚度计算（较厚）质量大概在1600kg左右。推动柜子要克服的是铁柜与地面的摩擦力，橡胶轮与地面的滚动摩擦系数非常小，大约0.01，由此算出推动的力需要160N左右，即16公斤的力，正常成年人均可做到。但如果想把柜子抬起来、放倒，或者带着柜子来到屋顶再放下去，人力就做不到了。（这些数据不需要主动给玩家讲解，有玩家质疑可行性时再提出即可。）
    Q2：能否来到屋顶之后直接往下够？或者跳下来送钥匙？
    A：即使来到屋顶，距离裂缝也还有2m，不可能够得着，且六角馆外壁光滑不可攀爬，也不存在绳子一类的道具。如果直接往下跳、在空中送钥匙，先不说能否成功，凶手会死在9月1日。
    Q3：柜子能否稳定立在门板边沿？刮风或者凶手跳下来踩上去会不会移动？
    A：凶手把储物柜放到对应位置之后，会锁上柜子的滑轮。橡胶轮与地面的滚动摩擦系数虽然很小，只有0.01左右，但轮子锁住不滚动时，静摩擦系数在0.5-1左右，推动柜子此时至少需要几百公斤的力，已经足够无视风力或者人跳上去带来的惯性了。
- id: p3_05
  title: 第二重·山田莉子案·答案揭晓
  type: narration
  minutes: 4
  dm_script: |
    山田莉子案——案件复盘。
    作案手法破解：
    本案的手法总结：搭梯子+还钥匙。
    凶手23:00杀死山田莉子，杀人手法不变，然后带着钥匙出门锁门。
    随后凶手来到仓库，将两个储物柜下方的滑轮锁扣打开，然后将两个储物柜推进六角大厅。
    旋转六角大厅180度，此时六角大厅的1号下翻门正对着山田莉子的房间。
    将六角大厅下降到底，打开1号下翻门。
    因为下翻门的高度是9.5m，而走廊和房间的宽度都是4.3米，因此1号下翻门放倒后，会超出建筑0.9m（9.5-4.3-4.3=0.9）。
    凶手将两个储物柜推到下翻门的最边沿处，横向放置并把滑轮上锁，因为柜子的宽度仅有40cm，因此这0.9m的范围内足够横向放置两个储物柜。
    凶手回到大厅内，上升六角大厅，完全复原后，因为1号下翻门没有关回来，此时两个储物柜就在建筑外侧的门板上放着。
    凶手从大厅出门，进入自己的房间，然后再次下降大厅到底（或者距离走廊地板40cm也行），凶手出门，就可以来到天花板的上方。
    上升大厅到原位，凶手就可以踩着大厅天花板来到房间的房顶之上，然后从山田莉子房顶跳到8m高的储物柜上，将钥匙从裂缝扔进房间，再跳到4m高的柜子上，最后跳到门板上。
    送完钥匙后，再将储物柜滑轮解锁，然后将柜子推回大厅，上升大厅复位，归还储物柜到仓库，一切就都完成了。
    凶手锁定：
    死者死亡时间23:00至23:30，需要在死者死后才能拿到钥匙布置密室，如果23点前打晕死者布置密室，那么无法在23点之后杀她。
    管家00:50发现的密室，00:00-00:50管家一直在大厅内，凶手无法推着柜子进出大厅，因此，密室需要在00:00管家进入大厅前就完成密室。
    综上所述，凶手的行动时间锁定在23:00-00:00，而铃木美雪日记中提到这期间大厅机关未触发，因此锁凶铃木美雪。
  dm_notes: |
    【模型演示】主持人可用模型给玩家复盘，核心是确保玩家能理解手法原理；也可以用磁吸贴+画图的方式复盘。建议步骤：①大厅旋转180度，1号下翻门正对山田莉子房间；②大厅降到底，打开1号下翻门，让玩家看到门板放倒后横跨走廊和房间、伸出建筑外（9.5-4.3-4.3=0.9m）；③在门板最外沿示意两个储物柜（可用小物件代替）；④上升大厅，柜子立在建筑外侧；⑤演示凶手：回房→降大厅→站上大厅天花板→升大厅到屋顶→跳到8m高柜顶，从裂缝扔钥匙→跳到4m高柜子→跳到门板；⑥柜子推回大厅、大厅复位。
    （手册此处配有三步侧视示意图+两张模型照片：①大厅降到底，1号下翻门放倒，门长9.5m，比“走廊+房间”的宽度8.6m（4.3+4.3）多出0.9m伸到建筑外；②两个储物柜立在门板伸出建筑的最外沿；③大厅上升复原，两个柜子立在建筑外侧，凶手站在房顶上。旁注：主持人可用模型给玩家复盘，也可用磁吸贴+画图的方式复盘，核心是确保玩家能理解手法原理。图中的8.6m是走廊+房间的宽度，不是大厅高度；具体数据以线索册为准。）
    【原文说明】凶手锁定第二句手册原文作“密室需要在00:00管家进入仓库前就完成密室”，与同句“00:00-00:50管家一直在大厅内”及第一重“管家00:00进入六角大厅”矛盾，dm_script 里已按“进入大厅前”念。
    【板书】白板A第一案凶手位贴上【铃木美雪】名牌（与原凶手清水伊织并列为两个候选）。若这是玩家破解的第一个案件，按“说明四”揭下第二案（小林纪子）、第三案（宫本诚）的凶手名牌，提示玩家带着“铃木美雪 / 清水伊织”两个凶手去破解另外两案，看谁能完成。
- id: p3_06
  title: 第二重·加藤健一案·推理
  type: discuss
  minutes: 11
  dm_script: |
    第二案·加藤健一案
    Q1：结合旋转与升降两个功能，加藤健一所在的15号房间的密室是如何形成的？
    Q2：谁是唯一能够完成这一手法的凶手？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】
    【谜面回顾（玩家忘了可帮忙梳理）】女佣00:30来到餐厅看到死亡留言，朝隔壁加藤健一的房间看去，透过玻璃看到加藤健一趴在床上，并在玻璃书柜上看到了15号房钥匙。随即女佣来到15号房门口尝试开门，发现打不开，门上的小窗也是从内部上锁的。管家02:10召集众人搜身后进入15号房，在里边发现了已经死亡的加藤健一以及15号房钥匙。
    【第一重解答（伪解答）】凶手小林纪子，手法“拼钥匙+还钥匙”（书柜上是两把钥匙拼成的假钥匙，真钥匙在门外锁门，02:10搜身后借挂钩+旋转大厅把钥匙送回房间）。这一手法只有小林纪子能完成。
    【若玩家已破解其他案件】带着“铃木美雪 + 那一案原凶手”两个候选来检验本案：本案新手法要求“退出两次视频会议 + 人在走廊打视频”，只有铃木美雪满足。
    【标准答案】
    Q1 手法：卡门+复原。凶手24:00前杀死加藤健一，把15号房真钥匙放在玻璃书柜上出门（门没锁）→ 大厅旋转180度，让2号下翻门来到走廊地板孔洞的下方 → 下降大厅、打开2号下翻门、再上升大厅：因为门开着，大厅差5cm升不到原位（六角馆地板厚5cm）→ 15号房是外开门且与房间等高，于是被大厅天花板卡住，没锁也打不开；5cm高度差女佣看不出来 → 02:10管家开门前必须复原大厅：视频通话中，凶手坐在走廊孔洞处，伸手扶住2号下翻门门沿，第一次退出视频点下降后马上回到视频；门被手扶住获得向上拉力，10秒后自动合上，大厅在距走廊地板40cm处停止时再用手往回按一下，门彻底关上 → 第二次退出视频，快速上升大厅（约2秒）、旋转复位（5秒内），再回到视频。
    Q2 凶手：铃木美雪。若15号房内是真钥匙，门就没锁，只能用“天花板卡门”让女佣打不开；这种方式一定要复原大厅，而复原需要满足（1）退出两次视频会议、（2）人在走廊打视频，满足条件的只有铃木美雪（00:50-02:10她在走廊打视频）。
    【关键线索】走廊地板上的孔洞；15号房是外开门、门与房间等高；2号下翻门需要手动提拉，给一个向上的拉力10秒后自动合上，且还需再按一下；六角馆地板厚5cm；00:20-02:10六人均在视频通话；铃木美雪00:50-02:10在走廊打视频。
    【扶车方向】（按顺序逐步给）
    扶车Q1：15号门打不开的原因有什么？
    A：无非两种：（1）上锁了；（2）门被抵住了。
    如果是上锁了，那么女佣在房间内看到的钥匙就不可能是真钥匙，因为凶手无法在门外锁门后把钥匙送回来，那么凶手也只能是小林纪子，手法是拼钥匙，一切都没有改变。
    因此门只能是被抵住了打不开。15号门是外开门，馆内能抵住门的东西只有天花板（不存在随便搬个柜子放在门前的情况，毕竟女佣不是笨蛋）。所以需要考虑如何用天花板卡住门。
    扶车Q2：2号下翻门是需要手动提拉的，那么凶手在哪里能触碰到2号门？
    A：当2号下翻门处于开着的状态，且上升大厅卡住之后，凶手又不能在大厅内，那么能触碰到门的唯一地方就是走廊上的小孔了。而想要在孔洞处接触到门，就需要先旋转大厅。
    【玩家答疑】
    Q1：能否将大厅下降一点点卡住门？
    A：不可以。大厅不具备下降一点点的功能，要么降到距离走廊地板40cm的位置，要么降到底，过程中不可以停止。
    Q2：能否用储物柜之类的东西放在走廊上卡住大厅天花板？
    A：不可以。线索中提到过六角大厅升降的机械力非常大，不可被除DL-3合金以外的东西阻挡。馆内除了建筑本身，只剩下钥匙是DL-3合金的。储物柜是铁质的，放到走廊上会直接被压碎。
    Q3：能否就将大厅下降到底或者降到40cm的位置卡住15号门？
    A：不可以。如果降到40cm的位置，女佣出门甚至还需要跨一个40cm高的台阶才能来到走廊，一定会发现。降到底也不行，因为女佣出门后会发现大厅消失了，她可以直接仰望星空。
- id: p3_07
  title: 第二重·加藤健一案·答案揭晓
  type: narration
  minutes: 4
  dm_script: |
    加藤健一案——案件复盘。
    作案手法破解：
    本案的手法总结：卡门+复原。
    凶手24:00前杀死加藤健一，杀人手法不变，随后将15号房的真钥匙放在玻璃书柜上，出门。
    旋转六角大厅180度，让2号下翻门来到走廊地板的孔洞处。
    进入六角大厅，下降六角大厅，将2号下翻门打开，随后将六角大厅上升复原。但是因为此时2号下翻门是开着的状态，所以大厅无法上升到原位，也就是大厅天花板会比原位置低5cm。（六角馆地板厚5cm）
    做完上述行为后，因为15号房是外开门，且房门与房间等高，所以大厅的天花板就卡住了15号房门。因此这扇门虽然没锁，但依然打不开。并且因为只有5cm的高度差，女佣出门的时候是看不出来的。
    但这么做还不够，因为管家02:10的时候召集众人并打开了15号门，所以凶手还需要在此之前复原大厅。
    复原大厅就一定需要去关2号下翻门，而门是无法用手机操控的，必须手动去给门一个拉力，但女佣00:30确认密室后，所有人都在打视频电话，所以问题就转化为了：如何在打视频电话的过程中复原大厅。
    复原方法：
    凶手坐在走廊的孔洞处，因为提前就将大厅旋转了180度，此时2号下翻门就在孔洞的下方，因此将手从孔洞伸出去，就可以碰到2号下翻门的门沿（注意是门沿，不是门把手，因为门把手在5m宽的门的中间，够不着）。
    凶手用手扶住门沿，然后退出视频会议，点击下降按钮（大厅的下降速度可以很快，此时大厅内没有人），点完之后重新进入视频（第一次退出）。
    大厅此刻会开始下降，但是因为手扶着门，门很轻，所以门一开始不会下降，由此就给门施加了一个向上的拉力，线索中介绍过，给下翻门施加一个向上的拉力，门就会在10s后自动合上。
    当大厅下降到距离走廊地板40cm的时候会自动停止，因为下翻门高度只有9.5m，所以此刻门已经自动合上了，只需要再用手往回按一下（这一下必须按，线索中也提及了需要按，否则门会重新倒下来），门就彻底关上了。
    2号下翻门关上后，凶手再次退出视频会议（第二次退出），上升大厅，此时大厅内没有人，可以非常快速地上升，例如2s就上升到原位，然后旋转大厅复位，同样旋转得很快，5s内复原大厅，然后重新进入视频会议即可。
    凶手锁定：
    如果15号房内的钥匙是真钥匙，那么门一定没有上锁，就需要用到“天花板卡门”的方式让女佣打不开门，但是这种方式一定需要复原大厅，而复原大厅需要满足两个条件：（1）退出两次视频会议（2）人在走廊打视频
    满足上述两个条件的人只有铃木美雪，所以锁凶铃木美雪。
  dm_notes: |
    【模型演示】此环节同样可用模型给玩家演示（也可用磁吸贴+画图）：①大厅旋转180度，2号下翻门对准走廊地板的孔洞下方；②大厅下降、打开2号下翻门；③上升大厅，展示因为门开着、被5cm厚的六角馆地板挡住，大厅天花板比原位置低5cm升不上去，从而卡住朝走廊开的15号房门；④演示复原：手从孔洞伸下去扶住门沿→点下降（大厅下降、门被手扶住获得向上拉力，10秒后自动合上）→大厅停在距走廊地板40cm处时再按一下门→上升、旋转复位。
    （手册此处配有一张模型照片和两张侧视示意图：①“因为六角馆地板有5cm厚度，导致天花板距离原位置有5cm上不去”“地板厚度5cm”，旁注“此环节同样可用模型给玩家演示”；②标注“走廊地板上的孔洞”，2号下翻门斜挂在大厅下方，“给门施加了向上的拉力后，门会在10s后自动合上”。）
    【板书】白板A第二案凶手位贴上【铃木美雪】名牌。若这是玩家破解的第一个案件，按“说明四”揭下第一案（清水伊织）、第三案（宫本诚）的凶手名牌，候选为“铃木美雪 / 小林纪子”；若已破解过其他案件，则另一候选在本案被排除。
- id: p3_08
  title: 第二重·渡边翔太案·推理
  type: discuss
  minutes: 9
  dm_script: |
    第三案·渡边翔太案
    Q1：结合旋转与升降两个功能，管家所在的仓库“反向密室”是如何形成的？
    Q2：谁是唯一能够完成这一手法的凶手？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】
    【谜面回顾（玩家忘了可帮忙梳理）】管家02:10在仓库醒来，巡视一圈后确认房内没有人，尝试开门却发现打不开，然后在尸体身上找到一把1号房也就是仓库的钥匙。谜面：凶手不在仓库内，管家所在的反向密室是如何形成的？
    【第一重解答（伪解答）】凶手宫本诚，手法“伪造仓库”（用3号、4号大厅门和储物柜在走廊上伪造出一个假仓库）。这一手法只有宫本诚能完成。本重的谜面非常绝对：如果凶手不是宫本诚，就不能伪造假仓库，管家醒来的地方就一定是真仓库——真仓库+真钥匙+凶手不在仓库内+内开门，管家为什么打不开门？
    【若玩家已破解其他案件】带着“铃木美雪 + 那一案原凶手”两个候选来检验本案：抽真空要求走廊保持封闭，铃木美雪日记“02:00-02:15开着房门”是谎言 → 只有她能是凶手。
    【标准答案】
    Q1 手法：抽真空制造气压差。凶手22点前杀死渡边翔太 → 01:00打晕管家，把管家和尸体都放进（真）仓库 → 凶手回自己房间关上房门，将大厅降到底，用小六APP关闭走廊上的孔洞（走廊再无进气通道）→ 上升大厅，整个六角馆就像堵住针头的针筒，走廊被抽成近似真空 → 02:10管家醒来，仓库内气压远大于走廊，内开的仓库门纹丝不动（此时所有内开门都打不开）→ 管家找到钥匙后凶手把他迷晕，打开孔洞恢复气压再关闭，出门把管家送回他的房间。
    Q2 凶手：铃木美雪。抽真空要求走廊保持封闭，而铃木美雪日记说02:00-02:15她开着房门；如果她真开着门，大厅上升抽真空时空气会从她房间的上边进入房间、再从房间下边进入走廊，抽了等于没抽 → 她在撒谎 → 锁凶铃木美雪。
    【关键线索】DL-3合金接触后无缝隙、气密性非常好；学生们日记里都写过在房间内常感觉很闷、要来走廊透气；小六APP可开关走廊地板上的孔洞；开门需要上提门把手；宫本诚22:00-02:20在大厅内；铃木美雪日记“02:00-02:15开着房门”。
    【扶车方向】（按顺序逐步给）
    扶车Q1：仓库门到底有没有上锁？
    A：如果本案凶手不是宫本诚，那么管家就在真仓库，钥匙在仓库内，凶手不在仓库内，那么门一定没锁——因为凶手在外边锁门后钥匙不可能送进来，仓库在锁门后没有任何通向外界的通道。
    那么如果门没锁，管家却打不开，一定是有某种力把门牢牢固定住了，使管家拉的时候纹丝不动，而这个力管家也排除了是人力的可能性。
    扶车Q2：什么样的力可以使管家拉不开内开门？结合DL-3合金的特点。
    A：线索一开始提到过，DL-3合金接触后无缝隙，气密性非常好。每位学生也都在日记中写到过，在房间内时常感觉很闷，要来走廊透气。
    内开门拉不开，一定是有一个足够稳定且巨大的力固定住了门。馆内没有任何可以绑在门上的东西，门上也没有可以绑东西的部位，那么这个力便只能来自气压了。
    最后需要考虑的就是：如此巨大的气压差如何营造？（仓库内气压大，走廊气压小）
    【玩家答疑】
    Q1：气压差带来的阻力能够使管家拉不动门吗？
    A：一定可以，且绰绰有余。走廊面积812平方米，体积8120立方米；仓库面积157平方米，体积1570立方米。当走廊为真空状态时，一扇5×10米的门，门把手在中间位置（力矩2.5米），想要拉动这扇门大约需要500多吨的力，这不是人力可及的。由此也可以得出，凶手其实都不需要营造整个走廊的全真空，只需要把走廊气压降到一定程度，使人力无法拉开门即可。
    Q2：升降的机械力真的能将整个走廊抽真空吗？
    A：参考上一问题，实际上凶手无需将整个走廊抽真空，只需将大厅下降到一定程度（不降到底），然后关闭孔洞，再转为上升大厅即可，只要营造出一个管家完全拉不动的力就行。
    Q3：宫本诚在大厅内不会受影响吗？大厅门会不会被强行拉开？
    A：已知升降速度够慢，大厅内的人就不会感觉到。凶手在01:00之后有足够的时间操作，缓慢上升即可，宫本诚感觉不到。
    而线索中说过，开门需要上提门把手门才能被打开，可以理解为不上提门把手的话锁舌是伸出的状态，DL-3合金足够坚固，不管怎么样门都不会被强行拉开。
- id: p3_09
  title: 第二重·渡边翔太案·答案揭晓
  type: narration
  minutes: 4
  dm_script: |
    渡边翔太案——案件复盘。
    作案手法破解：
    本案的手法总结：抽真空制造气压差。
    本案的谜面在这一重非常绝对，因为如果凶手不是宫本诚，那么就不能伪造假的仓库，管家醒来的地方就一定是真仓库。
    真仓库+真钥匙+凶手不在仓库内+内开门，那么管家为什么打不开门？
    凶手同样在22点前杀死死者。
    01:00打晕管家，将管家和尸体都放到仓库内。
    凶手回到自己房间，关上房门，然后将大厅下降到底，然后用小六APP关闭走廊上的孔洞，此时走廊没有了任何可以进入空气的通道。
    做完上述流程后，凶手上升大厅，此刻整个六角馆就像是一个巨大的堵住了针头的针筒，走廊被抽成了近似全真空的状态。
    管家02:10醒来后，尝试开仓库的门，因为此时走廊是近似真空状态，仓库内的气压远大于走廊的气压，所以管家不可能拉得开仓库门，一定是纹丝不动的，此处气压差所带来的力已经不是人力可及的了。
    实际上，02:10不仅是仓库门打不开，所有的内开门都打不开了。
    随后当管家找到钥匙后，将管家迷晕，操控孔洞开启，空气就会重新进入走廊，恢复气压，再之后关闭孔洞。然后凶手出门将管家送回他的房间。
    凶手锁定：
    如果要使用将走廊抽真空的方式使管家打不开门，那么走廊需要保持封闭状态，但是铃木美雪在日记中说02:00—02:15她开着房门，这是不可能的，因为如果她开着门，大厅上升抽真空的过程中，空气会从她房间的上边进入房间，再从房间下边进入走廊，抽了等于没抽，所以锁凶铃木美雪。
  dm_notes: |
    【模型演示（可选）】手册本案未特别要求模型演示；如玩家不理解“针筒”原理，可用模型演示：大厅降到底 → 关闭走廊孔洞 → 缓慢上升大厅（大厅相当于针筒活塞，走廊被抽成近似真空），并配合白板画图说明仓库与走廊的气压差。
    【板书】白板A第三案凶手位贴上【铃木美雪】名牌。三案全部复盘完毕后，白板A三起案件的凶手都应是铃木美雪。
    【白板A·本阶段结束·板书参考】
    左上标题：一年前·六角馆·雾岛（漂浮岛往西30度）
