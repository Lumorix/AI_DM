    【作者后记·只给主持人看，不要念给玩家】手册第167页是作者写给主持人的后记（文中的“您”指学习手册的主持人），不是对玩家说的话，不要放进 dm_script，也不要改写成结束语念出来。原文：
      勇敢的少年啊，以这想象力为刃，去斩杀恶龙吧！
      感谢您认真学习至此，很开心与您在此重逢。
      正如我们在《时针岛》时所说：
      在【本格密室】逐渐式微的今天，其到底还能往什么方向做出艰难的突破呢？
      回答我们的依然是———想象力。
      当逻辑沉睡时，想象力便点亮了整片黑夜。
      《六角馆》就像是拿着新手村武器却要叫嚣着斩下恶龙头颅的固执小孩，他的勇气，他的偏执，他的爱与恨，在文字下悄然而生。
      本作或许没有“炸裂的核心诡计”，或许没有做到您心目中“满分”作品该做到的一切。
      但文字之下，皆是我们的热爱与真诚。
      最后，希望您在《六角馆》中能够收获快乐，希望您能喜欢《六角馆》。
      新井直人，回见。
      名侦探，回见。
      贝塔β
      2025年5月25日
