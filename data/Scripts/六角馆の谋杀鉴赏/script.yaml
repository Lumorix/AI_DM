- id: p7_15
  title: 我就是你の幽灵·故事总结
  type: narration
  minutes: 1
  dm_script: |
    阅读完我的故事，或许各位已经了解了。
    我杀害那些人，一方面是为我的爱人长泽悠纪复仇，另一方面，我想要完成我与她共同写下的这本推理小说——《长谷川献给悠纪の殺人》。
    至于去年六角馆内的女佣与管家，其实本就是我花钱雇用的绝症患者，因此各位在之前或许会觉得他们的行为有那么多的巧合性，实际上，那都是我的安排，同时也是这本推理小说中的情节。
    感谢各位侦探，感谢你们。
    你们，真的很优秀！
    能和你们对决，是我长谷川悠人的荣幸。
  dm_notes: |
    所有玩家读完【我就是你の幽灵】后再念本段。
    如有玩过《时针岛》的玩家，可在此提一下第26页书店老板的彩蛋（见上一阶段说明）。
    念完后进入【收束】。
