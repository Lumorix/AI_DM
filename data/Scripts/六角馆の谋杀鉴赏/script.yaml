meta:
  title: 六角馆の谋杀鉴赏
  players: 6
  intro: 新本格纯推理（还原10:0，约7~9小时）。六位名侦探受神秘主办人之邀，前往孤岛参加一场“推理大会”——推理一年前的“六角馆无人生还事件”，而新的案件正在岛上发生。玩家都是侦探，没有投票选凶环节；人物剧本、线索册、日记等请使用纸质物料。
dm:
  truth: |
    【总览】多重解答：前面的“答案”会被后面一层层推翻。每个阶段只能按当时的结论回答，后面的反转绝不能提前说或暗示（具体到哪一步可以说什么，以各阶段主持提示为准）。
    三层结构：①推理大会（山口麻衣主持）推出一系列伪解答，结论是“铃木美雪是主办人兼真凶，最后在船上自焚”；②鉴赏大会（长谷川悠人主持，十幅“谋杀作品”）逐一推翻，结论是“长谷川是所有案件的凶手”；③收束：山本阳介其实是吉田和真杀的，长谷川为了小说“凶手只能有一个人”认下了它。
    一句话真相：一年前六角馆无人生还事件和今年岛上的命案，策划者都是长谷川悠人（去年化名坂田仓介），为已故爱人长泽悠纪复仇，并“写完”两人合写的推理小说《长谷川献给悠纪の殺人》；唯一例外是山本阳介（吉田和真所杀）。

    【人物】推理大会12人：6名侦探（玩家）+ 长谷川悠人（新井直人的助手、头号粉丝，去年10月中旬入职；真正的主办人）+ 山口麻衣（主办人指定的代表，自己也没见过主办人，从没撒过谎）+ 复仇目标佐藤光一、吉田和真、山本阳介、中村健。吉田和真以做过手术为由遮住面容、声音辨不出性别，但他是真实的另一个人（不是铃木美雪）。铃木美雪去年就被长谷川杀死，尸体经防腐存放在现存的六角馆里。去年六角馆的管家、女佣是长谷川雇来的绝症患者。
    序幕里想复仇的“黑影人”：伪解答是铃木美雪（转的是六角大厅），真解答是长谷川（转的是整座六角馆，馆在环形轨道上滑行）。

    【破冰案】（去年同一天，松岛集团）DL-4炸弹失窃：清洁工（即坂田/长谷川）利用只能顺时针转1/6的旋转区空转伪造按钮记录、借桐生凉平按的按钮移动、用旋转区把炸弹“运”到会议室位，空手过监控后从会议室窗户取走，14:00前离开。漂浮岛坐标泄漏：西电到8楼并预按12楼，叫东电后爬楼梯到10楼，坐东电下8楼赶上返程的西电回1楼，共240秒。

    【一年前·六角馆（雾岛）】推理社6人（日记主人：小林纪子、坂田仓介、池田孝太、清水伊织、宫本诚、铃木美雪）+ 戏剧社死者山田莉子（9/1）、加藤健一（9/2）、渡边翔太（9/3）。大会规则：凶手在6名日记主人中，只有凶手会在行凶当天撒谎。
    · 第一重（大厅能旋转）：清水伊织（旋转误导管家去5号空房）／小林纪子（两把钥匙拼成假15号钥匙，挂钩+旋转取回真钥匙）／宫本诚（大厅门围出“假仓库”）。
    · 第二重（大厅还能升降）：三案都是铃木美雪——储物柜当梯子从8m裂缝扔回钥匙；大厅差5cm升不回原位卡住15号外开门；封闭孔洞升大厅抽真空。
    · 真解答（鉴赏大会第三～七幅）：雾岛上有两座一模一样的六角馆（A馆：小林纪子、池田孝太、清水伊织、加藤健一；B馆：铃木美雪、坂田仓介、宫本诚、山田莉子、渡边翔太），各有一名管家女佣，岛上实际13人，两馆可沿环形轨道移动、整座升降。三案凶手都是坂田仓介：山田莉子——A馆下翻门插进B馆裂缝撑住铁链，视频断线5秒挪走A馆；加藤健一——两馆叠放，A馆自身大厅天花板卡住15号外开门，B馆大厅伪装成A馆大厅；渡边翔太——仓库密室用A馆1号钥匙，死于02:30–03:30，宫本诚看到的“IV”是大厅4号门的灯；加藤尸体消失——挂在大厅外墙挂钩，搜查时两次各转180度。
    · 第一幅：用DL-4卫星遥控器从日本远程引爆六角馆（新井直人是不在场证人）。第二幅：坂田是社团“活动策划”，与高木凛单线联系，调换手机号改变参观顺序（坂田第五个，小林纪子第六个，“××子”不一定是女性）；高木凛14:50翻转了坐标便签：真漂浮岛8-150，众人所在的8-120是雾岛。渔民看到的11具尸体靠另一座馆的管家女佣补足。

    【今年·岛上（实为雾岛）】
    · 10/31 佐藤光一航行中摘手环身亡；下船前长谷川在船上斩首他（第八幅《斩首迅速》：钟柜搬进空房间转180度，门开45度，新井直人从门后等身镜看到左右颠倒的“11:20”，真实是11:50；长谷川摔杯子弄醒他），头装进从不离身的双肩包。
    · 11/1 中村健案：推理大会结论是“山口麻衣不可能，长谷川或吉田和真可能”（麻衣恐血、四角屋转45°让出南北新路径）。真解答（第八幅先导）：雾岛天气记录比真实晚10分钟，真实雨时07:20–07:50、09:50–09:51、10:25–10:30、10:35–10:40；长谷川用“第二颗人头”（佐藤光一的头）吓跑麻衣，09:55–10:15斩首中村健换上真头，回程脚印被10:25–10:30的真实第三场雨冲掉。
    · 11/2 山本阳介案：推理大会伪解答是“漂浮岛是躺倒的圆柱体滚动”。真解答（第九幅《透明人死于密室》）：长谷川把四角屋转180度，众人走西侧小路，第一次发现的“弹珠密室”在被移到岛西的六角馆（环形滑轨加减速让弹珠滚到门边），那具男尸是吉田和真；回去取钥匙时转回四角屋，第二次到的才是真六角屋（山本阳介）。
    · 11/3 船上：推理大会伪解答是“吉田和真就是铃木美雪，她用孔洞探头的手法假死后自焚”。真解答（第十幅《死者不会沉睡》）：凌晨六角馆经水下轨道把地平线号抬起藏进馆内（大厅高10m，船高8m），12:00–12:40长谷川“自证清白”被关进的其实是六角馆，亲手把吉田和真的尸体放进储物间并设置点火装置；断臂焦尸是吉田和真；铃木美雪的头只是一颗头；佐藤光一的无头尸被移进六角馆。
    · 终章：长谷川从“送给最优秀侦探的小盒子”里拿出手枪打伤小岛浩一的肩膀，身份曝光，鉴赏大会开始。
    · 收束（13问）：山本阳介伤口有二次贯穿痕迹；外套花粉只能是10/31 11–12点（船经过镜湖半岛）沾上；立柜（即第八幅的钟柜）被倒转过，沾上花粉的是明智邦彦的外套，因为明智曾披过山本阳介的外套；花粉在外侧后背→凶手把外套翻面重穿→破口与伤口对不上→死者中刀时外套穿在身前→那时长谷川有完美不在场证明→杀死山本阳介的是唯一没有不在场证明的吉田和真；长谷川认下它，是为了完成爱人的心愿：一部优秀的推理小说，凶手只能有一个人。
  style: |
    本作是“多案件、多重解答”的新本格纯推理，玩家全是侦探，没有“谁是凶手”的投票。
    主持人前半程扮演“山口麻衣”（推理大会组织者，主办人指定的代表，她本人也没见过主办人；正常推进流程即可，不必刻意演绎）。从第五部分“鉴赏大会·长谷川登场”起扮演“长谷川悠人”：活泼、话痨、有点中二、热爱诡计，每次抛出谜面都要“装”一点、帅一点，用角色名和玩家互动；但绝对不要真的给玩家压力。
    玩家讨论出错误结论时，先听完他们的想法，再结合线索给出合理的否定。每个案件的答案只在“答案揭晓”阶段公布；推理阶段只能按主持提示里的扶车方向一步一步提示，玩家没说出来之前绝不直接给答案。
    日记、档案册、线索册、调查档案、我的谋杀作品、大卡等都是玩家手里的纸质物料，你看不到原文：涉及原文时请玩家翻看手里的物料，绝对不要编造原文。模型的尺寸不是等比例的，数据一律以线索册为准。
    推理须有迹可循：不能凭空假设多一具尸体、一个神秘人X或者没出现过的道具；不需要考虑动机、时差和时区。
    收束的13问环节，手册写的是主持人以“新井直人”的身份带领推理，可以邀请扮演新井直人的玩家一起主导；每问1~2分钟答不出就提示，仍答不出就让大家翻下一页。
    第八幅之前的“头颅之选”如果玩家选吉田和真，主持人会先跳到第九幅、再回到第八幅，按主持台的阶段顺序跟随即可。
