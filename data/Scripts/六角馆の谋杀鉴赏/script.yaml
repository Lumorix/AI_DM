- id: p4_07
  title: 中村健案·推理
  type: discuss
  minutes: 19
  dm_script: |
    本案问题：以长谷川悠人或者山口麻衣作为凶手，推理他们两人中谁可以杀死中村健并将他斩首，同时还需证明另一人为什么不行！
    注意！假设谁为凶手的话，那么他的口供自然便可以撒谎了，但同时也代表着另一人所说为真，那么凶手在地上留下的脚印，一定需要满足另一人所看到的那样（脚印不存在倒走、覆盖、掩盖、换鞋、不连贯等，一定是正常走）。
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】

    ■ 标准答案（结论）
    - 山口麻衣：无论如何都无法作案。
    - 长谷川悠人：可以作案（不需要第二颗头）。本案的凶手可能是长谷川悠人，也可能是早已消失的吉田和真。
    - 长谷川的关键：①利用麻衣"恐血"的人设，把头放在木屋1门口、自己躲在屋内；②出门前把四角屋旋转180°误导麻衣的方向；③把四角屋旋转45°后停住，四角屋旁会多出一条连通南北的"新路径"（宽约1.25米），不进四角屋也能穿行南北。

    ■ 已知条件（来自调查档案/口供/人物剧本，实体物料在玩家手里）
    - 今早7点起，除吉田和真、长谷川、中村健、山口麻衣外，6名玩家都在六角屋内，有绝对不在场证明。
    - 中村健07:10还活着（07:10离开四角屋，约07:20到木屋1）。
    - 长谷川与山口麻衣一共分开过两次：第一次07:45—08:35；第二次09:00之后。
    - 长谷川口供（他若是凶手则可撒谎）：09:00出发前往木屋1，途中没有看到任何脚印；09:10看到中村健的头颅；09:30在四角屋内被凶手打晕。
    - 山口麻衣口供（主持人扮演的角色，从始至终没撒谎）：09:00去南侧木屋2，看到南侧来回脚印；在木屋2上了5分钟厕所；09:25穿过四角屋往北，看到北侧来回脚印；09:35到木屋1门口看到人头（恐血，不敢靠近），09:45从四角屋出发去六角屋，10:05到六角屋通知众人。
    - 众人10:05从六角屋出发，10:25新井直人搀扶着长谷川跟众人进入四角屋；10:30众人从四角屋去木屋1，路上没有看到任何脚印。
    - 铁打基点：众人10:40到木屋1检查时，确认此头颅一定是中村健（调查档案第一条）；木屋1一定是斩首现场（调查档案第四条）。
    - 下雨：07:30—08:00、10:00—10:01、10:35—10:40、10:45—10:50。下雨冲掉所有脚印，雨中行走不留脚印。
    - 距离：四角屋↔木屋1/木屋2 单程10分钟；四角屋↔六角屋 单程20分钟；西侧小路往返40分钟。斩首固定20分钟。
    - 四角屋：可旋转（顺/逆时针皆可，可随时停止，匀速，5分钟转一圈），门上无方位标注；四角屋与路宽都是6米。

    ■ 山口麻衣无法作案的逻辑
    A. 假设麻衣没有第二颗头：
      逻辑1：长谷川09:10看到的头一定是中村健的；09:00—09:10麻衣无法完成20分钟的斩首，所以麻衣只能在07:45—08:35斩首（木屋1是斩首现场，她必须07:45后去木屋1）。
        07:45—07:55 四角屋→木屋1，开始斩首｜无脚印（在下雨）
        07:55—08:15 斩首完成｜无脚印（没走路）
        08:15—08:25 木屋1→四角屋｜留下北侧回来的脚印（雨停了）
      逻辑2：一定会留下北侧木屋1回四角屋的脚印，而长谷川说09:00去木屋1途中没看到任何脚印 → 矛盾。
      逻辑3：若长谷川09:00被误导去了南边？那要看他07:45第一次出门去哪边——他第一次不管去哪边都会留下自己的来回脚印，而第二次说没看到任何脚印，所以两次不能是同一边。第二次去南 → 第一次去北。
      逻辑4（终点）：长谷川第一次去北，人就在木屋1里，麻衣不可能在木屋1内斩首！→ 麻衣无法作案。
    B. 假设麻衣提前准备了第二颗头（只在玩家自己提出时讨论）：
      逻辑1：第二颗头的唯一作用，是让长谷川09:10看到的头不是中村健本人，麻衣在09:00之后再斩首。
      逻辑2：长谷川09:00只能去南。若他去北，两人同时出发，麻衣不能跟在他身后；等他09:20回到四角屋再出发，09:30到木屋1、09:50斩首完、10:00回四角屋，赶不上10:05到六角屋通知众人。
      逻辑3：长谷川第二次去南 → 第一次去北。于是：①长谷川09:10在南侧木屋2看到的头只能是麻衣很早就放好的第二颗头（三人07:00来了之后没有时间去放）；②长谷川第一次去北会在木屋1遇见中村健，所以麻衣必须误导中村健的方向——不能去木屋2（会看到头立刻折返），东侧是六角屋会与他人会合，所以只能误导去西侧。
      逻辑4：中村健07:10去西侧，走到尽头只有楼梯，只能折返，约07:50回到四角屋；长谷川07:45被误导在四角屋北侧门口抽烟，麻衣去西侧打晕中村健（不能杀，木屋1是第一现场）；09:00长谷川去南，麻衣搬中村健去北侧木屋1，09:10杀死并斩首，09:30斩首完成，09:40回四角屋。
      逻辑5（终点）：长谷川09:30在四角屋内被打晕！此时麻衣还在木屋1，回来还需10分钟，不可能打晕长谷川 → 悖论。（中村健会否自己折返、麻衣搬不搬得动都只是先假设成立，即使都成立仍无法作案。）
    C. 逻辑总结（玩家先推出长谷川、不想推麻衣时，可直接讲这两点）：
      1. 长谷川09:00出门时没看到任何脚印 → 两次出门一定方向不同，同时证明麻衣无法在07:45—08:35斩首：第一次南、第二次北会看到麻衣的脚印；第一次北则长谷川人在木屋1，麻衣无法在此斩首。
      2. 长谷川09:30在四角屋被打晕 → 麻衣无法09:00出发去斩首（往返20分钟+斩首20分钟，最早09:40才回到四角屋）；也不能09:30打晕长谷川后再去斩首（来不及10:05通知众人）。
      即使玩家先推出长谷川能作案（正确解答），也依然需要推理麻衣能否作案，因为本案是可能性推理。

    ■ 长谷川的作案动线（正解）
    时间        ｜长谷川动线                                       ｜长谷川脚印  ｜山口麻衣动线
    07:45前     ｜把四角屋旋转180°                                 ｜—           ｜在四角屋内
    07:45—07:55｜从麻衣认知中的"南门"出去，实际去北侧，到达木屋1 ｜无（下雨）  ｜在四角屋内
    07:55—08:00｜在木屋1杀害中村健，不斩首，原地等雨停            ｜无          ｜在四角屋内
