characters:
- id: daotian
  name: 岛田琉璃
  public: 干练、讲究“优雅”的女侦探。去年在“时针岛事件”中与北山、明智、相泽、新井结识，常常吐槽明智是“半吊子侦探”。
  secret_brief: 本作私人视角极少（约5%），岛田琉璃的推理信息与其他侦探相同；个人剧本细节以她手里的纸质角色本为准。
  book:
    小剧场一: |
      小岛浩一：你们这些年轻人啊，居然让我这么一位上了年纪的老头子主动等你们这么久，是不是有些不太礼貌了啊？
      相泽翡翠：喂，大叔，你也才三十多岁嘛！怎么就成一把年纪了呢？
      北山诚一：这位前辈，我知道你对我们这些年轻侦探存在一些成见，但这次可否先暂时放下这些，让我们平和地度过接下来的这段时光呢？
      明智邦彦：对对对！北山兄说的太对了！那句话怎么说来着，peace and love嘛！而且呀大叔，总有人说你的风光是被我们这些新人夺走，我们也不是故意的呀！况且我觉得还有一种可能，也许不是我们太强，而是你太cai……
      明智邦彦话还没说完，就被岛田琉璃从身后狠狠敲了一下脑袋。
      明智邦彦：哎！岛田小姐你敲我干什么！
      岛田琉璃：大家招呼也都打的差不多了，我们可否进入正题了呢？
      岛田琉璃说完，便狠狠瞪了明智邦彦一眼。
      山口麻衣：好了，大家不要吵了，在出发前你们必须先破解这两起案件。主办人说了，这算是对你们的一个初步考验。还有，各位请不要掉以轻心，因为这两起案件可能与之后的推理大会还存在着一些关联…
      新井直人：已经迫不及待了，山口小姐，我们快开始吧。
    小剧场二: |
      山口麻衣：恭喜各位侦探完成了推理大会第一阶段的挑战，但关于六角馆无人生还事件的推理并未结束。
      相泽翡翠：还没结束？难道我们的推理存在什么问题吗？
      山口麻衣：是的，你们的推理固然精彩，但那并不是最终的真相！事实上，六角馆三起案件的凶手——均为同一人！
      明智邦彦：什么？！同一人作案？这怎么可能！
      山口麻衣：事实就是这样的，各位侦探一直忽略掉了一个细节。
      新井直人：忽略的细节吗？你是说……
      山口麻衣：没错，实际上，六角馆除了旋转外，还具备另外一个功能！
      相泽翡翠：另外一个功能！那你为什么不早说呢？这是在耍我们吗？
      岛田琉璃：山口小姐，这样的推理大会，一、点、也、不、优、雅。
      山口麻衣：抱歉各位，但这本就是主办人所设计的流程，而刻意隐瞒也是想看看各位侦探的观察能力。至于另一个功能，你们是否还记得日记中曾经提到过，六角馆门口被安置了炸弹……
      小岛浩一：当然记得，并且日记中提到他们推理社的6人都进行了确认，门口确实有触发式炸弹，六角馆的大门在后续5天将不能再被打开。
      山口麻衣：没错！可是各位有没有想过一个违和的问题，在那张写有‘门口安置了炸弹’的纸条被发现的那一刻开始，六角馆大门就已经不能再打开了，而整个六角馆没有任何‘窗户’存在，那么……
      新井直人：你是想说，从纸条被发现那一刻开始，众人就已经无法再走出建筑或者看到外界的一切了，那他们是如何确认建筑外的炸弹是否真正存在的？
      山口麻衣：正是如此。给大家一些提示吧，还记得一开始我便告知过各位，最初的两起案件《炸弹失窃案》和《坐标泄漏案》与后续的推理存在着关联，建筑的旋转功能可以视为《炸弹失窃案》的关联，而《坐标泄漏案》……
      北山诚一：山口小姐，我想我已经知道了您的暗喻，如果六角馆有着那样的功能，一切就都变得有趣了。
      明智邦彦：北山先生，你怎么又装起来了？又打哑谜！！是什么你倒是说出来啊？！！
      北山诚一：明智先生还请稍安勿躁，我认为比起一开始就把这些‘设定’怼到脸上，推理出设定的过程本身才是一件有趣的事情呢！
      小岛浩一：有趣与否先不谈，现实中也不会有人把所有的现场条件全部写到纸上，侦探存在的意义就是发现常人无法发现之处！确实是我们忽略了这个细节。
      岛田琉璃：明智邦彦看到没，你这半吊子侦探，好好学学大叔的觉悟吧！
      相泽翡翠：回到刚才的话题吧，馆里的众人在确认炸弹存在之后并没有离开六角馆，是不是可以说明，另一个功能只能帮助他们看到外界，但是却无法走出建筑？
      小岛浩一：我想也是如此，如果能离开，没人愿意留在随时可能葬身的险地，而六角大厅能够旋转，说明‘大厅’本身就是跟整个馆是半分离状态，而根据刚才山口小姐的提醒来看，《坐标泄漏案》的核心元素无非是‘电梯运动轨迹’，我猜测六角馆的另一个功能便与此相关吧？
      山口麻衣：真是厉害，我只是稍加提醒，各位就能接近真相了！那么接下来将为各位揭晓，六角馆的另一个功能——升降！
      山口麻衣说完，便拿出了一张大卡摆在了众人面前。
      明智邦彦：难道这就是传说中的【后置线索】？
    小剧场三: |
      北山诚一：这么来看，很明显吉田和真就是主要嫌疑人了。
      新井直人：因为他早早就不见了踪影，所以完全可以躲在众人的视野盲点中，对吧。
      相泽翡翠：没错，他完全可以在今早下雨前就躲在木屋1中，等待动手的时机。
      岛田琉璃：等7:20中村健去到木屋1后，吉田和真就杀死对方，并斩下对方的头颅，然后将头颅扔到木屋门前。
      明智邦彦：之后他就去到四角屋西侧。等长谷川悠人来到西侧小路后打晕长谷川，就是这么回事嘛，看来大家的想法都一样。
      小岛浩一：不，不对。根据长谷川悠人与山口麻衣的口供来看，他们两人中同样有一人具备作案的可能，比起不见踪影的吉田和真，我更愿意相信凶手在他们两人中。
      （众人面面相觑，似乎不愿相信小岛浩一的说法。）
      小岛浩一：我这么说，自然有我的道理。我将在20分钟后说出我关于‘凶手在他们两人中’的推理，不知道是否有人跟我看法一致。
      众人：……
- id: xiangze
  name: 相泽翡翠
  public: 直爽、爱吐槽的女侦探，“时针岛事件”的亲历者之一。最讨厌组织者藏着掖着。
  secret_brief: 本作私人视角极少（约5%），推理信息与其他侦探相同；个人剧本细节以纸质角色本为准。
  book:
    小剧场一: |
      小岛浩一：你们这些年轻人啊，居然让我这么一位上了年纪的老头子主动等你们这么久，是不是有些不太礼貌了啊？
      相泽翡翠：喂，大叔，你也才三十多岁嘛！怎么就成一把年纪了呢？
      北山诚一：这位前辈，我知道你对我们这些年轻侦探存在一些成见，但这次可否先暂时放下这些，让我们平和地度过接下来的这段时光呢？
      明智邦彦：对对对！北山兄说的太对了！那句话怎么说来着，peace and love嘛！而且呀大叔，总有人说你的风光是被我们这些新人夺走，我们也不是故意的呀！况且我觉得还有一种可能，也许不是我们太强，而是你太cai……
      明智邦彦话还没说完，就被岛田琉璃从身后狠狠敲了一下脑袋。
      明智邦彦：哎！岛田小姐你敲我干什么！
      岛田琉璃：大家招呼也都打的差不多了，我们可否进入正题了呢？
      岛田琉璃说完，便狠狠瞪了明智邦彦一眼。
      山口麻衣：好了，大家不要吵了，在出发前你们必须先破解这两起案件。主办人说了，这算是对你们的一个初步考验。还有，各位请不要掉以轻心，因为这两起案件可能与之后的推理大会还存在着一些关联…
      新井直人：已经迫不及待了，山口小姐，我们快开始吧。
    小剧场二: |
      山口麻衣：恭喜各位侦探完成了推理大会第一阶段的挑战，但关于六角馆无人生还事件的推理并未结束。
      相泽翡翠：还没结束？难道我们的推理存在什么问题吗？
      山口麻衣：是的，你们的推理固然精彩，但那并不是最终的真相！事实上，六角馆三起案件的凶手——均为同一人！
      明智邦彦：什么？！同一人作案？这怎么可能！
      山口麻衣：事实就是这样的，各位侦探一直忽略掉了一个细节。
      新井直人：忽略的细节吗？你是说……
      山口麻衣：没错，实际上，六角馆除了旋转外，还具备另外一个功能！
      相泽翡翠：另外一个功能！那你为什么不早说呢？这是在耍我们吗？
      岛田琉璃：山口小姐，这样的推理大会，一、点、也、不、优、雅。
      山口麻衣：抱歉各位，但这本就是主办人所设计的流程，而刻意隐瞒也是想看看各位侦探的观察能力。至于另一个功能，你们是否还记得日记中曾经提到过，六角馆门口被安置了炸弹……
      小岛浩一：当然记得，并且日记中提到他们推理社的6人都进行了确认，门口确实有触发式炸弹，六角馆的大门在后续5天将不能再被打开。
      山口麻衣：没错！可是各位有没有想过一个违和的问题，在那张写有‘门口安置了炸弹’的纸条被发现的那一刻开始，六角馆大门就已经不能再打开了，而整个六角馆没有任何‘窗户’存在，那么……
      新井直人：你是想说，从纸条被发现那一刻开始，众人就已经无法再走出建筑或者看到外界的一切了，那他们是如何确认建筑外的炸弹是否真正存在的？
      山口麻衣：正是如此。给大家一些提示吧，还记得一开始我便告知过各位，最初的两起案件《炸弹失窃案》和《坐标泄漏案》与后续的推理存在着关联，建筑的旋转功能可以视为《炸弹失窃案》的关联，而《坐标泄漏案》……
      北山诚一：山口小姐，我想我已经知道了您的暗喻，如果六角馆有着那样的功能，一切就都变得有趣了。
      明智邦彦：北山先生，你怎么又装起来了？又打哑谜！！是什么你倒是说出来啊？！！
      北山诚一：明智先生还请稍安勿躁，我认为比起一开始就把这些‘设定’怼到脸上，推理出设定的过程本身才是一件有趣的事情呢！
      小岛浩一：有趣与否先不谈，现实中也不会有人把所有的现场条件全部写到纸上，侦探存在的意义就是发现常人无法发现之处！确实是我们忽略了这个细节。
      岛田琉璃：明智邦彦看到没，你这半吊子侦探，好好学学大叔的觉悟吧！
      相泽翡翠：回到刚才的话题吧，馆里的众人在确认炸弹存在之后并没有离开六角馆，是不是可以说明，另一个功能只能帮助他们看到外界，但是却无法走出建筑？
      小岛浩一：我想也是如此，如果能离开，没人愿意留在随时可能葬身的险地，而六角大厅能够旋转，说明‘大厅’本身就是跟整个馆是半分离状态，而根据刚才山口小姐的提醒来看，《坐标泄漏案》的核心元素无非是‘电梯运动轨迹’，我猜测六角馆的另一个功能便与此相关吧？
      山口麻衣：真是厉害，我只是稍加提醒，各位就能接近真相了！那么接下来将为各位揭晓，六角馆的另一个功能——升降！
      山口麻衣说完，便拿出了一张大卡摆在了众人面前。
      明智邦彦：难道这就是传说中的【后置线索】？
    小剧场三: |
      北山诚一：这么来看，很明显吉田和真就是主要嫌疑人了。
      新井直人：因为他早早就不见了踪影，所以完全可以躲在众人的视野盲点中，对吧。
      相泽翡翠：没错，他完全可以在今早下雨前就躲在木屋1中，等待动手的时机。
      岛田琉璃：等7:20中村健去到木屋1后，吉田和真就杀死对方，并斩下对方的头颅，然后将头颅扔到木屋门前。
      明智邦彦：之后他就去到四角屋西侧。等长谷川悠人来到西侧小路后打晕长谷川，就是这么回事嘛，看来大家的想法都一样。
      小岛浩一：不，不对。根据长谷川悠人与山口麻衣的口供来看，他们两人中同样有一人具备作案的可能，比起不见踪影的吉田和真，我更愿意相信凶手在他们两人中。
      （众人面面相觑，似乎不愿相信小岛浩一的说法。）
      小岛浩一：我这么说，自然有我的道理。我将在20分钟后说出我关于‘凶手在他们两人中’的推理，不知道是否有人跟我看法一致。
      众人：……
