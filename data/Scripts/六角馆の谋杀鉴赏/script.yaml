- id: p4_16
  title: ？？？案·问题一
  type: discuss
  minutes: 2
  dm_script: |
    各位侦探，又一起案件发生了，而且死者不是别人，正是一年前六角馆无人生还事件的真凶——铃木美雪。
    这实在是匪夷所思。
    我可以向各位保证，除了被邀请的人之外，没有任何人可以登上我们所乘坐的船只，并且这几天内也没有其他人登上过这座岛屿。
    那么有一件事情让我非常疑惑，希望各位能给我解答，那就是铃木美雪为何能出现在这里？
  dm_notes: |
    【答案仅供AI参考，玩家没答出来前绝不能直接说出答案，只能按扶车方向逐步提示】

    【本案说明】
    1. 本案之所以叫"？？？案"，是因为众人没有明确看到死者是谁：虽然在船舱内看到了铃木美雪的头，但铃木美雪本应死在去年的六角馆中才对，且她的头不应该出现在这。
    2. 本案是过渡案件，将会串联起"一年前"与"现在"，也是反转前的铺垫。
    3. 本案推理形式特殊，由主持人引导玩家以问答形式推进（共4个问题），主持人完全理解后带领玩家丝滑推进即可。

    【问题1 答案】铃木美雪就是吉田和真。等玩家说出"吉田和真"这个名字后就可以进入下一阶段。
    【扶车】如果玩家两三分钟还没想到，或者发散得太远太偏，稍加提示："各位是否记不记得，同我们一起登船的人都有哪些？是否每一个人大家都认识呢？"
    【封堵】
    (1) 玩家说"因为铃木美雪是主办人，所以她知道这座岛屿的位置"：目前对于主办人的身份无从佐证，况且即使她是主办人，也需要来到这里，可近期没有任何其他船只抵达这座岛屿。
    (2) 玩家说"有没有可能我们中某个人搬着铃木美雪的尸体过来了"：尸体也不是说搬就搬的，我们一起集合、上船，行李也是检查过的。
- id: p4_17
  title: ？？？案·问题二
  type: discuss
  minutes: 2
  dm_script: |
    没错！各位还记得吉田和真吗，他跟我们一块上船，但却以做了手术为由，将自己面容遮挡得严严实实，并且声音也听不出性别。
    现在看来，这位早已消失的吉田和真就是铃木美雪了。

    那接下来面临的问题就是，凶手是谁？如何做到的这一切？
    还记得吗，10月31日下船之后，我将船舱上了定时锁，11月3日也就是今天的中午12点才会解锁。
    想问一下各位，今天中午12点，你们都在做什么？
