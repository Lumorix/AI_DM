    各位侦探，请大家翻开人物剧本，阅读【第三幕】。
    这一次请阅读到11月1日结束即可，先不要往后翻。
  dm_notes: |
    【BGM】切换为 Eau de Vie。
    【主持身份】主持人此时仍扮演山口麻衣（推理大会组织者）。
    【物料】玩家阅读人物剧本第三幕，只读到11月1日结束。读完后进入下一阶段再发放【调查档案】。

    【本轮人物剧本「信息点」整合&解读】
    1.「六角屋建于今年年初，结构与六角馆几乎一致，区别在于六角屋没有六角大厅，且六角屋没有任何机关」
       → 由此可知去年六角馆事件发生时还没有六角屋；众人都确认过，六角屋不存在任何机关，就是一个普通的DL-3合金建筑，没有大厅，中央是一片巨大的广场。
       → 还有一点很重要：在建筑外是分不清六角屋与六角馆的，因为外观一样。
    2.「今天一早你来到餐厅后便在桌子上看到了这张不明所以的纸条……」
       → 这其实就是长谷川给众人的预告，随后众人讨论起来。
       → 此处的时间线与中村健的死亡时间比对就可以证明：凶手只有可能是吉田和真、山口麻衣和长谷川悠人。
    3.「10:25 新井直人搀扶着他跟着众人进入四角屋……」
       → 本段时间线在中村健案中有"防跳关"的作用，详见中村健案推理阶段的说明（只给主持人看，不要向玩家提起"跳关"）。
