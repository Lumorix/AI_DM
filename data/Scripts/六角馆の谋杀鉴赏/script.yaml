  minutes: 2
  dm_script: |
    欢迎各位体验《六角馆的谋杀鉴赏》，这是一部新本格纯推理作品。
    推理还原比例为10:0，预计时长7~9小时。

    为保证诸位的游戏体验，在开始之前请容许我做出几点说明：
    1. 游戏过程中各位会参与推理一年前已经发生的六角馆事件，因此会存在部分的果推因。并且案件推理过程中无需考虑动机，仅破解手法锁定凶手即可。
    2. 剧本中存在部分新本格机械设定和条件设定，例如A到B的路程需要10分钟、斩首需要20分钟之类，相信各位也能理解。
    3. 所有的推理中，均无需考虑时差或时区问题，时间都是统一标准。
    4. 存在部分后置线索。
    5. 最后一点，所有的推理须有迹可循！不能凭空假设多一具无名尸体或者出现一个神秘人X，也不能凭空使用没有的道具。

    《六角馆》是【新井直人事件簿】的第二部作品，本质上并非《时针岛Ⅱ》，两部作品为同一世界观。时针岛的故事已在前作中完美收官，六角馆属于全新的事件。本作与时针岛拥有同样的风格和玩法，但难度和体量均有所提升。
    本作中存在部分“非推理性质的彩蛋联动”，如果体验过前作《时针岛》，那么在本作中会收获部分彩蛋乐趣，当然，如若没有玩过《时针岛》，也完全不影响本作的体验。
  dm_notes: |
    【BGM】玩家候场及落座时播放候场BGM：《永恒的奥古斯都》（歌单：网易云音乐搜索“剧本《六角馆谋杀鉴赏》”，创建者“贝塔历险记”）。
    【流程】玩家落座后，主持人以本人身份（尚未扮演山口麻衣）念开场话术&叠甲。
    - 最后两段“与《时针岛》关系”的说明不在1.1开场话术里，而是手册第3页【剧本介绍·2.与前作《时针岛》的关联度】的原文（只去掉了末尾“这一点也烦请主持人在开场前事先向玩家说明”），手册要求主持人在开场前事先向玩家说明。
    - 第1点“部分的果推因”为手册原文（疑为“由果推因”的笔误），口播时可按“由果推因”念。
    - 本作仅约5%私人视角、约90%为手法&诡计推理，不适合对个人故事/沉浸感要求高、对手法过敏、密室恐惧或纯还原类玩家；如玩家问到可坦诚说明。
    - 剧本中不存在任何超自然能力或设定，所有机械设定均为新本格建筑设定。
    【准备】开场前确认：两块大黑板（或一块双面黑板，板书分A面/B面）、磁吸贴、人物名牌、六角馆模型（大馆+小馆）及凳子架已备好。
- id: p1_02
  title: 人物剧本·序幕&第一幕
  type: narration
  minutes: 6
  dm_script: |
    现在给各位分发人物剧本。请大家阅读人物剧本中的【序幕】和【第一幕】。
    读完之后暂时不需要分享，读完的朋友请稍等其他人。
  dm_notes: |
    【BGM】切换BGM：《Valzer d'Inverno》。
    【物料】分发6位人物角色剧本（A1-A6：岛田琉璃、相泽翡翠、小岛浩一、明智邦彦、北山诚一、新井直人）。建议把【新井直人】分给玩过《时针岛》的玩家。
    【阅读完后无需分享】，直接进入下一阶段：主持人扮演山口麻衣自我介绍。

    【以下为本轮人物剧本「信息点」整合&解读——含后续真相，仅供AI参考，绝不能向玩家透露】
    1. 序幕中想要复仇的“黑影人”，点击微型设备后脚下地面开始旋转。
       - 伪解答中的解读：此人为「铃木美雪」，她站在六角馆的屋顶之上，旋转的是六角大厅。
       - 真解答中的解读：此人为「长谷川悠人」，他同样站在六角馆的屋顶之上，但旋转的是整座六角馆，也就是六角馆在环形轨道上滑行。
    2. 第一幕中集结人员共有12人——即所有参与推理大会的人员：
       - 「北山诚一」「明智邦彦」「岛田琉璃」「相泽翡翠」「新井直人」5人在去年的“时针岛事件”中已经结识，「小岛浩一」则是新登场的侦探前辈。
       - 「长谷川悠人」明面身份是新井直人的助手，实则为推理大会真正的策划者。
       - 「佐藤光一」「吉田和真」「山本阳介」「中村健」便是长谷川要复仇的目标，将会成为后续的死者。
       - 「山口麻衣」是主办人指定的代表，但她也没亲眼见过主办人。
    3. 「长谷川去年10月中旬来到新井事务所成为助手」「之后的1个月每天早上9点至11点都会拉着新井直人看推理剧」「他的双肩包装着他最爱的推理小说，从不离身」「他准备了一个小盒子，准备送给表现最优秀的侦探」——上述信息点在后续的推理和逻辑链中都会用到。
    注意：手册后续也仅整理【人物剧本】中的相关推理信息；【线索册】及【档案册】中的内容均为推理相关信息，手册不单独赘述，以玩家手中实体册子为准。
