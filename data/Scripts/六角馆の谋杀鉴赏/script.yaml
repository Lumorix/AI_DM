    ■ 第二颗头（跳关）的处理——非常重要
    - 主持人一定不要主动提出"第二颗头颅"！玩家没有意识到可以用第二颗头才是最好的效果。玩家不提，主持人就不要提。
    - 玩家可能提出"山口麻衣09:35看到的头不是中村健本人的头"或"长谷川09:10看到的头不是中村健的头"。不要否定这个想法本身（下一重解答里凶手真的用了第二颗头，此处直接否定会让玩家后面不舒服），让玩家继续推理并给出完整动线，再用客观条件否定（这些否定条件在下一重推理时会被瓦解）。
    - 铁打基点：10:40众人确认头颅一定是中村健的，所以就算有第二颗头，凶手最终还是要斩下中村健本人的头，玩家依然需要推理斩首中村健的动线。
    - 麻衣用第二颗头 → 见上面B（09:30打晕悖论）。
    - 长谷川用第二颗头（多半因为没破解"不进四角屋跨越南北"的小诡计）：先问玩家两个问题并引导——
      (1) 使用第二颗头的意义是什么？→ 麻衣09:00和09:25看到的南北来回脚印一定是长谷川本人的，无法伪造，脚印是第一优先级；长谷川要用第二颗头，一定是他09:35前无法同时完成"脚印+斩首中村健"，所以第二颗头的意义是09:35吓跑麻衣，再完成真正的斩首，即斩首完成时间得在09:35之后。
      (2) 10:30众人确认一定是中村健的头，凶手依然要斩下他的头，那动线是什么？→ 唯一能满足脚印的动线：
        07:45—08:00 在四角屋南门抽烟｜无｜麻衣在四角屋内
        08:00—08:10 四角屋→木屋2｜南侧去
        08:10—08:20 木屋2→四角屋｜南侧回
        08:20—08:35 在四角屋南门等待｜无
        08:35—09:00 在四角屋内｜无
        09:00—09:10 四角屋→木屋1，把备好的头放门口｜北侧去｜麻衣去木屋2，看到南侧来回脚印
        09:10—09:20 木屋1→四角屋（必须回来，不能留在木屋1斩首，否则缺少麻衣看到的北侧"回"脚印）｜北侧回｜麻衣在木屋2上5分钟厕所后返回
        09:20—09:35 在四角屋西侧躲着｜无｜麻衣09:25去木屋1，看到北侧来回脚印，到达后看到人头
        09:35—09:45 在四角屋西侧躲着｜无｜麻衣从木屋1返回四角屋
        09:45—09:55 四角屋→木屋1｜（被10:00的雨冲掉）｜麻衣去六角屋
        09:55—10:15 斩首｜无｜麻衣10:05到六角屋召集众人，众人10:05出发去四角屋
        10:15—10:25 木屋1→四角屋，路上给自己头上一板砖，10:25与众人会合｜北侧回
      → 悖论：10:01雨停、10:35才再下雨，这一段北侧回来的脚印一定会留下，但众人10:30从四角屋去木屋1时没看到任何脚印！此时众人不可能被误导方向（众人后续以木屋1为起点调查了整座岛屿，若去的是木屋2，不仅看不到中村健的头和尸体，后续认知也一定会出错，例如去六角屋却去到了西侧楼梯）。
      简化：第二颗头的意义要求09:45麻衣离开北侧后才去斩首；09:45后去斩首又一定会在10:15—10:25留下脚印，与10:30"北侧无脚印"矛盾。所以第二颗头没有任何意义，请玩家重新推理长谷川的真正动线。

    ■ 扶车方向（由浅到深）
    Q1：请注意山口麻衣的人设。
      A：麻衣恐血，看到头之后立马就跑了，没有进木屋1检查，因此长谷川此刻可以躲在木屋1内。而如果他此刻人在木屋1内，那么北侧脚印形成的顺序就应该是：先有木屋1到四角屋的，再有四角屋到木屋1的，否则长谷川人不可能出现在木屋1。
    Q2：从南到北或者从北到南，一定要经过四角屋吗？
      （这个问题尽可能不要问，指向特别明确，问了之后玩家很容易直接得出解答。玩家动线推理实在不擅长时再考虑问。）
      A：四角屋可以旋转任意角度，那么当它转45度会发生什么？——出现了一条通往南北的"新路径"。

    ■ 玩家答疑（本案答疑非常重要、问题会较多）
    Q1：山口麻衣9点出门时会不会已经被误导了方向？
      （刚开始推理时玩家问到不需要回答，让玩家自行判断；玩家带着"麻衣被误导了"的可能性去推理是正常流程，给予一定自由度。）
      A：不可能被误导，她去时一定是南边，也就是说9点时南侧一定要有长谷川来回的脚印。麻衣的动线是先去木屋2，再去木屋1，然后回到四角屋后一个左转去了六角屋召集众人。如果她第一次出门被误导、先去了木屋1再去木屋2，那从木屋2回到四角屋后一个左转就会去到西侧楼梯，根本找不到众人。因此麻衣9点出门后的方向认知一定客观正确。
    Q2：麻衣两次看到脚印，有可能是同一方向同一串吗？
      A：不可能。要把一个人的方向从北误导成南（或反之），至少需要人在四角屋内时旋转四角屋180度，可麻衣09:25从南侧回到四角屋后立即前往北侧木屋1，没在四角屋内停留，方向不可能被误导，两次去的一定是不同方向。
    Q3：四角屋旋转机制是什么？屋子上有可以挂住或攀爬的地方吗？
      A：可以理解为与六角大厅的旋转一样，顺时针/逆时针都可以，可随时停止；区别是四角屋旋转速度恒定，转一圈需要5分钟。四角屋6米高（手册原文此处写作"六角屋6米高"，按上下文指四角屋），线索中没有提及任何可攀爬或悬挂的设施，默认不可攀爬、不可悬挂。
    Q4：四角屋旋转时会在地上留下痕迹吗？
      A：不会。参考六角大厅，大厅地板高于建筑地板才能旋转；四角屋同理，地板略高于地面，旋转时不接触地面。
    Q5：新路径够过人吗？会留脚印吗？要考虑时间吗？
      A：旋转45度后新路径宽1米多，过一个人绰绰有余。在四角屋6×6正方形下方留下的脚印会被复位的四角屋挡住。凶手绕行时可以从西侧小路那个方向绕，麻衣没去过西侧，不会看到；众人检查整座岛屿时脚印早被雨水冲刷了。这段路不到10米，跑过去几秒钟，相较单程10分钟的南北小路可忽略不计。
    Q6：麻衣在北侧小路上，长谷川开门放头不会被看到吗？
      A：不会。第二幕上岛时就说过小路上布满密密麻麻的植被，严重遮挡视线，人在小路上看不见前方较远的事物；单程跑步都要10分钟的路，怎么也得1km以上，隔几百米且有植被遮挡，不可能看到长谷川把门开一点点放一颗头。
    Q7：小路上视线被遮挡，麻衣怎么看到脚印？凶手有没有可能尾随？
      A：麻衣口供说了，她是边走边看的脚印，不是站在原地一眼望到头。凶手有可能尾随，但没有意义，尾随就会留下脚印。
    Q8：脚印能半段半段完成吗（拼脚印）？
      A：不能。已明确不存在不连贯的情况。比如凶手07:55出发，08:00雨停时确实只留下半段，但另外半段永远不可能补齐——凶手不可能飞到路中间继续走，只要再次出发就一定会留下一段完整的脚印。
    Q9：凶手能搬着尸体跑吗？可以扔头吗？
      A：取决于怎么搬、扔多远，可以假设，只要能完成脚印+斩首。（实际上搬尸体和扔头对本案没有任何意义，只是现实中有一定可行性，直接否定会有"空气墙"的感觉。）
    Q10：长谷川雨中走路不会淋湿吗？湿了不会被怀疑吗？
      A：会湿。但湿了才正常——路上布满植被又下过雨，在路上穿行本来就会湿，全身干着反而不正常。
    Q11：木屋1与木屋2结构一样吗？里边的厕所能藏人吗？
      A：结构一样，都有厕所。厕所里可以躲，但如果有人在木屋里，此时有人从木屋大门进来就一定会发现；木屋内有尸体（不在厕所）也会被发现。
    Q12：需要考虑日记中"天气变化时间比真实晚10分钟"吗？
      A：不需要。日记明确写的是雾岛的天气变化比真实时间晚10分钟，而坐标定位可知我们在漂浮岛，两岛经度相差30度，不是同一座岛。
- id: p4_08
  title: 中村健案·答案揭晓
  type: narration
  minutes: 6
  dm_script: |
    关于山口麻衣是凶手的可能性探讨：
    如果山口麻衣为凶手，则长谷川口供为真。
    山口麻衣与长谷川悠人一共分开过两次：
    第一次：07:45—08:35
    第二次：09:00之后
    中村健07:10还活着，也就是说，山口麻衣需要在这两次分开之后，去斩下中村健的头。
    长谷川在09:10看到的头颅就一定是中村健的，而长谷川与麻衣第二次分开是在09:00，09:00—09:10麻衣根本无法完成斩首（斩首时间20分钟），因此麻衣的斩首时间只能在07:45—08:35之间。
    已知木屋1一定是斩首现场（调查档案第四条），因此麻衣一定需要在07:45之后出发前往木屋1斩首中村健。
    山口麻衣07:45—08:35斩首时间动线梳理：
    07:45—07:55，从四角屋到达木屋1，开始斩首，无脚印（在下雨）；
    07:55—08:15，斩首完成，无脚印（没走路）；
    08:15—08:25，从木屋1返回四角屋，留下北侧回来的脚印（雨停了）。
    通过动线可知，如果麻衣07:45去斩首中村健，那么一定会留下一条北侧木屋1回四角屋的脚印，而长谷川口供中说过：“09:00出发前往木屋1过程中没有看到任何脚印”。
    因此，山口麻衣无法完成斩首。

    那是否有可能长谷川被误导了方向，09:00去的是南边，所以没有看到麻衣在北侧留下的脚印？
    如果提出这一想法，就要考虑到长谷川07:45也就是第一次出门去的是南边还是北边了——因为他第一次不管去哪边，都会留下他自己来回的脚印，而他第二次出门说没有看到任何脚印，由此可以证明他两次出门去的不能是同一边。
    那如果第二次09:00去的是南边，第一次07:45去的就得是北边。
    如果长谷川第一次去的是北边，那么会得到一个终极悖论——长谷川人在木屋1里边，山口麻衣不可能在木屋1内斩首！

    关于山口麻衣无法作案的逻辑总结：
    1.长谷川09:00出门时没看到任何脚印
    此条信息证明了长谷川两次出门一定是不同方向，同时证明了麻衣无法在07:45—08:35去斩首中村健。
    原因如下：
    （1）若长谷川第一次去南，第二次去北，会看到麻衣留下的脚印。
    （2）若长谷川第一次去北，那长谷川人在木屋1，麻衣也无法在这里斩首。
    2.长谷川09:30在四角屋被打晕
    此条信息证明了山口麻衣无法09:00出发去斩首，因为往返20分钟+斩首20分钟，再次回到四角屋最早已经09:40了。
    并且也不能09:30打晕长谷川后再去斩首，这样的话无法在10:05通知众人。
    综上，山口麻衣无法作案。

    长谷川作案手法的复盘：
    已经证明了山口麻衣无法作案，那么本案的凶手解答便只能是长谷川。
    1.小诡计的破解
    小诡计1：山口麻衣的人设是恐血，且众人都知晓，因此她在木屋1门口看到头颅后一定不敢靠近，因此，凶手此时是可以躲在木屋1内的。
    这也是为什么凶手要将人头放置在门口的原因。
    小诡计2：如果从北侧小路到南侧小路，一定要经过四角屋内部的话，本案长谷川的动线不可能成立，因为长谷川一旦经过四角屋内部，必定会被麻衣看到，所以需要有不经过四角屋但能跨越“南北”的方法。
    已知四角屋与路的宽度都是6米，并且四角屋可以旋转且旋转角度可控。
    那么，假设将四角屋旋转45度后停住会发生什么？
    没错，会多出一条连通东南西北的路径！
    有了这条路径，长谷川便可以不进入四角屋却能穿行于南北之间了。
    至于之前“山口麻衣作为凶手”的情况为何不考虑这段路径，因为她作为凶手的逻辑都走不到这一步，长谷川的视角信息已经将她的行凶可能全面否定了。

    2.长谷川作案动线复盘
    长谷川07:45出门前已经将四角屋旋转了180度，他从山口麻衣认知中的四角屋南门出去，实际上是去到了北侧。
    长谷川07:45从北侧出发前往木屋1，07:55到达，在这杀害中村健，但是不斩首，原地等雨停。
    08:00雨停后，长谷川从木屋1返回四角屋，路途中就可以旋转四角屋，转45度，08:10到达四角屋，留下了北侧回来的脚印。
    随后从“开辟的新路径”绕过四角屋，往木屋2走，08:20到达木屋2，留下了南侧去的脚印。
    08:20—08:30返回到四角屋，留下南侧回来的脚印。
    将四角屋复原，然后在门口等到08:35，进入四角屋。
    09:00，长谷川从北侧去往木屋1，留下了北侧去的脚印。
    09:10到达，开始斩首，09:30斩首完，将中村健的头放在木屋1门口，自己躲在屋内，等山口麻衣09:45去东侧小路的时候，自己再返回四角屋，然后给自己的头来一板砖，等待众人的到来即可。
    10:00—10:01下了一场雨，之前所有的脚印都会被冲刷掉。
  dm_notes: |
    【板书/展示】可在白板上画出（或口述）长谷川与山口麻衣的对照动线表（见上一阶段dm_notes"长谷川的作案动线（正解）"表）。
    【小诡计2图示】手册此处配图：四角屋旋转45°后，屋角与路边之间多出的新路径宽度约为1.25米。讲到"会多出一条连通东南西北的路径"时可在白板上画出示意。
    【勘误】手册原文"08:10到达后木屋1，留下了北侧回来的脚印"有笔误，按动线表（08:00—08:10 从木屋1返回四角屋）应为"08:10到达四角屋"，dm_script 已按此写。
    【说明】dm_script 中删去了手册复盘里"如果山口麻衣不使用第二颗头""假设山口麻衣使用第二颗头颅"等涉及第二颗头的部分（手册要求主持人不主动提第二颗头）；若玩家提出过，按下面补充。
    【麻衣逻辑整理（可写在白板上）】
      长谷川9点看到的头就是中村健本人
      → 麻衣只能在07:45—08:35斩首
      → 一定会留下北侧路上的脚印
      → 长谷川9点没看到脚印
      → 长谷川9点去的是南边
      → 长谷川07:45去的是北边（两次不能同一方向，会看到自己的脚印）
      → 麻衣无法在木屋1斩首（已知木屋1是斩首现场）
      → 麻衣无法作案
    【第二颗头——只有玩家在推理中自己提出过时才补充】
      若玩家提出过"第二颗头"，可在讲完麻衣部分后补充：综上，无论麻衣是否有"第二颗头"，都无法完成作案（第二颗头只能让她09:00后再斩首，但09:30长谷川在四角屋被打晕，她赶不回来）。
      若玩家提出过"长谷川用第二颗头"，补充上一阶段dm_notes中"10:15—10:25回程脚印 vs 众人10:30看到北侧无脚印"的悖论。
      玩家整场都没提第二颗头，就绝对不要提（下一重解答中凶手真的用了第二颗头）。
    【说明】玩家若提出与上述不同的动线猜想，结合已知条件合理否定即可。
