  dm_script: |
    下面复盘第二案——加藤健一案。
    【作案手法破解】
    本案的手法总结：拼钥匙+还钥匙。
    第一步（谜面一）：女佣看到了15号房钥匙在房间内，为什么打不开门？
    谜面一解答：
    凶手在23点左右杀死加藤健一，刮花他的脸，在餐厅放好杀人留言。
    然后用一把其中一面印有X的钥匙（10号以上房间的钥匙），再到玄关处拿到5号房的钥匙（两面都印有V），将两把钥匙贴合到一起，放在加藤健一房间的玻璃书柜上，伪装成15号房的钥匙（一面印有X，一面印有V）。
    然后走出房间，用真正的15号房钥匙将房门上锁，回到自己房间。
    第二步（谜面二）：管家搜身后众人进入15号房，钥匙如何还回来？
    谜面二解答：
    02:10视频结束，众人被管家召集在15号房间门口集合，一个一个搜身后进入15号房，凶手一定无法把钥匙携带在身上带进房间内，且所有人进去后，管家关上了门，直到真钥匙被找到，门也没有开过。
    凶手去集合前，先将钥匙挂在挂钩上，然后搜身进入15号房间。因为女佣并不在，只有凶手知道拼装的假钥匙放在哪，所以第一个去回收即可。
    大家都在找钥匙的时候，凶手再将门上的小窗打开，将六角大厅旋转，将挂钩所在的那个角转到正对加藤健一的房门的位置，此时挂钩距离房门的距离仅有40cm，人在房间内将手从小窗伸出去就能拿到钥匙。
    【凶手锁定】
    此手法除了5号房的钥匙外，还需要一把单面印有X的钥匙，6人中能有这把钥匙的人只有小林纪子，她的钥匙两面都印有X，所以锁凶小林纪子。
  dm_notes: |
    【演示】可在白板上画两把钥匙贴合的示意（X面朝外＋V面朝外＝看起来像XV/15号）。旋转部分用六角大厅磁吸贴或大馆模型演示：旋转大厅，使挂钩所在的大厅角正对15号房门（手册第28页原图：大厅转动后，大厅的一个角正对右下边“加藤健一”房门（门画成红色），角与房门之间标注“40cm”）。
    【注意】手册原注：40cm这个数据不需要玩家计算，只是用来验证手法可行性的，玩家推理出将钥匙挂在挂钩上，旋转大厅，从小窗拿钥匙即可。
    【板书】在白板A第二案“凶手”处贴上小林纪子的名牌。
    【复盘后答疑】钥匙不可能藏在身上带进去（管家仔细搜身，搜一个进一个）；40cm数据不需要玩家计算，大厅既然能旋转，墙就不会撞到对面房间墙壁。
    【注意】只宣布为本轮（第一重）的解答，不要暗示后续还会有变化。
