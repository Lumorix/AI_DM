    管家00:50看到杀人留言后从大厅4号门出来，去到了空房间门口敲门并尝试开门（管家的认知中这里就是11号山田莉子的房间），发现打不开后又回到了大厅内。
    待管家回到大厅后凶手将大厅旋转复位，将5号门解锁并将钥匙还回玄关。
    03:00管家从大厅4号门出来遇到女佣，两人一起来到11号房门口，直接用万能钥匙打开了11号门（房门此时并未上锁），进入后发现了尸体和此房间的钥匙。
    【凶手锁定】
    管家00:50发现的密室，想要误导管家对房间的认知，让他第一次去到错误的房间，只有在00:00-00:50这段时间旋转大厅才行，而清水伊织的日记中说“00:00-01:00大厅机关未触发”，日记撒谎，因此锁凶清水伊织。
    【作案细节的补充】
    放杀人预告的信封可以在23:00之前就完成，23:00凶手来到山田莉子房间敲门，待开门后打晕她，用铁链捆住她并吊在墙上的短刀前，将她的身体刺入短刀，并刮花她的脸。
