# 复制本文件为 config.yaml 后修改。
# 所有模型都用 OpenAI 兼容接口，换模型只需改 base_url / api_key / model 三行。

llm:
  provider: mock          # mock = 不接AI、只测流程；接AI时改成 openai（指“OpenAI兼容格式”，不是只能用OpenAI）
  base_url: https://api.deepseek.com/v1
  api_key: ""             # 填你的key；也可以不填，改用环境变量 JUBENSHA_API_KEY
  model: deepseek-chat
  temperature: 0.7
  timeout: 180            # 秒；本地模型慢可以调大
  max_tokens: 1500

  # 可选：记忆压缩（摘要）这种简单活交给便宜/本地模型，省钱。删掉这一段就全部用上面的模型。
  # cheap:
  #   base_url: http://localhost:11434/v1
  #   api_key: ollama
  #   model: qwen2.5:7b

# ---------------- 常用配置示例（把对应几行复制到上面 llm 里） ----------------
# 本地 Ollama（先装 Ollama，再在命令行 ollama pull 你要的模型）：
#   provider: openai
#   base_url: http://localhost:11434/v1
#   api_key: ollama
#   model: qwen2.5:14b          # 换成 ollama list 里看到的名字
#   timeout: 600
#
# 本地 LM Studio（在 LM Studio 里开启 Local Server）：
#   provider: openai
#   base_url: http://localhost:1234/v1
#   api_key: lm-studio
#   model: 你加载的模型名
#
# DeepSeek：
#   provider: openai
#   base_url: https://api.deepseek.com/v1
#   model: deepseek-chat
#
# 通义千问（阿里云百炼）：
#   provider: openai
#   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
#   model: qwen-plus
#
# Claude（OpenAI 兼容层；不支持 prompt 缓存）：
#   provider: openai
#   base_url: https://api.anthropic.com/v1
#   model: claude-sonnet-5-5
#
# 推理模型（Qwen3、DeepSeek-R1 等）输出的 <think> 思考过程会被自动去掉，不会念出来。

# OCR 用视觉模型时的设置（tools/ocr.py --engine vision）；不填就用上面 llm 的设置
vision:
  # base_url: http://localhost:11434/v1
  # api_key: ollama
  # model: qwen2.5vl:7b

game:
  narration: ai           # ai = AI润色后念主持词；verbatim = 原文照念（最稳，不会说错）
  memory:
    keep_recent: 30       # 最近多少条公开事件原样给AI
    summarize_batch: 20   # 超出后每攒多少条压缩一次进摘要
    private_keep: 12      # 每个玩家最近多少条私聊原样给AI

server:
  host: 0.0.0.0
  port: 8000
