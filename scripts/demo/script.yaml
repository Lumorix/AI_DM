# ============================================================
#  示例剧本：《听涛居》（原创短本，4人，约60-90分钟）
#  用来测试系统。正式剧本照着这个格式写，详见 scripts/_template
# ============================================================

meta:
  title: 听涛居
  players: 4
  intro: 1998年深秋，海岛旅馆"听涛居"的老板周伯年死在书房。台风封岛，凶手就在你们四人之中。

dm:
  # 完整真相：只给AI看，复盘前绝不会直接说出来
  truth: |
    凶手是账房先生陆子川。
    陆子川三个月来一直挪用旅馆的钱。案发当晚21:30左右，周伯年在书房对账时发现了亏空，
    当面质问陆子川，并说"明早就报警"。21:45周伯年去码头检查船只（台风要来）。
    陆子川趁书房没人，21:50拿着油灯溜进书房，把仓库里的老鼠药（砒霜类）掺进周伯年专用的茶叶罐。
    画家许然当时在二楼窗边画画，看到码头有周伯年的身影，同时书房窗户亮着灯——这是关键矛盾：
    主人不在，书房却有人。
    22:15周晴去书房和父亲吵了一架（为了卖旅馆），22:25离开。
    22:40厨娘沈梅照例用那罐茶叶给老爷泡茶，她并不知道茶叶有毒。
    约23:00周伯年毒发身亡，23:10沈梅收茶具时发现尸体。
    红鲱鱼：周晴的卖楼合同（动机但无作案）；沈梅的安眠药（不是毒药）。
  # 主持风格
  style: |
    语气沉稳、有悬念感，像民国旧宅里的说书人。
    控场时简短有力，不抢玩家的推理。
    玩家问剧本里没有的内容时，含糊带过或说"剧本中没有提到"，不要编造新的关键事实。
  # 复盘前回复里一旦出现这些字样会被拦截（防剧透）
  forbidden:
    - 凶手是陆子川
    - 陆子川是凶手
    - 陆子川下的毒
    - 陆子川投毒
    - 陆子川掺进

characters:
  - id: zhouqing
    name: 周晴
    public: 死者的独女，26岁，在上海做事，这次回岛是为了劝父亲卖掉旅馆。
    secret_brief: 当晚22:15-22:25去书房和父亲吵架，想卖旅馆还债（她在上海欠了钱）。她不是凶手，但怕被怀疑而想隐瞒吵架的事。
    book:
      act1: |
        你是周晴。你在上海的生意失败，欠了一笔不小的债。
        你回到岛上，是想说服父亲把听涛居卖给一家开发商，对方出价很高。
        今晚22:15，你去书房找父亲，再提卖楼的事，两人大吵一架。
        你进去时茶还没送来，桌上只有一个茶叶罐和一摞账本，父亲脸色很难看，像刚生过一场大气。
        22:25你摔门离开，回了自己房间。
        你不是凶手。但吵架这件事说出来，所有人都会怀疑你。你可以选择隐瞒或坦白。
      act2: |
        你想起一件事：吵架时父亲说了一句"家里一个个都在算计我的钱"，
        你当时以为他是在说你，现在想来，"一个个"好像不止你一个人。
        你的目标：找出真凶，同时尽量不让卖楼合同的事成为别人攻击你的把柄。
  - id: luzichuan
    name: 陆子川
    public: 听涛居的账房先生，35岁，在旅馆做了八年，做事一丝不苟。
    secret_brief: 他就是凶手。挪用公款被发现，21:50潜入书房在茶叶罐里下了老鼠药。他会撒谎说21:30后一直在账房对账。
    book:
      act1: |
        你是陆子川，你就是凶手。
        这三个月你挪用了旅馆的钱去填赌债。今晚21:30，老爷在书房把你叫去，指着账本质问你，
        说明早就报警。
        21:45老爷去码头看船。你从仓库拿了一包老鼠药，21:50提着油灯溜进书房，
        把药掺进了老爷专用的那罐茶叶里。你知道沈梅每晚22:40都会用这罐茶给老爷泡茶。
        之后你回到账房，假装一直在对账。
        你的目标：隐藏身份，把怀疑引向别人。你可以说谎。
        对外口径：21:30后你一直在账房，没出过门。
      act2: |
        危险：你房间里那包老鼠药少了一些，如果被搜出来，你可以说是前几天仓库闹老鼠用掉的。
        账本有你的涂改痕迹，懂账的人一看就能发现。
        小心画家许然——他当晚一直在二楼窗边画画，不知道看到了什么。
  - id: shenmei
    name: 沈梅
    public: 听涛居的厨娘，50岁，跟了周家二十年，每晚给老爷泡茶。
    secret_brief: 22:40用书房那罐茶叶给老爷泡了茶，不知道有毒。她自己有安眠药（失眠），怕被误会。23:10发现尸体。
    book:
      act1: |
        你是沈梅。二十年来，你每晚22:40都会去书房给老爷泡一壶茶，用的是老爷专用的那个青花茶叶罐。
        今晚也一样。你进去时老爷脸色很差，一句话没说。你泡好茶就退出来了。
        23:10你去收茶具，发现老爷倒在书桌旁，已经没气了。
        你不是凶手。但茶是你泡的，大家第一个就会怀疑你。
        另外，你长期失眠，厨房柜子里有一瓶安眠药，你怕被人翻出来说不清。
      act2: |
        你想起来：22:40进书房时，你闻到一股淡淡的油灯味，可老爷一向只用电灯（岛上有发电机）。
        书房里谁点过油灯？
  - id: xuran
    name: 许然
    public: 住店的画家，30岁，来岛上写生一个月了，房间在二楼，窗户正对书房和码头。
    secret_brief: 21:50在窗边画画时看到码头上有周伯年的身影，同时书房窗户亮着昏黄的光（油灯）。这是破案关键，但他一开始没意识到。
    book:
      act1: |
        你是许然，一个穷画家。你在听涛居住了一个月，周老板人不错，房钱经常让你拖着。
        今晚你一直在二楼窗边画夜景速写，从窗户能看到楼下书房的窗和远处的码头。
        你没有离开过房间。
        你不是凶手。你和周老板没有任何矛盾。
      act2: |
        翻看今晚的速写本，你发现一张21:50左右画的画：
        码头上有一个打着手电的人影，看身形和那件旧呢子大衣，是周老板；
        可同一张画里，书房的窗户却亮着昏黄的光，不像电灯，更像油灯。
        老板在码头，那书房里的人是谁？

clues:
  - id: c1
    title: 茶杯残渣
    text: 书桌上的茶杯里残留着茶水，有一股淡淡的苦杏仁味。经检验，茶中有剧毒。
    public: true
  - id: c2
    title: 青花茶叶罐
    text: 老爷专用的青花茶叶罐。罐中剩余的茶叶里也检出了同样的毒——毒是下在茶叶里的，不是泡茶时加的。
  - id: c3
    title: 账本
    text: 近三个月的账目有多处涂改，笔迹工整，像是精通账目的人做的。合计亏空一大笔钱。
  - id: c4
    title: 未写完的信
    text: 书桌抽屉里一封未写完的信，收信人是镇上的律师："……账上的事我已查清，明早即报警，此人……"后面没写完。
  - id: c5
    title: 卖楼合同
    text: 周晴房间里的一份旅馆买卖合同，买方是上海一家开发商，卖方签名处空着。
  - id: c6
    title: 安眠药瓶
    text: 厨房柜子里一瓶安眠药，标签写着沈梅的名字。经比对，与茶中的毒物不是同一种东西。
  - id: c7
    title: 老鼠药
    text: 陆子川房间床底一包老鼠药，明显被拆开用过一部分。
  - id: c8
    title: 码头上的烟斗
    text: 码头系船柱旁掉着周伯年的烟斗。船夫说老爷21:45左右来检查过船，待了十来分钟。
  - id: c9
    title: 许然的速写
    text: 一张标注"21:50"的夜景速写：码头上是周伯年的身影，书房窗户却亮着昏黄的油灯光。
    # 这张不放在搜证地点里，而是让AI在问答中视情况发放
    condition: 有玩家询问当晚窗外看到的景象、许然的画、或书房的灯光时可以给出

phases:
  - id: opening
    title: 开场
    type: narration
    minutes: 3
    dm_script: |
      1998年深秋，台风"海燕"逼近，听涛居所在的小岛与外界断了联系。
      晚上23:10，厨娘沈梅在书房发现了旅馆老板周伯年的尸体。
      电话线已断，船也出不去。凶手，就在今晚留在旅馆的四个人当中。
      请各位在手机上选择自己的角色，准备阅读剧本。
    dm_notes: 等所有人选好角色。不要透露任何线索。

  - id: read1
    title: 第一幕阅读
    type: reading
    minutes: 12
    unlock: act1
    dm_script: |
      请各位阅读手机上的第一幕剧本。记住，除了你自己，任何人都可能说谎。
    dm_notes: 阅读阶段，玩家私问只解答规则和自己剧本里不明白的地方。

  - id: intro
    title: 自我介绍
    type: discuss
    minutes: 10
    dm_script: |
      请每位依次做自我介绍，说说你和周老板的关系，以及今晚21点之后你都在做什么。
    dm_notes: 引导每个人讲时间线。有人沉默时可以点名。

  - id: search1
    title: 第一轮搜证
    type: search
    minutes: 10
    dm_script: |
      第一轮搜证开始。每人有2次搜证机会，可以搜查书房、厨房和码头。
      搜到的线索默认只有你自己能看到，你可以选择公开。
    search:
      points: 2
      locations:
        - id: study
          name: 书房
          clues: [c1, c2, c4]
        - id: kitchen
          name: 厨房
          clues: [c6]
        - id: pier
          name: 码头
          clues: [c8]
    grantable: []
    dm_notes: 茶杯残渣c1会自动公开。

  - id: discuss1
    title: 第一轮讨论
    type: discuss
    minutes: 15
    dm_script: |
      搜证结束。请大家交流线索，梳理案发前后的时间线。
    dm_notes: 如果讨论卡住，可以提示大家注意"毒在茶叶里还是茶水里"。

  - id: read2
    title: 第二幕阅读
    type: reading
    minutes: 8
    unlock: act2
    dm_script: |
      夜更深了，风浪拍打着窗户。有人想起了一些之前忽略的细节……
      请阅读第二幕剧本。
    dm_notes: 阅读阶段。

  - id: search2
    title: 第二轮搜证
    type: search
    minutes: 10
    dm_script: |
      第二轮搜证开始。这次可以搜查各人的房间和账房，每人2次机会。
    search:
      points: 2
      locations:
        - id: room_zhou
          name: 周晴的房间
          clues: [c5]
        - id: room_lu
          name: 陆子川的房间
          clues: [c7]
        - id: office
          name: 账房
          clues: [c3]
    grantable: [c9]
    dm_notes: 如果有人问起当晚窗外看到什么、许然的画或书房灯光，可以把c9给提问的人。

  - id: discuss2
    title: 最终讨论
    type: discuss
    minutes: 15
    dm_script: |
      所有线索都已出现。这是最后的讨论时间，请锁定你心中的凶手。
    grantable: [c9]
    dm_notes: 不要替玩家推理。最多提示"油灯"和"主人不在时书房的灯"这两个方向。

  - id: vote
    title: 投票
    type: vote
    minutes: 3
    dm_script: |
      请在手机上投出你认为的凶手。投票不可更改。
    vote:
      question: 谁是杀害周伯年的凶手？
      answer: luzichuan

  - id: reveal
    title: 真相复盘
    type: reveal
    minutes: 10
    dm_script: |
      投票结束，现在揭晓真相。
    dm_notes: 结合投票结果和大家在游戏中的表现，完整讲述真相和时间线。

endings:
  correct: 你们识破了陆子川的伪装。台风过后，警察登岛，陆子川对挪用公款和投毒供认不讳。
  wrong: 真凶陆子川逃过了审判。台风过后，他带着账本消失在了海上，再也没人见过他。
